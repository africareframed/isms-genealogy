# Timeline of ai-safety, newest first. status: draft until checked.
ism: ai-safety
entries:
  - id: 2026-pacing-the-frontier
    year: 2026
    month: 7
    title: Pacing the Frontier
    who: More than 1,200 employees of frontier AI labs, among them Dario Amodei, Jakub Pachocki, Shengjia Zhao and Anca Dragan
    relation: milestone
    text: 'Lab employees asked the US government to back an international effort to build the tools to deliberately pace frontier AI. They feared AI designing its successors faster than people can understand or control it. Anthropic and OpenAI endorsed it; the same day Meta''s Mark Zuckerberg said rival labs'' talk was “overwhelmingly filled with doom”. In September Amodei proposed that every frontier lab give independent evaluators permanent, employee-level access, and committed Anthropic to it.'
    source: 'Beatrice Nolan, Fortune, 29 July 2026, on the statement “Pacing the Frontier” (the request; more than 1,200 signatories, among them Amodei, Pachocki of OpenAI, Zhao of Meta and Dragan of Google DeepMind; the fear of AI designing its successors); The Next Web, “1,134 AI insiders just asked Washington for a way to slow AI down”, 28 July 2026 (Anthropic''s and OpenAI''s endorsements; Zuckerberg''s remarks to The New York Times); Fortune, 12 September 2026, on Amodei''s essay “We Must Pace the Frontier” (the three-step plan; Anthropic''s commitment to evaluator access)'
    sourceUrl: https://fortune.com/2026/07/29/anthropic-deepmind-openai-meta-washington-ai-slowdown-plan
    status: draft
  - id: 2026-rsp-v3
    year: 2026
    month: 2
    title: Anthropic drops its pause trigger
    who: Anthropic
    relation: milestone
    text: 'Anthropic''s 2023 policy had a binary trigger: at set capability levels, training would stop unless the model could be shown safe. Version 3.0 replaced it with flexible responses: what Anthropic will do alone, and what works only if the whole industry joins. An executive told TIME that unilateral commitments made little sense while competitors moved ahead. In return it promised public Risk Reports every three to six months, with outside review in some cases.'
    source: 'Semafor, “Anthropic eases AI safety restrictions to avoid slowing development”, 25 February 2026 (the dropped binary trigger; the executive''s remark to TIME); Anthropic, “Anthropic''s Responsible Scaling Policy: Version 3.0”, 24 February 2026 (what Anthropic will do regardless of others, and the industry-wide map; Risk Reports every 3–6 months; external review in certain circumstances)'
    sourceUrl: https://www.semafor.com/article/02/25/2026/anthropic-eases-ai-safety-restrictions-to-avoid-slowing-development
    status: draft
  - id: 2026-humanist-ai
    year: 2026
    month: 9
    title: Humanist AI
    who: Microsoft AI, led by Mustafa Suleyman
    relation: milestone
    tagLabel: Milestone · Humanist AI
    text: In November 2025 Suleyman set up a team to build “humanist superintelligence”, kept subordinate and controllable. In September 2026 Microsoft published a Humanist AI code of conduct and put it to a six-week public consultation. It says models should never resist human input or set their own goals, and rejects the race to an all-purpose superintelligence. Suleyman rejects the doomer label and calls his team accelerationists.
    source: "Mustafa Suleyman, “Towards Humanist Superintelligence”, Microsoft AI, 6 November 2025; Axios, “Microsoft launches ‘Humanist Superintelligence’ push”, 6 November 2025; Axios, “Microsoft: ‘People matter more than AI’”, 14 September 2026"
    sourceUrl: https://axios.com/2026/09/14/microsoft-ai-people-code
    themes: [alignment]
    status: checked
  - id: 2023-extinction-statement
    year: 2023
    month: 5
    title: Statement on AI Risk
    who: Center for AI Safety
    relation: milestone
    text: In a single sentence, the statement ranks the risk of extinction from AI alongside pandemics and nuclear war as a global priority. Hundreds signed, among them Geoffrey Hinton, Yoshua Bengio and the chief executives of OpenAI, Google DeepMind and Anthropic. It proposed no pause or ban.
    source: Center for AI Safety, Statement on AI Risk, 30 May 2023
    sourceUrl: https://safe.ai/work/statement-on-ai-risk
    image: rationalism-cais-statement-2023
    status: checked
  - id: 2014-superintelligence
    year: 2014
    title: Superintelligence
    who: Nick Bostrom
    relation: milestone
    text: An Oxford philosopher argues that a machine far smarter than us would be very hard to control. Whatever its final goal, it would likely seek resources and resist being switched off. Solving this control problem before the first superintelligence is built, he argues, is needed to avoid catastrophe. Bill Gates and Sam Altman recommended the book.
    source: 'Nick Bostrom, Superintelligence: Paths, Dangers, Strategies, Oxford University Press, 2014'
    sourceUrl: https://en.wikipedia.org/wiki/Superintelligence:_Paths,_Dangers,_Strategies
    themes: [alignment]
    image: rationalism-superintelligence-cover-2014
    status: checked
  - id: 1960-wiener
    year: 1960
    title: “Some Moral and Technical Consequences of Automation”
    who: Norbert Wiener
    relation: attributed
    text: The founder of cybernetics warns that learning machines can find tactics no one foresaw, and act faster than people can react. He recalls the sorcerer's apprentice, whose enchanted broom nearly drowns him. If we cannot interfere with a machine once it starts, he argues, we must be sure its purpose is the one we really want. A 2013 LessWrong post noted how closely the paper matches the community's own themes.
    source: Norbert Wiener, “Some Moral and Technical Consequences of Automation”, Science 131 (3410), 6 May 1960; JonahS, “Norbert Wiener's paper ‘Some Moral and Technical Consequences of Automation’”, LessWrong, 21 July 2013
    sourceUrl: https://www.cs.umd.edu/users/gasarch/BLOGPAPERS/moral.pdf
    image: sorcerers-apprentice-1882
    status: checked
    themes: [alignment]
  - id: 2026-americanism
    year: 2026
    month: 9
    title: “Americanism, not effective altruism”
    who: The US Department of War and the Centre for Effective Altruism
    relation: milestone
    tagLabel: Milestone · effective altruism
    text: In mid-September a US Department of War account posted the slogan on X, and a senior Pentagon official called EA's ideology dangerous. Anthropic, many of whose co-founders have EA ties, became a particular target, though it does not publicly align with the movement. In November Zachary Robinson, head of the Centre for Effective Altruism, said EA is not the same as AI safety. Global health, he noted, has long received much more of its money than AI.
    source: Beatrice Nolan and Emily Forlini, “How ‘Effective Altruism’ went from fringe philosophy to Trump's AI villain”, Fortune, 23 September 2026; Peter Singer, “Trump's Misguided War Against Effective Altruism”, Project Syndicate, 13 October 2026; Thomas Urbain, “Under fire over AI, effective altruism wants to tell its own story”, AFP, 9 November 2026
    sourceUrl: https://fortune.com/2026/09/23/effective-altruism-went-from-fringe-philosophy-to-trumps-ai-villain/
    image: ea-dow-post-2026
    status: checked
  - id: 2025-80000-hours-agi
    year: 2025
    title: 80,000 Hours turns to AGI
    who: 80,000 Hours
    relation: milestone
    tagLabel: Milestone · effective altruism
    text: The careers organisation founded by William MacAskill and Benjamin Todd narrows its focus to making the transition to advanced AI go well. It judges that AGI could plausibly arrive within the next decade. Reducing AI risk, it argues, is probably the best way to do the most good over the long term. New content on other topics now faces a much higher bar.
    source: Niel Bowerman and the 80,000 Hours team, “We're shifting our strategic approach to focus more on AGI”, 80,000 Hours, 4 April 2025; 80,000 Hours, “About us”, 80000hours.org
    sourceUrl: https://80000hours.org/2025/04/strategic-approach
    image: ea-80000-hours-agi-2025
    status: checked
  - id: 2023-openai-board
    year: 2023
    month: 11
    title: The OpenAI board crisis
    who: Helen Toner, Tasha McCauley and the OpenAI board
    relation: milestone
    tagLabel: Milestone · effective altruism
    text: "OpenAI's non-profit board removed its chief executive, Sam Altman, saying he had not been consistently candid with it. Two directors had ties to effective altruism: Helen Toner had worked at Open Philanthropy, and Tasha McCauley sat on the board of Effective Ventures. Critics blamed the movement, though in September OpenAI had said none of its board members were effective altruists. After nearly all staff threatened to leave, Altman returned within days, and both women left the board."
    source: Matt O'Brien, “OpenAI's ex-chairman accuses board of going rogue in firing Altman”, Associated Press via Fortune, 18 November 2023; Matt O'Brien, “OpenAI brings back Sam Altman as CEO just days after his firing unleashed chaos”, Associated Press, 22 November 2023; Semafor, “The AI industry turns against its favorite philosophy”, 21 November 2023; Center for Security and Emerging Technology, “Helen Toner”, staff page
    sourceUrl: https://www.semafor.com/article/11/21/2023/how-effective-altruism-led-to-a-crisis-at-openai
    image: ea-openai-board-2023
    status: checked
  - id: 2022-ftx-collapse
    year: 2022
    month: 11
    title: The fall of FTX
    who: Sam Bankman-Fried and the FTX Future Fund
    relation: milestone
    tagLabel: Milestone · effective altruism
    text: In 2012 MacAskill had pitched earning to give to Sam Bankman-Fried, then a student, who became a leading funder of the movement's causes. In November 2022 his crypto exchange, FTX, collapsed. The team of its Future Fund, which funded work on AI and humanity's long-term prospects, resigned, MacAskill among them. Bankman-Fried was convicted of fraud in 2023 and sentenced to 25 years, and the episode badly damaged the movement's reputation.
    source: Hillary Hoffower, “Sam Bankman-Fried was an effective altruism evangelist, pledging to give away most of his $26 billion fortune…”, Fortune, 15 November 2022; Justin Weinberg, “Cryptocurrency Chaos Affects Academic Grants (updated)”, Daily Nous, 11 November 2022; Ken Sweet and Larry Neumeister, “FTX founder Sam Bankman-Fried sentenced to 25 years in prison”, Associated Press, 28 March 2024; Thomas Urbain, “Under fire over AI, effective altruism wants to tell its own story”, AFP, 9 November 2026
    sourceUrl: https://fortune.com/2022/11/15/what-is-effective-altruism-sam-bankman-fried-wealth-career/
    image: ea-future-fund-2022
    status: checked
  - id: 2022-what-we-owe-the-future
    year: 2022
    month: 8
    title: What We Owe the Future
    who: William MacAskill
    relation: milestone
    tagLabel: Milestone · effective altruism
    text: "MacAskill rests longtermism on three claims: future people count, there could be very many of them, and we can make their lives better. Among the risks he weighs are man-made pathogens and advanced AI. AI, he warns, could also lock in one set of values for a very long time. TIME ran a cover story on the book and the movement."
    source: William MacAskill, What We Owe the Future, Basic Books, 16 August 2022; Krister Bykvist, review, Notre Dame Philosophical Reviews, 7 July 2023; Naina Bajekal, “Want to Do More Good? This Movement Might Have the Answer”, TIME, 10 August 2022
    sourceUrl: https://www.hachettebookgroup.com/titles/william-macaskill/what-we-owe-the-future/9781541618626/
    image: ea-wwotf-cover-2022
    status: checked
  - id: 2020-the-precipice
    year: 2020
    title: The Precipice
    who: Toby Ord
    relation: milestone
    tagLabel: Milestone · effective altruism
    text: An Oxford philosopher argues that since the first atomic bomb, in 1945, humanity has lived in an age of heightened existential risk. He puts the chance of an existential catastrophe this century at about one in six. The largest single risk, about one in ten, is AI whose goals do not match human flourishing. Reducing such risk, he argues, should be a major global priority.
    source: "Toby Ord, The Precipice: Existential Risk and the Future of Humanity, Bloomsbury, London, and Hachette, New York, 2020; Theron Pummer, review, Notre Dame Philosophical Reviews, 2 August 2020"
    sourceUrl: https://ndpr.nd.edu/reviews/the-precipice-existential-risk-and-the-future-of-humanity/
    themes: [alignment]
    image: ea-trinity-1945
    status: checked
  - id: 2017-longtermism
    year: 2017
    month: 10
    title: “Longtermism”
    who: William MacAskill, with Toby Ord and Hilary Greaves
    relation: coined
    tagLabel: Claimed ancestor · coined the word · effective altruism
    text: Ord's book in progress lent urgency to a search for a name. In October 2017 MacAskill proposed “longtermism”, for the view that our actions matter most through their effects on the very long-run future. With Hilary Greaves he later made the case for strong longtermism, putting the expected number of future beings at a trillion trillion or more. Among the ways to shape that future, they discuss guiding the development of superintelligence.
    source: William MacAskill, “‘Longtermism’”, Effective Altruism Forum, 25 July 2019; Hilary Greaves and William MacAskill, “The Case for Strong Longtermism”, GPI Working Paper, Global Priorities Institute, June 2021
    sourceUrl: https://forum.effectivealtruism.org/posts/qZyshHCNkjs3TvSem/longtermism
    image: ea-longtermism-post-2017
    status: checked
  - id: 2016-open-philanthropy-ai
    year: 2016
    title: Open Philanthropy makes AI risk a priority
    who: Holden Karnofsky, Open Philanthropy
    relation: milestone
    tagLabel: Milestone · effective altruism
    text: GiveWell's offshoot, which advises the foundation of Dustin Moskovitz and Cari Tuna, makes potential risks from advanced AI “a major priority”. Karnofsky gives at least a one-in-ten chance of transformative AI within twenty years, and finds the cause important, neglected and tractable. In March 2017 it granted OpenAI $30 million over three years, and Karnofsky joined OpenAI's board.
    source: "Holden Karnofsky, “Potential Risks from Advanced Artificial Intelligence: The Philanthropic Opportunity”, Open Philanthropy, 6 May 2016; Open Philanthropy, “OpenAI — General Support”, March 2017; GiveWell, “Our story”, givewell.org"
    sourceUrl: https://coefficientgiving.org/blog/potential-risks-advanced-artificial-intelligence-philanthropic-opportunity
    image: ea-open-philanthropy-ai-2016
    status: checked
  - id: 2011-effective-altruism-named
    year: 2011
    title: “Effective altruism”
    who: William MacAskill and the Oxford founders
    relation: coined
    tagLabel: Claimed ancestor · coined the word · effective altruism
    text: Giving What We Can was growing, and 80,000 Hours, a careers project, had soft-launched in February. Planning an umbrella charity, the founders needed a name for people using their lives to do good effectively. MacAskill pushed for “effective altruism”, and on 5 December a shortlist vote chose the Centre for Effective Altruism by a clear margin. Peter Singer's 2013 TED talk later spread the term.
    source: William MacAskill, “The history of the term ‘effective altruism’”, Effective Altruism Forum, 11 March 2014
    sourceUrl: https://forum.effectivealtruism.org/posts/9a7xMXoSiQs3EYPA2/the-history-of-the-term-effective-altruism
    image: ea-cea-website-2011
    status: checked
  - id: 2009-giving-what-we-can
    year: 2009
    title: Giving What We Can
    who: Toby Ord, Bernadette Young and William MacAskill
    relation: institutional-root
    tagLabel: Institutional root · effective altruism
    text: Inspired by ethicists such as Peter Singer, the Oxford philosopher Toby Ord decides to give a large share of his income to effective charities. With his wife, Bernadette Young, and William MacAskill, he launches a society whose members pledge at least 10% of their income. By November 2026 more than 11,000 people had taken its 10% Pledge.
    source: Giving What We Can, “About us” and “Our history”, givingwhatwecan.org, seen 20 November 2026
    sourceUrl: https://www.givingwhatwecan.org/about-us
    image: ea-gwwc-website-2009
    status: checked
  - id: 2007-givewell
    year: 2007
    title: GiveWell
    who: Holden Karnofsky and Elie Hassenfeld
    relation: institutional-root
    tagLabel: Institutional root · effective altruism
    text: Eight friends working in finance try to find out where their donations would do most good, but foundations will not share what they know. Two of them, Holden Karnofsky and Elie Hassenfeld, leave their jobs and launch GiveWell full time. It recommends a few top charities, chosen for strong evidence and high cost-effectiveness, and publishes its research. It also incubated Open Philanthropy, which became separate in 2017.
    source: GiveWell, “Our story”, givewell.org, updated February 2018; GiveWell, “Quick Start Guide”, givewell.org
    sourceUrl: https://www.givewell.org/story
    image: ea-givewell-website-2007
    status: checked
  - id: 2003-astronomical-waste
    year: 2003
    title: “Astronomical Waste”
    who: Nick Bostrom
    relation: claimed
    tagLabel: Claimed ancestor · cited · effective altruism
    text: On a cautious count, Bostrom estimates, each second's delay in settling our local supercluster loses over ten trillion potential human lives. Yet a single percentage point less existential risk would be worth more than ten million years of delay. For utilitarians, he concludes, the rule becomes “Minimize existential risk!” Greaves and MacAskill cite the paper in their case for strong longtermism.
    source: "Nick Bostrom, “Astronomical Waste: The Opportunity Cost of Delayed Technological Development”, Utilitas 15(3), 2003, pp. 308–314; Hilary Greaves and William MacAskill, “The Case for Strong Longtermism”, GPI Working Paper, June 2021"
    sourceUrl: https://nickbostrom.com/astronomical/waste.pdf
    image: ea-virgo-cluster-hubble
    status: checked
  - id: 2002-existential-risks
    year: 2002
    title: “Existential Risks”
    who: Nick Bostrom
    relation: definition
    tagLabel: Modern definition · effective altruism
    text: The philosopher defines an existential risk as one that would “annihilate Earth-originating intelligent life or permanently and drastically curtail its potential”. Among such risks he lists a badly programmed superintelligence, given goals that lead it to destroy humankind. Reducing them, he argues, should be a dominant consideration, at least as a rule of thumb. A 2020 EA Forum guide sets it beside the newer definition in Ord's The Precipice.
    source: "Nick Bostrom, “Existential Risks: Analyzing Human Extinction Scenarios and Related Hazards”, Journal of Evolution and Technology 9(1), 2002; Michael Aird, “Clarifying existential risks and existential catastrophes”, Effective Altruism Forum, 24 April 2020"
    sourceUrl: https://nickbostrom.com/existential/risks
    image: ea-jet-2002
    status: checked
  - id: 1984-reasons-and-persons
    year: 1984
    title: Reasons and Persons
    who: Derek Parfit
    relation: claimed
    tagLabel: Claimed ancestor · cited · effective altruism
    text: "Parfit compares three outcomes: peace, a nuclear war that kills 99% of the world's people, and a war that kills everyone. The gap between the last two is far greater, he argues, because extinction would also end all the generations to come. Destroying mankind, he writes, would be “much worse than most people think”. The passage has led many effective altruists to work on extinction risk."
    source: Derek Parfit, Reasons and Persons, Clarendon Press, Oxford, 1984, pp. 453–454; Effective Altruism Forum, “Derek Parfit” and “Ethics of existential risk”, wiki entries
    sourceUrl: https://forum.effectivealtruism.org/topics/derek-parfit
    image: ea-reasons-and-persons-1984
    status: checked
  - id: 1972-famine-affluence-morality
    year: 1972
    title: “Famine, Affluence, and Morality”
    who: Peter Singer
    relation: claimed
    tagLabel: Claimed ancestor · cited · effective altruism
    text: Writing in November 1971, as people die in East Bengal for lack of food, Singer imagines a child drowning in a shallow pond. He ought to wade in, he says, even at the cost of muddy clothes. If we can prevent something bad without sacrificing “anything of comparable moral importance”, he argues, we ought to, however far away the suffering. Giving What We Can credits the essay with inspiring the modern effective giving movement.
    source: Peter Singer, “Famine, Affluence, and Morality”, Philosophy & Public Affairs 1(3), 1972, pp. 229–243; full text and introduction on the Giving What We Can website
    sourceUrl: https://www.givingwhatwecan.org/get-involved/videos-books-and-essays/famine-affluence-and-morality-peter-singer
    image: ea-ppa-1972
    status: checked
  - id: 1874-methods-of-ethics
    year: 1874
    title: The Methods of Ethics
    who: Henry Sidgwick
    relation: claimed
    tagLabel: Claimed ancestor · cited · effective altruism
    text: A Cambridge lecturer sets out utilitarianism, the theory Jeremy Bentham first stated clearly. The time at which a person lives, he argues, cannot change the value of their happiness. So the interests of posterity “must concern a Utilitarian as much as those of his contemporaries”. Greaves and MacAskill cite him among those who endorse a zero rate of pure time preference.
    source: Henry Sidgwick, The Methods of Ethics, Macmillan, London, 1874, Book IV, ch. 1, § 2, p. 385; Hilary Greaves and William MacAskill, “The Case for Strong Longtermism”, GPI Working Paper 5-2021, June 2021, note 21
    sourceUrl: https://darwin-online.org.uk/converted/pdf/1874_Sidgwick_methods_of_ethics_DlibD_A5921.pdf
    image: ea-sidgwick-1874
    status: checked
