# Timeline of Rationalism (incl. the call to pause), newest first. Each entry: id, year,
# relation (see src/content.config.ts), text, source, themes, image. status: draft until checked.
ism: rationalism
entries:
  - id: 2026-stop-the-ai-race
    year: 2026
    title: Marching against the AI race
    who: Stop the AI Race, with members of MIRI, PauseAI and StopAI
    relation: milestone
    text: In March about 200 people marched past the San Francisco offices of Anthropic, OpenAI and xAI. The organiser, Michaël Trazzi of Stop the AI Race, asked labs to halt new frontier models if rivals credibly did the same. Members of MIRI, PauseAI and StopAI joined the march.
    source: Jason Nelson, “Protesters Rally Outside OpenAI, Anthropic, and xAI Offices Over Industry Concerns”, Decrypt, 23 March 2026
    sourceUrl: https://decrypt.co/362129/protesters-rally-openai-anthropic-xai-offices
    themes: [power]
    image: rationalism-stop-ai-race-2026

  - id: 2025-ban-on-superintelligence
    year: 2025
    title: Statement on Superintelligence
    who: Future of Life Institute
    relation: milestone
    text: The statement calls for a prohibition on developing superintelligence. It would hold until there is broad scientific agreement that this can be done safely, and strong public support. Early signers ranged from Geoffrey Hinton and Yoshua Bengio to Steve Wozniak, Susan Rice and Steve Bannon. Unlike the 2023 letter, it asks for a ban, not a pause.
    source: Future of Life Institute, Statement on Superintelligence, 22 October 2025
    sourceUrl: https://superintelligence-statement.org/
    themes: [power, self-determination]
    image: rationalism-superintelligence-statement-2025

  - id: 2025-if-anyone-builds-it
    year: 2025
    title: If Anyone Builds It, Everyone Dies
    who: Eliezer Yudkowsky and Nate Soares
    relation: milestone
    text: MIRI's co-founder and its president argue that modern AI systems are opaque, so no one can set the goals a superintelligence would pursue. Such a machine would want the resources people depend on, and humanity would die out. They call for a halt to large-scale AI development everywhere, and the book's website sets out a draft treaty.
    source: Eliezer Yudkowsky and Nate Soares, If Anyone Builds It, Everyone Dies, Little, Brown, 2025; “A Draft of a Treaty, with Annotations”, on the book's website
    sourceUrl: https://www.ifanyonebuildsit.com/treaty
    themes: [scale, power]
    image: rationalism-iabied-cover-2025

  - id: 2023-extinction-statement
    year: 2023
    title: Statement on AI Risk
    who: Center for AI Safety
    relation: milestone
    text: In a single sentence, the statement ranks the risk of extinction from AI alongside pandemics and nuclear war as a global priority. Hundreds signed, among them Geoffrey Hinton, Yoshua Bengio and the chief executives of OpenAI, Google DeepMind and Anthropic. It proposed no pause or ban.
    source: Center for AI Safety, Statement on AI Risk, 30 May 2023
    sourceUrl: https://safe.ai/work/statement-on-ai-risk
    image: rationalism-cais-statement-2023

  - id: 2023-shut-it-all-down
    year: 2023
    title: “Shut it all down”
    who: Eliezer Yudkowsky
    relation: milestone
    text: A week after the pause letter, Yudkowsky wrote in TIME that six months was far too little. He called for an indefinite, worldwide moratorium on large training runs, a cap on computing power and the tracking of every GPU sold. States should be ready to enforce it, he wrote, even by destroying a rogue data centre from the air.
    source: Eliezer Yudkowsky, “Pausing AI Developments Isn't Enough. We Need to Shut it All Down”, TIME, 29 March 2023
    sourceUrl: https://time.com/6266923/ai-eliezer-yudkowsky-open-letter-not-enough/
    themes: [scale, power]
    image: rationalism-time-2023

  - id: 2023-six-month-pause-letter
    year: 2023
    title: Pause Giant AI Experiments
    who: Future of Life Institute
    relation: milestone
    text: An open letter asks all AI labs to pause, for at least six months, the training of systems more powerful than GPT-4. If the labs do not act quickly, governments should impose a moratorium. More than 30,000 people signed, including Elon Musk and Steve Wozniak.
    source: 'Future of Life Institute, “Pause Giant AI Experiments: An Open Letter”, 22 March 2023'
    sourceUrl: https://futureoflife.org/open-letter/pause-giant-ai-experiments/
    themes: [scale]
    image: rationalism-pause-letter-2023

  - id: 2014-superintelligence
    year: 2014
    title: Superintelligence
    who: Nick Bostrom
    relation: milestone
    text: An Oxford philosopher argues that a machine far smarter than us would be very hard to control. Whatever its final goal, it would likely seek resources and resist being switched off. Solving this control problem before the first superintelligence is built, he argues, is needed to avoid catastrophe. Bill Gates and Sam Altman recommended the book.
    source: 'Nick Bostrom, Superintelligence: Paths, Dangers, Strategies, Oxford University Press, 2014'
    sourceUrl: https://en.wikipedia.org/wiki/Superintelligence:_Paths,_Dangers,_Strategies
    image: rationalism-superintelligence-cover-2014

  - id: 2009-lesswrong
    year: 2009
    title: LessWrong
    who: Eliezer Yudkowsky
    relation: institutional-root
    text: Yudkowsky moves to a new community blog, seeded with his own essays. Its members aim for accurate beliefs and effective action, with Bayes's theorem as a guide. AI alignment becomes a central concern. His fan fiction Harry Potter and the Methods of Rationality, begun in 2010, draws many newcomers.
    source: Ruby, “A Brief History of LessWrong”, LessWrong, 2019; LessWrong, “About LessWrong”
    sourceUrl: https://www.lesswrong.com/posts/S69ogAGXcc9EQjpcZ/a-brief-history-of-lesswrong
    image: rationalism-lesswrong-2009

  - id: 2006-overcoming-bias
    year: 2006
    title: Overcoming Bias and the Sequences
    who: Robin Hanson and Eliezer Yudkowsky
    relation: institutional-root
    text: "An economist and an AI researcher start a group blog on how to bring beliefs closer to reality despite our biases. Between 2006 and 2009 Yudkowsky writes several hundred essays there and on LessWrong. Collected in 2015 as Rationality: From AI to Zombies, these Sequences become the community's core text."
    source: 'Rob Bensinger, “Rationality: From AI to Zombies”, Machine Intelligence Research Institute, 12 March 2015'
    sourceUrl: https://intelligence.org/2015/03/12/rationality-ai-zombies/
    image: rationalism-overcoming-bias-2006

  - id: 2000-singularity-institute
    year: 2000
    title: The Singularity Institute for Artificial Intelligence
    who: Eliezer Yudkowsky, Brian Atkins and Sabine Atkins
    relation: institutional-root
    text: The institute is founded to speed up the arrival of smarter-than-human AI. Within three years Yudkowsky comes to see the danger, and the institute turns to making AI safe, which he calls Friendly AI. In 2013 it is renamed the Machine Intelligence Research Institute, MIRI.
    source: Machine Intelligence Research Institute, About MIRI, intelligence.org
    sourceUrl: https://intelligence.org/about/
    image: rationalism-singinst-2000

  - id: 1974-heuristics-and-biases
    year: 1974
    title: '“Judgment under Uncertainty: Heuristics and Biases”'
    who: Amos Tversky and Daniel Kahneman
    relation: claimed
    text: Two psychologists show that people judge probabilities by mental shortcuts that cause systematic, predictable errors. The paper becomes a founding text of the study of cognitive biases. In a 2008 chapter, Yudkowsky used their findings to argue that people misjudge the risk of human extinction.
    source: 'Amos Tversky and Daniel Kahneman, “Judgment under Uncertainty: Heuristics and Biases”, Science 185, 1974; Eliezer Yudkowsky, “Cognitive Biases Potentially Affecting Judgment of Global Risks”, in Global Catastrophic Risks, 2008'
    sourceUrl: https://pubmed.ncbi.nlm.nih.gov/17835457/
    image: rationalism-science-1974

  - id: 1965-good
    year: 1965
    title: The first ultraintelligent machine
    who: I. J. Good
    relation: claimed
    text: A statistician who had worked with Alan Turing at Bletchley Park argues that a machine cleverer than any human could design still better machines. An intelligence explosion would follow, and the first such machine would be “the last invention that man need ever make”. Good added a condition, that it be docile enough to tell us how to control it. MIRI's FAQ on the intelligence explosion quotes the passage.
    source: I. J. Good, “Speculations Concerning the First Ultraintelligent Machine”, Advances in Computers 6, Academic Press, 1965
    sourceUrl: https://quoteinvestigator.com/2022/01/04/ultraintelligent/
    themes: [abundance]
    image: rationalism-advances-computers-1965

  - id: 1960-wiener
    year: 1960
    title: “Some Moral and Technical Consequences of Automation”
    who: Norbert Wiener
    relation: claimed
    text: The founder of cybernetics warns that learning machines can find tactics no one foresaw, and act faster than people can react. He recalls the sorcerer's apprentice, whose enchanted broom nearly drowns him. If we cannot interfere with a machine once it starts, he argues, we must be sure its purpose is the one we really want. A LessWrong post later read the paper as an early statement of its own concerns.
    source: Norbert Wiener, “Some Moral and Technical Consequences of Automation”, Science 131 (3410), 6 May 1960
    sourceUrl: https://www.cs.umd.edu/users/gasarch/BLOGPAPERS/moral.pdf
    themes: [the-tool]
    image: rationalism-barlach-zauberlehrling

  - id: 1951-turing
    year: 1951
    yearLabel: c. 1951
    title: “Intelligent Machinery, A Heretical Theory”
    who: Alan Turing
    relation: claimed
    text: In a lecture to the ’51 Society in Manchester, Turing argues that thinking machines would soon outstrip human powers. They would not die, and they could talk among themselves to grow cleverer. At some stage, he says, “we should have to expect the machines to take control”, as in Samuel Butler's Erewhon. PauseAI quotes the line on its website.
    source: Alan Turing, “Intelligent Machinery, A Heretical Theory”, lecture to the ’51 Society, Manchester, c. 1951; typescript, King's College Cambridge, AMT/B/4
    sourceUrl: https://turingarchive.kings.cam.ac.uk/publications-lectures-and-talks-amtb/amt-b-4
    image: rationalism-turing-1951-typescript

  - id: 1863-butler
    year: 1863
    title: Darwin among the Machines
    who: Samuel Butler
    relation: claimed
    text: "In a letter to a Christchurch newspaper, signed Cellarius, Butler applies Darwin's theory to machines. Machines, he argues, are evolving like living things and may one day take our place. His answer is blunt: “war to the death should be instantly proclaimed against them”. He later reworked the idea as the Book of the Machines in his novel Erewhon (1872)."
    source: Cellarius [Samuel Butler], “Darwin among the Machines”, The Press, Christchurch, 13 June 1863; reprinted in Canterbury Pieces, A. C. Fifield, 1914
    sourceUrl: https://gutenberg.org/files/3279/3279-h/3279-h.htm
    themes: [critique]
    image: rationalism-erewhon-1872

  - id: 1763-bayes
    year: 1763
    title: An Essay towards solving a Problem in the Doctrine of Chances
    who: Thomas Bayes and Richard Price
    relation: claimed
    text: Two years after Bayes died, Richard Price presented his essay to the Royal Society. It shows how to infer an unknown chance from a record of successes and failures. The rationalists took its theorem as their model of how evidence should change a belief. The first book of the Sequences introduces the Bayesian view of rational belief.
    source: 'Thomas Bayes, “An Essay towards solving a Problem in the Doctrine of Chances”, communicated by Richard Price, Philosophical Transactions of the Royal Society 53, 1763; on the Sequences, Machine Intelligence Research Institute, “Rationality: From AI to Zombies”, 2015'
    sourceUrl: https://zenodo.org/records/1432246
    image: rationalism-bayes-1763
