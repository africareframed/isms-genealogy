# Timeline of Techno-optimism (including augmentation), newest first. Each entry: id, year,
# relation (see src/content.config.ts), text, source, themes, image. status: draft until checked.
# Augmentation entries carry the theme augmentation and a tagLabel ending in "· augmentation".
# The e/acc strand's entries (moved from Effective accelerationism, 25 Nov 2026) carry a tagLabel ending in "· e/acc".
ism: techno-optimism
entries:
  - id: 2025-nadella-bicycles
    year: 2025
    month: 12
    title: “Bicycles for the mind”, again
    who: Satya Nadella
    relation: milestone
    tagLabel: Milestone · augmentation
    text: Microsoft's chief executive starts a personal blog with a post on the year ahead. He calls for a new concept that evolves Steve Jobs's bicycles for the mind. People will be equipped with “cognitive amplifier” tools, he writes, and AI should support human potential, not substitute for it. The Register noted that getting customers to pay for Copilot and Microsoft's other AI services remained “a work in progress”.
    source: Satya Nadella, “Looking Ahead to 2026”, sn scratchpad, 29 December 2025; quoted by Julie Bort, TechCrunch, 5 January 2026, and dated by Luis Rijo, PPC Land, 2 January 2026; Thomas Claburn, The Register, 2 January 2026
    sourceUrl: https://techcrunch.com/2026/01/05/microsofts-nadella-wants-us-to-stop-thinking-of-ai-as-slop
    themes: [augmentation]
    image: techopt-nadella-post-2025
    status: checked
  - id: 2025-superagency
    year: 2025
    month: 1
    title: Superagency
    who: Reid Hoffman and Greg Beato
    relation: milestone
    tagLabel: Milestone · augmentation
    text: The co-founder of LinkedIn argues, with Greg Beato, that AI will give people new superpowers. When many people gain them at once, everyone benefits, a state the book calls superagency. Hoffman sorts views of AI into doomers, gloomers, zoomers and bloomers. Bloomers, like him, are cautious optimists who want AI in many hands and shaped by its users' feedback.
    source: "Reid Hoffman and Greg Beato, Superagency: What Could Possibly Go Right with Our AI Future, Authors Equity, 28 January 2025; Angie Basiouny, “Embracing AI: Are You a Doomer, Gloomer, Zoomer or Bloomer?”, Knowledge at Wharton, 4 February 2025; Anthony Ha, TechCrunch, 26 January 2025"
    sourceUrl: https://knowledge.wharton.upenn.edu/article/embracing-ai-are-you-a-doomer-gloomer-zoomer-or-bloomer/
    themes: [augmentation]
    image: techopt-superagency-cover-2025
    status: checked
  - id: 2023-techno-optimist-manifesto
    year: 2023
    month: 10
    title: “The Techno-Optimist Manifesto”
    who: Marc Andreessen
    relation: definition
    text: In fifteen sections, mostly statements of belief, the co-founder of Andreessen Horowitz argues that progress comes from technology combined with free markets. Together they form what Nick Land called the techno-capital machine. On AI, it states that “any deceleration of AI will cost lives”. Its enemies include stagnation, central planning and the precautionary principle, and it counts tech ethics among the names of a demoralisation campaign.
    source: Marc Andreessen, “The Techno-Optimist Manifesto”, Andreessen Horowitz (a16z.com), 16 October 2023
    sourceUrl: https://a16z.com/the-techno-optimist-manifesto/
    themes: [abundance, luddite]
    image: techopt-manifesto-2023
    status: checked
  - id: 2023-why-ai-will-save-the-world
    year: 2023
    month: 6
    title: “Why AI Will Save the World”
    who: Marc Andreessen
    relation: milestone
    text: Andreessen argues that AI will not destroy the world and may save it, by augmenting human intelligence. “Every child will have an AI tutor that is infinitely patient,” he writes. AI has no goals of its own, he says, and he calls the fear that it will kill us a cult. The greatest risk, he argues, is that China wins, so the West should build fast and keep open source free.
    source: Marc Andreessen, “Why AI Will Save the World”, Andreessen Horowitz (a16z.com), 6 June 2023
    sourceUrl: https://a16z.com/ai-will-save-the-world/
    themes: [augmentation, alignment]
    image: techopt-save-the-world-2023
    status: checked
  - id: 2023-microsoft-365-copilot
    year: 2023
    month: 3
    title: “Your copilot for work”
    who: Microsoft
    relation: milestone
    tagLabel: Milestone · augmentation
    text: Microsoft builds an AI assistant called Copilot into Word, Excel, PowerPoint, Outlook and Teams. It is meant to work alongside people, who decide what to keep. “With Copilot, you're always in control,” the launch post promises. GitHub had previewed its Copilot in 2021, an AI “pair programmer” built on OpenAI's Codex.
    source: "Jared Spataro, “Introducing Microsoft 365 Copilot – your copilot for work”, Official Microsoft Blog, 16 March 2023; Nat Friedman, “Introducing GitHub Copilot: your AI pair programmer”, GitHub Blog, 29 June 2021"
    sourceUrl: https://blogs.microsoft.com/blog/2023/03/16/introducing-microsoft-365-copilot-your-copilot-for-work/
    themes: [augmentation]
    image: techopt-copilot-2023
    status: checked
  - id: 2020-its-time-to-build
    year: 2020
    title: “It's Time to Build”
    who: Marc Andreessen
    relation: milestone
    text: Early in the coronavirus pandemic, Andreessen blames the West's lack of tests, ventilators and masks on “our widespread inability to build”. He calls for housing, highly automated factories, nuclear reactors and high-speed trains, and for new ways to deliver education and health care. The problem, he argues, is a lack of desire and will, along with inertia and regulatory capture.
    source: Marc Andreessen, “It's Time to Build”, Andreessen Horowitz (a16z.com), 18 April 2020
    sourceUrl: https://a16z.com/its-time-to-build/
    image: techopt-time-to-build-2020
    status: checked
  - id: 2019-progress-studies
    year: 2019
    title: A new science of progress
    who: Patrick Collison and Tyler Cowen
    relation: milestone
    text: An entrepreneur and an economist call for a field that studies how progress happens and how to speed it up. By progress they mean economic, technological, scientific, cultural and organisational advance. Such advances, they note, arose in tiny pockets, from Renaissance Florence to Silicon Valley. “We suggest inaugurating the discipline of ‘Progress Studies’,” they write.
    source: Patrick Collison and Tyler Cowen, “We Need a New Science of Progress”, The Atlantic, 30 July 2019; excerpted by Tyler Cowen on Marginal Revolution, 31 July 2019
    sourceUrl: https://marginalrevolution.com/marginalrevolution/2019/07/we-need-a-new-science-of-progress.html
    image: techopt-progress-studies-2019
    status: checked
  - id: 2012-abundance
    year: 2012
    title: Abundance
    who: Peter Diamandis and Steven Kotler
    relation: milestone
    text: A co-founder of Singularity University and his co-author argue that exponential technologies will soon end scarcity. AI, robotics, digital manufacturing and synthetic biology will let humanity “meet and exceed the basic needs of every person on the planet”. The book takes water, food, energy, health care, education and freedom in turn.
    source: "Peter H. Diamandis and Steven Kotler, Abundance: The Future Is Better Than You Think, Free Press, 21 February 2012; publisher's description, Simon & Schuster"
    sourceUrl: https://www.simonandschuster.co.uk/books/Abundance/Peter-H-Diamandis/Exponential-Technology-Series/9781451616842
    themes: [abundance]
    image: techopt-abundance-cover-2012
    status: checked
  - id: 2010-what-technology-wants
    year: 2010
    title: What Technology Wants
    who: Kevin Kelly
    relation: claimed
    text: The founding executive editor of Wired calls the whole system of human technology the technium. It grows almost like a living thing, he argues, with tendencies of its own. Each invention adds options and choices, and that growth of possibility is his definition of progress. Andreessen names Kelly among the patron saints of techno-optimism.
    source: Kevin Kelly, What Technology Wants, Viking, 18 October 2010; Kevin Kelly, “The Positive Balance of Technology”, The Technium, 1 March 2011; Kirkus Reviews, 2010; Marc Andreessen, “The Techno-Optimist Manifesto”, 2023 (patron saints)
    sourceUrl: https://kk.org/thetechnium/?p=5138
    image: techopt-what-technology-wants-cover-2010
    status: checked
  - id: 1980-bicycle-for-the-mind
    year: 1980
    yearLabel: c. 1980
    title: A bicycle for the mind
    who: Steve Jobs
    relation: claimed
    tagLabel: Claimed ancestor · augmentation
    text: "In a presentation filmed around 1980, Apple's co-founder compares the personal computer to a bicycle. In a study of how efficiently species move, he recalls, the condor beat humans, but a human on a bicycle beat the condor. A computer, he says in a 1990 film, is “the equivalent of a bicycle for our minds”. Microsoft's Satya Nadella took up the image for AI in 2023 and again in 2025."
    source: "Philip Elmer-DeWitt, “Video: Steve Jobs in 1980 on PCs as bicycles for the mind”, Fortune, 14 December 2011; Steve Jobs in Memory & Imagination: New Pathways to the Library of Congress, 1990, excerpted by Maria Popova, The Marginalian, 21 December 2011; Satya Nadella, Build keynote, May 2023, reported by Ben Thompson, Stratechery, 24 May 2023; Satya Nadella, “Looking Ahead to 2026”, 2025"
    sourceUrl: https://www.themarginalian.org/2011/12/21/steve-jobs-bicycle-for-the-mind-1990/
    themes: [augmentation]
    image: techopt-apple-ii
    status: checked
  - id: 1962-augmenting-human-intellect
    year: 1962
    title: “Augmenting Human Intellect”
    who: Douglas Engelbart
    relation: claimed
    tagLabel: Claimed ancestor · augmentation
    text: In a report for the US Air Force Office of Scientific Research, Engelbart of the Stanford Research Institute sets out a programme. To augment human intellect is “increasing the capability of a man to approach a complex problem situation”. He builds on Vannevar Bush's memex and J. C. R. Licklider's man-computer symbiosis. His lab presented the mouse in 1968, and Andreessen names him a patron saint.
    source: "Douglas C. Engelbart, Augmenting Human Intellect: A Conceptual Framework, SRI Summary Report AFOSR-3223, Stanford Research Institute, October 1962 (text at the Doug Engelbart Institute; copy in the Computer History Museum, 102776493); Smithsonian National Museum of American History, replica of Engelbart's first mouse prototype; Marc Andreessen, “The Techno-Optimist Manifesto”, 2023 (patron saints)"
    sourceUrl: https://dougengelbart.org/content/view/138
    themes: [augmentation]
    image: techopt-augmenting-1962
    status: checked
  - id: 1960-man-computer-symbiosis
    year: 1960
    title: “Man-Computer Symbiosis”
    who: J. C. R. Licklider
    relation: attributed
    tagLabel: Attributed by historians · augmentation
    text: A psychologist then at Bolt Beranek and Newman hopes that human brains and computers will soon be “coupled together very tightly”. People would set the goals and judge the results, and machines would do the routine work. He grants that machines alone may one day do the thinking, but only after a long interim. Engelbart cites the paper in 1962.
    source: "J. C. R. Licklider, “Man-Computer Symbiosis”, IRE Transactions on Human Factors in Electronics HFE-1, March 1960, pp. 4–11; IEEE Computer Society, “Joseph C. R. Licklider”, Computer Pioneers; Douglas C. Engelbart, Augmenting Human Intellect, 1962, section III.A.5; Howard Rheingold, Tools for Thought, Simon & Schuster, 1985, chapter 9"
    sourceUrl: https://groups.csail.mit.edu/medg/people/psz/Licklider.html
    themes: [augmentation]
    image: techopt-symbiosis-1960
    status: checked
  - id: 1945-hayek-knowledge
    year: 1945
    month: 9
    title: “The Use of Knowledge in Society”
    who: Friedrich Hayek
    relation: claimed
    text: The Austrian-born economist argues that no central planner can gather the knowledge an economy needs. It exists only as “dispersed bits of incomplete and frequently contradictory knowledge” held by many people. Prices pass it on, like a system of telecommunications. The Techno-Optimist Manifesto invokes Hayek's knowledge problem against any centralised economy.
    source: F. A. Hayek, “The Use of Knowledge in Society”, American Economic Review 35(4), September 1945, pp. 519–530; Marc Andreessen, “The Techno-Optimist Manifesto”, 2023 (Hayek's Knowledge Problem; patron saints)
    sourceUrl: https://www.econlib.org/library/Essays/hykKnw.html
    image: techopt-hayek-1945
    status: checked
  - id: 1945-as-we-may-think
    year: 1945
    month: 7
    title: “As We May Think”
    who: Vannevar Bush
    relation: attributed
    tagLabel: Attributed by historians · augmentation
    text: The magazine introduces Bush as coordinator of some six thousand leading American scientists in the war. He asks what scientists should do next, and answers that the growing store of knowledge must be easier to reach. He imagines the memex, a desk holding a person's books and records, “an enlarged intimate supplement to his memory”. Engelbart's 1962 report devotes a section to the idea.
    source: Vannevar Bush, “As We May Think”, The Atlantic Monthly, July 1945; Douglas C. Engelbart, Augmenting Human Intellect, 1962, sections III.A.1–2; Howard Rheingold, Tools for Thought, Simon & Schuster, 1985, chapter 9
    sourceUrl: https://www.w3.org/History/1945/vbush/vbush.txt
    themes: [augmentation]
    image: techopt-as-we-may-think-1945
    status: checked
  - id: 1909-futurist-manifesto
    year: 1909
    title: The Manifesto of Futurism
    who: Filippo Tommaso Marinetti
    relation: claimed
    text: On the front page of Le Figaro, an Italian poet glorifies speed, struggle and war, “the world's only hygiene”. A racing car, he declares, is more beautiful than the Victory of Samothrace. The 2023 Techno-Optimist Manifesto names him a patron saint and adapts his seventh point, putting technology where he wrote poetry. Marinetti went on to co-write the Fascist Manifesto of 1919.
    source: "F. T. Marinetti, “The Founding and Manifesto of Futurism”, Le Figaro, 20 February 1909, trans. R. W. Flint, in Marinetti: Selected Writings, 1971 (Encyclopaedia Britannica primary source); Marc Andreessen, “The Techno-Optimist Manifesto”, 2023; Janus Rose, Vice, 17 October 2023"
    sourceUrl: https://cdn.britannica.com/primary_source/eb/435828.html
    image: techopt-figaro-1909
    status: checked
  - id: 1620-novum-organum
    year: 1620
    title: Novum Organum
    who: Francis Bacon
    relation: claimed
    text: England's Lord Chancellor proposes a new method for the sciences, to give people power over nature. “Human knowledge and human power meet in one,” runs his third aphorism, and nature must be obeyed to be commanded. The title page shows a ship sailing past the Pillars of Hercules, the old limit of the known world. Jason Crawford of the progress movement cites him in 2024.
    source: Francis Bacon, Novum Organum, in Instauratio Magna, London, John Bill, 1620, Book I, aphorism III (Internet Modern History Sourcebook, Fordham University); Thomas Fisher Rare Book Library, University of Toronto, on the title page; Jason Crawford, “Why harmony with nature is a myth”, The Techno-Humanist Manifesto, Big Think, 7 August 2024
    sourceUrl: https://sourcebooks.web.fordham.edu/mod/bacon-aphor.asp
    image: techopt-instauratio-1620
    status: checked
  - id: 2026-network-school-kazakhstan
    year: 2026
    month: 7
    title: The Network School moves to Kazakhstan
    who: Balaji Srinivasan
    relation: milestone
    tagLabel: Milestone · the network state
    text: Srinivasan opened the Network School in 2024 at Forest City in Johor, Malaysia, across the strait from Singapore. It is a co-living community for founders and creators, part of his effort to build a network state. In July 2026 the local council revoked its business licence, citing breaches of licensing and premises rules. The next day Srinivasan signed a five-year memorandum with Kazakhstan's Ministry of Artificial Intelligence and Digital Development, and announced a new campus there.
    source: "Angelica Ang, “Booted from Malaysia, tech guru Balaji Srinivasan finds a new patron for his ‘nomad’ commune: Kazakhstan”, Fortune, 26 July 2026; Nan Hidayat Nan Azmie, “Network School heading to Kazakhstan after Johor operations halted”, The Star, 22 July 2026"
    sourceUrl: https://www.fortune.com/2026/07/26/network-school-balaji-srinivasan-malaysia-johor-israel-kazakhstan/
    image: eacc-network-school-2026
    status: checked
  - id: 2025-extropic-chips
    year: 2025
    title: Thermodynamic chips
    who: Extropic, led by Guillaume Verdon
    relation: milestone
    tagLabel: Milestone · e/acc
    text: Verdon's start-up, founded in 2022 with Trevor McCourt, unveils its first chips and a development platform already tested by early partners. The chips are built from probabilistic bits, circuits whose output wanders at random between 1 and 0 with programmable odds. In simulations on small benchmarks, Extropic claims, its approach could be up to 10,000 times more energy-efficient than GPUs. Once it succeeds, it says, “energy constraints will no longer limit AI scaling”.
    source: Extropic, “Thermodynamic computing from zero to one” and “Inside X0 and XTR-0”, extropic.ai, 2025; Extropic, “Thermodynamic Hardware”, extropic.ai; Maximilian Schreiner, “Startup Extropic plans to revolutionize AI hardware by embracing the power of randomness”, The Decoder, 2 April 2024
    sourceUrl: https://extropic.ai/writing/thermodynamic-computing-from-zero-to-one
    themes: [compute]
    image: eacc-extropic-x0-2025
    status: checked
  - id: 2023-beff-jezos-named
    year: 2023
    month: 12
    title: Beff Jezos is named
    who: Guillaume Verdon
    relation: milestone
    tagLabel: Milestone · e/acc
    text: Forbes reports that the account @BasedBeffJezos is run by Guillaume Verdon, a physicist who had worked on quantum computing at Google. He had founded Extropic, a start-up building hardware for AI. Verdon then spoke under his own name, including on Lex Fridman's podcast. Marc Andreessen and Garry Tan had already put e/acc on their X profiles, and Andreessen's manifesto named @BasedBeffJezos a patron saint.
    source: "Emily Baker-White, “Who Is @BasedBeffJezos, The Leader Of The Tech Elite's ‘E/Acc’ Movement?”, Forbes, 1 December 2023, as reported in Josh Scott, BetaKit, 8 December 2023, and Kevin Roose, “This A.I. Subculture's Motto: Go, Go, Go”, The New York Times, 10 December 2023; Steve Mollman, “Jeff Bezos and Elon Musk are shaping our future in outer space. ‘Beff Jezos’ says the billionaires have earned the right”, Fortune, 30 December 2023; Marc Andreessen, “The Techno-Optimist Manifesto”, a16z, 16 October 2023"
    sourceUrl: https://fortune.com/2023/12/30/jeff-bezos-elon-musk-outer-space-future-beff-jezos-billionaires-have-earned-right/
    image: eacc-forbes-2023
    status: checked
  - id: 2022-eacc-tenets
    year: 2022
    month: 7
    title: “Notes on e/acc principles and tenets”
    who: Beff Jezos and Bayeslord
    relation: definition
    tagLabel: Modern definition · e/acc
    text: In point-form notes on Substack, the two set out the thinking behind e/acc. Life arose through dissipative adaptation, they argue, and intelligence is a faster form of the same process, capitalism a form of intelligence. Against top-down control they favour competition, and welcome Balaji Srinivasan's network states as tests of how to govern. Some in e/acc, Beff among them, call themselves post-humanists, and their summary says to stop fighting “the thermodynamic will of the universe”.
    source: Beff Jezos and Bayeslord, “Notes on e/acc principles and tenets”, Beff's Newsletter, Substack, 10 July 2022
    sourceUrl: https://beff.substack.com/p/notes-on-eacc-principles-and-tenets
    image: eacc-tenets-2022
    status: checked

  # Same month as the tenets (10 July) but earlier (4 July): listed after them so it sorts below.
  - id: 2022-network-state
    year: 2022
    month: 7
    title: The Network State
    who: Balaji Srinivasan
    relation: milestone
    tagLabel: Milestone · the network state
    text: The former chief technology officer of Coinbase publishes his book on 4 July, also free to read online. A network state, he writes, is “a highly aligned online community with a capacity for collective action”. It crowdfunds territory around the world and in time wins diplomatic recognition from existing states. Six days later, e/acc's tenets said the idea particularly excited them.
    source: Balaji Srinivasan, The Network State, 2022, thenetworkstate.com; Balaji Srinivasan, “The Network State Book”, balajis.com, 19 March 2022, updated 4 July 2022; Beff Jezos and Bayeslord, “Notes on e/acc principles and tenets”, 10 July 2022
    sourceUrl: https://thenetworkstate.com/the-network-state-in-one-sentence
    image: eacc-network-state-2022
    status: checked
  - id: 2022-eacc-named
    year: 2022
    month: 5
    title: Effective accelerationism is named
    who: “swarthy” (@zestular), with @BasedBeffJezos, @bayeslord and @creatine_cycle
    relation: coined
    tagLabel: Coined the word
    text: At the end of May, a handful of pseudonymous Twitter users announce a new philosophy, its name a play on effective altruism. A newsletter post by swarthy defines it and sets it apart from EA, which it finds unfocused and too averse to risk. Its first line repeats a sentence from Nick Land's 2017 introduction to accelerationism. Humanity's overarching goal, it says, is “to preserve the light of consciousness”.
    source: swarthy, newsletter post on Substack (swarthy.substack.com), 31 May 2022, reposted verbatim as “Effective Accelerationism — e/acc”, e/acc newsletter, 31 October 2022; “e/acc (Effective Accelerationism)”, Know Your Meme; Hasan Chowdhury, “Get the lowdown on ‘e/acc’ …”, Business Insider, 28 July 2023; Nick Land, “A Quick-and-Dirty Introduction to Accelerationism”, Jacobite, 25 May 2017
    sourceUrl: https://effectiveaccelerationism.substack.com/p/repost-effective-accelerationism
    image: eacc-swarthy-2022
    status: checked
  - id: 2013-ultimate-exit
    year: 2013
    month: 10
    title: “Silicon Valley's Ultimate Exit”
    who: Balaji Srinivasan
    relation: milestone
    tagLabel: Milestone · the network state
    text: At Y Combinator's Startup School, a founder of the genetic-testing company Counsyl contrasts two responses to a declining system. Voice means changing it from within, and exit means leaving to build something new. “Exit amplifies voice,” he argues, and technology should help people opt out peacefully. Reason noted that he was echoing Albert O. Hirschman's 1970 book Exit, Voice, and Loyalty.
    source: Balaji Srinivasan, “Silicon Valley's Ultimate Exit”, Startup School, Y Combinator, October 2013; J. D. Tuccille, “Tech Should Make It Easier To Escape Government Control, Says Startup Veteran Balaji Srinivasan”, Reason, 30 October 2013; Y Combinator, “Videos from Startup School 2013 are now online”, 27 October 2013
    sourceUrl: https://reason.com/2013/10/30/tech-should-make-it-easier-to-escape-the/printer/
    image: eacc-startup-school-2013
    status: checked
  - id: 2013-england-dissipation
    year: 2013
    month: 9
    title: Dissipation-driven adaptation
    who: Jeremy England
    relation: claimed
    tagLabel: Claimed ancestor · cited · e/acc
    text: An MIT physicist derives the least heat that any self-replicating system must give off. He goes further, arguing that matter driven by an outside energy source will often reorganise itself to dissipate more energy. Harvard's Eugene Shakhnovich found it interesting but “extremely speculative” as an account of life. e/acc's 2022 tenets cite England for their claim that life emerged through dissipative adaptation.
    source: Jeremy L. England, “Statistical Physics of Self-Replication”, The Journal of Chemical Physics 139 (12), 121923, 2013; Natalie Wolchover, “A New Physics Theory of Life”, Quanta Magazine, 22 January 2014; Beff Jezos and Bayeslord, “Notes on e/acc principles and tenets”, 2022
    sourceUrl: https://www.quantamagazine.org/a-new-thermodynamics-theory-of-the-origin-of-life-20140122
    image: eacc-england-2013
    status: checked
  - id: 2012-dark-enlightenment
    year: 2012
    title: The Dark Enlightenment
    who: Nick Land
    relation: milestone
    tagLabel: Milestone · neoreaction
    text: In a long essay posted online in parts, Land surveys the blogger Mencius Moldbug and his readers, whom he calls neo-reactionaries. Its first part is headed “Neo-reactionaries head for the exit”. Against democratic voice it sets exit, the freedom to leave, and it adopts Moldbug's name for the ruling order, the Cathedral. It also quotes Peter Thiel's doubt that freedom and democracy are compatible.
    source: Nick Land, “The Dark Enlightenment”, thedarkenlightenment.com, 2012, archived copy
    sourceUrl: https://www.gwern.net/docs/www/www.thedarkenlightenment.com/8fb594d142764625b62157ff0c8f51bae346da3b.html
    image: eacc-dark-enlightenment-2012
    status: checked
  - id: 2009-thiel-libertarian
    year: 2009
    title: “The Education of a Libertarian”
    who: Peter Thiel
    relation: claimed
    tagLabel: Claimed ancestor · neoreaction
    text: In an essay for Cato Unbound, the PayPal co-founder writes, “I no longer believe that freedom and democracy are compatible.” The great task for libertarians, he argues, is to find a way out of politics altogether. He looks to cyberspace, outer space and the sea, and backs Patri Friedman's seasteading experiment. Nick Land quotes the line in The Dark Enlightenment and calls the exchange a milestone.
    source: Peter Thiel, “The Education of a Libertarian”, Cato Unbound, 13 April 2009; quoted in Nick Land, “The Dark Enlightenment”, 2012
    sourceUrl: https://www.cato-unbound.org/2009/04/13/peter-thiel/education-libertarian
    image: eacc-cato-unbound-2009
    status: checked
  - id: 2007-unqualified-reservations
    year: 2007
    title: Unqualified Reservations
    who: Curtis Yarvin, as Mencius Moldbug
    relation: milestone
    tagLabel: Milestone · neoreaction
    text: A software developer opens a blog under a pen name with “A Formalist Manifesto”. Over the next years he argues that democracy should give way to rule by a monarch, perhaps modelled on a corporate chief executive. He calls the universities and press that, he says, really hold power “the Cathedral”. In 2013 Peter Thiel invests in his software company, Tlon.
    source: Mencius Moldbug [Curtis Yarvin], “A Formalist Manifesto”, Unqualified Reservations, 2007; George Michael, “An antidemocratic philosophy called ‘neoreaction’ is creeping into GOP politics”, The Conversation, July 2022; Harrison Smith and Roger Burrows, “Software, Sovereignty and the Post-Neoliberal Politics of Exit”, Theory, Culture & Society 38 (6), 2021
    sourceUrl: https://www.theconversation.com/an-antidemocratic-philosophy-called-neoreaction-is-creeping-into-gop-politics-182581
    image: eacc-unqualified-reservations-2007
    status: checked
  - id: 1997-sovereign-individual
    year: 1997
    title: The Sovereign Individual
    who: James Dale Davidson and William Rees-Mogg
    relation: attributed
    tagLabel: Attributed by historians · exit
    text: Its authors predict that the internet and digital money will let the richest and most able slip free of the nation state. Citizenship will become obsolete, they argue, and the welfare state will collapse. Peter Thiel wrote the preface to a 2020 edition. The scholars Harrison Smith and Roger Burrows argue that it prefigured neoreaction's politics of exit.
    source: James Dale Davidson and William Rees-Mogg, The Sovereign Individual, Simon & Schuster, 1997; review, Publishers Weekly, February 1997; Quinn Slobodian, “The sovereign individual in Downing Street”, New Statesman, 2 November 2022; Harrison Smith and Roger Burrows, “Software, Sovereignty and the Post-Neoliberal Politics of Exit”, Theory, Culture & Society 38 (6), 2021
    sourceUrl: https://www.newstatesman.com/ideas/2023/06/rishi-sunak-silicon-valley-sovereign-individual
    image: eacc-sovereign-individual-1997
    status: checked
  - id: 1994-meltdown
    year: 1994
    title: “Meltdown”
    who: Nick Land
    relation: claimed
    tagLabel: Claimed ancestor · cited · e/acc
    text: In spring 1994 a philosophy lecturer at Warwick gives a talk called “Meltdown” at a Virtual Futures conference. It begins with a story, in which “Earth is captured by a technocapital singularity”. The text draws on Deleuze and Guattari's Anti-Oedipus, which it cites. e/acc's 2022 tenets link to it when they note that Land saw capitalism as a form of intelligence.
    source: Nick Land, “Meltdown”, Virtual Futures conference, University of Warwick, 1994, text on the CCRU website; James Duesterberg, “Silicon Valley's Favorite Doomsaying Philosopher”, The New Yorker, 19 February 2026; Beff Jezos and Bayeslord, “Notes on e/acc principles and tenets”, 2022
    sourceUrl: https://dataswamp.org/~john/sites/ccru/swarm1/1_melt.htm
