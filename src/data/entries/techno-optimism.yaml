  - id: 1972-anti-oedipus
    year: 1972
    title: Anti-Oedipus
    who: Gilles Deleuze and Félix Guattari
    relation: claimed
    tagLabel: Claimed ancestor · cited · e/acc
    text: A philosopher and a psychoanalyst publish the first volume of Capitalism and Schizophrenia. In one passage they ask whether the revolutionary path is to withdraw from the world market or to go further into it. They suggest the second, to “accelerate the process”, as Nietzsche put it. Nick Land's 2017 introduction to accelerationism quotes the passage in full.
    source: Gilles Deleuze and Félix Guattari, L'Anti-Œdipe. Capitalisme et schizophrénie, Éditions de Minuit, 1972; English translation by Robert Hurley, Mark Seem and Helen R. Lane, Viking, 1977; Nick Land, “A Quick-and-Dirty Introduction to Accelerationism”, Jacobite, 25 May 2017
    sourceUrl: https://obsoletecapitalism.blogspot.com/2017/05/nick-land-quick-and-dirty-introduction.html
    image: eacc-anti-oedipus-1972
    status: checked
  - id: 1964-kardashev
    year: 1964
    title: Types of civilisation
    who: Nikolai Kardashev
    relation: claimed
    tagLabel: Claimed ancestor · cited · e/acc
    text: Writing on how alien civilisations might send signals, a Soviet astrophysicist ranks them by the power they command. Type I commands roughly the power of a planet, Type II that of its star, Type III that of its galaxy. The e/acc newsletter's first goal is to harness more energy and climb “the Kardashev gradient”. Another is to build AI.
    source: N. S. Kardashev, “Transmission of Information by Extraterrestrial Civilizations”, Astronomicheskii Zhurnal, 1964, translated in Soviet Astronomy 8, 1964, p. 217; e/acc, “What the F* is e/acc”, e/acc newsletter, Substack, 26 December 2022
    sourceUrl: https://effectiveaccelerationism.substack.com/p/what-the-f-is-eacc
    image: eacc-kardashev-1964
    status: checked
