# Timeline of AI ethics, newest first. Each entry: id, year,
# relation (see src/content.config.ts), text, source, themes, image. status: draft until checked.
ism: ai-ethics
entries:
  - id: 2026-head-cameras
    year: 2026
    title: Cameras on workers' heads
    who: Garment and data workers in India, as reported by Scroll.in, AFP and NPR
    relation: milestone
    text: Scroll.in traced a video of garment workers with cameras on their heads to a Pearl Global factory, where workers said nobody sought their consent. In Karur, AFP and NPR found textile workers wearing head cameras from Objectways, which sells such data to AI companies. One woman told AFP that filming her housework paid 250 rupees an hour; NPR reported about $2.60 an hour. Many were never told why, NPR reported; Astha Kapoor of the Aapti Institute called it exploitation of labour.
    source: "Ayush Tiwari and Raghav Kakkar, “How Big Tech is harnessing the data of Indian factory workers to train robots”, Scroll.in, 20 May 2026 (the video, Pearl Global's Gurugram unit, consent); Aishwarya Kumar, “The Indian workers training AI robots to take their jobs”, AFP, 11 June 2026, as published by The Star (Karur, Objectways, 250 rupees an hour); Diaa Hadid and Omkar Khandekar, “These workers help train robots who could one day steal their jobs”, NPR, 14 October 2026, as published by KPBS (Karur, about $2.60 an hour, Astha Kapoor)"
    sourceUrl: https://scroll.in/article/1092960/how-big-tech-is-harnessing-the-data-of-indian-factory-workers-to-train-robots
    status: checked
  - id: 2025-the-ai-con
    year: 2025
    month: 5
    title: The AI Con
    who: Emily M. Bender and Alex Hanna
    relation: milestone
    text: A linguist and a sociologist argue that “AI” is a marketing term, one that “doesn't refer to a coherent set of technologies”. Its hype, they write, lets a few players grow rich on other people's creative work, data and labour. They reject doomers and boosters alike, and see the danger in cheapened labour, data theft and surveillance.
    source: "Emily M. Bender and Alex Hanna, The AI Con: How to Fight Big Tech's Hype and Create the Future We Want, Harper (US) and The Bodley Head (UK), May 2025, introduction, sample published by Penguin; review in Publishers Weekly, 15 April 2025"
    sourceUrl: https://cdn.penguin.co.uk/dam-assets/books/9781847928610/9781847928610-sample.pdf
    themes: [luddite]
    status: checked
  - id: 2024-tescreal
    year: 2024
    month: 4
    title: The TESCREAL bundle
    who: Timnit Gebru and Émile P. Torres
    relation: milestone
    text: Gebru and Torres argue that the race to build AGI rests on a bundle of ideologies. Their acronym joins transhumanism, extropianism, singularitarianism, cosmism, rationalism, effective altruism and longtermism, which they trace to twentieth-century eugenics. A system as undefined as AGI cannot be tested for safety, they argue, so builders should work on well-defined tasks instead.
    source: "Timnit Gebru and Émile P. Torres, “The TESCREAL bundle: Eugenics and the promise of utopia through artificial general intelligence”, First Monday 29(4), April 2024"
    sourceUrl: https://firstmonday.org/ojs/index.php/fm/article/view/13636
    status: checked
  - id: 2023-reply-to-the-pause
    year: 2023
    month: 3
    title: Answering the pause letter
    who: Timnit Gebru, Emily M. Bender, Angelina McMillan-Major and Margaret Mitchell
    relation: milestone
    text: Days after the pause letter, the listed authors of Stochastic Parrots replied. They called its fears of imagined “powerful digital minds” hype, and longtermism a dangerous ideology. The harms, they wrote, are real and present, from exploited workers and data theft to synthetic media and power in few hands. Regulation should demand transparency and hold companies accountable for what their systems produce.
    source: "Statement from the listed authors of Stochastic Parrots on the “AI pause” letter, DAIR Institute, 31 March 2023; Devin Coldewey, TechCrunch, 31 March 2023 (names the four authors)"
    sourceUrl: https://www.dair-institute.org/blog/letter-statement-March2023/
    status: checked
  - id: 2023-kenyan-data-labellers
    year: 2023
    month: 1
    title: Less than $2 an hour
    who: Data labellers in Kenya, as reported by Billy Perrigo in TIME
    relation: milestone
    text: TIME reported that Sama, OpenAI's outsourcing partner in Kenya, paid data labellers about $1.32 to $2 an hour. They labelled passages describing violence, hate speech and sexual abuse, to train a filter meant for ChatGPT. All four workers TIME interviewed said the work left them mentally scarred. Sama disputed the pay figures.
    source: "Billy Perrigo, “Exclusive: OpenAI Used Kenyan Workers on Less Than $2 Per Hour to Make ChatGPT Less Toxic”, TIME, 18 January 2023"
    sourceUrl: https://time.com/6247678/openai-chatgpt-kenya-workers/
    status: checked
  - id: 2021-stochastic-parrots
    year: 2021
    month: 3
    title: On the Dangers of Stochastic Parrots
    who: Emily M. Bender, Timnit Gebru, Angelina McMillan-Major and Margaret Mitchell
    relation: milestone
    text: The four asked whether language models can be too big. They warned of environmental and financial costs, training data too vast to document, and fluent text that seems to mean more than it does. Google asked Gebru to withdraw the paper or remove the names of its employees. Gebru says she was fired in December 2020; Google said it had accepted her resignation.
    source: "Emily M. Bender, Timnit Gebru, Angelina McMillan-Major and Shmargaret Shmitchell (Margaret Mitchell), “On the Dangers of Stochastic Parrots: Can Language Models Be Too Big?”, FAccT '21, ACM, March 2021, doi:10.1145/3442188.3445922; Karen Hao, “We read the paper that forced Timnit Gebru out of Google. Here's what it says.”, MIT Technology Review, 4 December 2020; Wikipedia, “Timnit Gebru”"
    sourceUrl: https://www.technologyreview.com/2020/12/04/1013294/google-ai-ethics-research-paper-forced-out-timnit-gebru/
    themes: [scaling-laws, compute]
    status: checked
  - id: 2019-time-off-task
    year: 2019
    month: 4
    title: Time off task
    who: Amazon warehouse workers in Baltimore, as reported by Colin Lecher in The Verge
    relation: milestone
    text: A letter from a lawyer for Amazon to the US labour board described how its warehouses were run. Software tracked each worker's rate and “time off task”, and generated warnings and firings without input from supervisors. About 300 full-time workers at one Baltimore warehouse, roughly a tenth of its staff, were fired over productivity in a year. Amazon denied that anyone is terminated by an automatic system, and said managers can step in.
    source: "Colin Lecher, “How Amazon automatically tracks and fires warehouse workers for ‘productivity’”, The Verge, 25 April 2019, as reported by CBS News, “Amazon under fire for software that recommends firing workers”, April 2019 (the letter of 4 September 2018 to the National Labor Relations Board; about 300 fired at the Baltimore site between August 2017 and September 2018, roughly 10% of its workforce; Amazon's reply that managers can intervene); KUOW, “Amazon denies report that it fires workers by robot”, 26 April 2019 (the denial)"
    sourceUrl: https://www.cbsnews.com/news/amazon-under-fire-for-software-that-recommends-firing-workers
    status: draft
  - id: 2018-gender-shades
    year: 2018
    title: Gender Shades
    who: Joy Buolamwini and Timnit Gebru
    relation: milestone
    text: Buolamwini, then a graduate student at MIT, and Gebru tested three commercial systems that classify gender from faces, from IBM, Microsoft and Face++. Darker-skinned women were misclassified up to 34.7% of the time, lighter-skinned men at most 0.8%. The study appeared at the first conference on fairness, accountability and transparency, in New York.
    source: "Joy Buolamwini and Timnit Gebru, “Gender Shades: Intersectional Accuracy Disparities in Commercial Gender Classification”, Proceedings of the 1st Conference on Fairness, Accountability and Transparency, PMLR 81, 2018, pp. 77–91; Wikipedia, “Joy Buolamwini” (the three companies)"
    sourceUrl: https://proceedings.mlr.press/v81/buolamwini18a.html
    themes: [facial-recognition]
    status: checked
  - id: 2017-ai-now
    year: 2017
    title: The AI Now Institute
    who: Kate Crawford and Meredith Whittaker
    relation: institutional-root
    text: Crawford and Whittaker launched the AI Now Institute at New York University in November 2017. It set out to study the social implications of AI, from civil rights and biased data to labour and automation. Today, led by Amba Kak and Sarah Myers West, it opposes commercial surveillance and power consolidated in very few companies.
    source: "NYU Tandon School of Engineering, “New Artificial Intelligence Research Institute Launches”, 20 November 2017; AI Now Institute, “About”, ainowinstitute.org"
    sourceUrl: https://engineering.nyu.edu/news/new-artificial-intelligence-research-institute-launches
    status: checked
  - id: 2016-weapons-of-math-destruction
    year: 2016
    month: 9
    title: Weapons of Math Destruction
    who: Cathy O'Neil
    relation: milestone
    text: The mathematician Cathy O'Neil, who had left finance, named the harmful algorithms of her book's title. Models now decide on school places, jobs, loans and health insurance, she argued, yet they are unregulated and hard to contest. They reinforce discrimination, rewarding the advantaged and punishing the poor.
    source: "Cathy O'Neil, Weapons of Math Destruction: How Big Data Increases Inequality and Threatens Democracy, Crown, September 2016"
    sourceUrl: https://www.penguinrandomhouse.com/books/241363/weapons-of-math-destruction-by-cathy-oneil/
    status: checked
  - id: 2016-state-v-loomis
    year: 2016
    month: 7
    title: State v. Loomis
    who: Eric Loomis and the Wisconsin Supreme Court
    relation: milestone
    text: A judge had cited Eric Loomis's high COMPAS scores in sentencing him to six years in prison. He argued that a score from closed-source software he could not examine violated his right to due process. The Wisconsin Supreme Court disagreed, but required warnings that the tool is proprietary and that studies have questioned its fairness by race. In June 2017 the US Supreme Court declined to hear the case.
    source: "Lauren Kirchner, “Wisconsin Court: Warning Labels Are Needed for Scores Rating Defendants' Risk of Future Crime”, ProPublica, 14 July 2016 (the ruling and its four warnings); State v. Loomis, 2016 WI 68, 881 N.W.2d 749 (Wis. 2016), filed 13 July 2016; “State v. Loomis”, Harvard Law Review, vol. 130, p. 1530, March 2017; Wikipedia, “Loomis v. Wisconsin” (certiorari denied on 26 June 2017)"
    sourceUrl: https://www.propublica.org/article/wisconsin-court-warning-labels-needed-scores-rating-risk-future-crime
    status: draft
  - id: 2016-machine-bias
    year: 2016
    month: 5
    title: Machine Bias
    who: Julia Angwin, Jeff Larson, Surya Mattu and Lauren Kirchner, ProPublica
    relation: milestone
    text: ProPublica examined COMPAS, software that scores how likely defendants are to reoffend, using records of over 7,000 people in Broward County, Florida. Black defendants who did not reoffend were almost twice as likely as white ones to have been labelled higher risk. Northpointe, the maker, disputed the analysis.
    source: Julia Angwin, Jeff Larson, Surya Mattu and Lauren Kirchner, “Machine Bias”, ProPublica, 23 May 2016
    sourceUrl: https://www.propublica.org/article/machine-bias-risk-assessments-in-criminal-sentencing
    status: checked
  - id: 2014-fairness-accountability-transparency
    year: 2014
    title: Fairness, accountability, transparency
    who: Solon Barocas and Moritz Hardt
    relation: institutional-root
    text: Barocas and Hardt organised a one-day workshop in Montreal, at the NIPS machine-learning conference, on fairness, accountability and transparency in machine learning. It addressed growing anxiety about machine learning in decisions on jobs, health care, education and policing. Workshops followed each year to 2018, when a first conference under the same three words met in New York. The field's textbook dates a new research community from this workshop.
    source: "“Fairness, Accountability, and Transparency in Machine Learning”, workshop at NIPS 2014, organised by Moritz Hardt and Solon Barocas (nips.cc; fatml.org, schedules 2014–2018); Cathy O'Neil, “Fairness, accountability, and transparency in big data models”, mathbabe.org, 16 December 2014 (one day, Montreal); Solon Barocas, Moritz Hardt and Arvind Narayanan, Fairness and Machine Learning, fairmlbook.org, introduction, bibliographic notes; FAT* 2018, New York (facctconference.org)"
    sourceUrl: https://nips.cc/virtual/2014/workshop/4290
    status: checked
  - id: 1996-bias-in-computer-systems
    year: 1996
    title: Bias in Computer Systems
    who: Batya Friedman and Helen Nissenbaum
    relation: claimed
    text: Friedman and Nissenbaum called a system biased if it discriminates against some people, systematically and unfairly, in favour of others. From actual cases they drew three kinds, preexisting bias from society, technical bias from design and emergent bias from use. Freedom from bias, they argued, should rank with reliability and accuracy. The field's textbook, Fairness and Machine Learning, cites it as an early work on algorithmic fairness.
    source: "Batya Friedman and Helen Nissenbaum, “Bias in Computer Systems”, ACM Transactions on Information Systems 14(3), 1996, pp. 330–347; Solon Barocas, Moritz Hardt and Arvind Narayanan, Fairness and Machine Learning, fairmlbook.org, introduction, bibliographic notes"
    sourceUrl: https://humanrights.uchicago.edu/virtual-library/citation/bias-computer-systems
    status: checked
  - id: 1976-computer-power-and-human-reason
    year: 1976
    title: Computer Power and Human Reason
    who: Joseph Weizenbaum
    relation: claimed
    text: Weizenbaum, who wrote the ELIZA chatbot at MIT, was shocked that many users took it seriously and opened their hearts to it. In this book he argued that whether computers can match people is a separate question from whether they should be given a task. Deciding can be programmed, he wrote, but choosing takes human judgement. Emily M. Bender and Alex Hanna cite his alarm as an early warning against AI hype.
    source: "Joseph Weizenbaum, Computer Power and Human Reason: From Judgment to Calculation, W. H. Freeman, 1976; Wikipedia, “Joseph Weizenbaum”; Emily M. Bender and Alex Hanna, The AI Con, Harper, 2025, excerpted as “On the Very Real Dangers of the Artificial Intelligence Hype Machine”, Literary Hub, 13 May 2025"
    sourceUrl: https://en.wikipedia.org/wiki/Joseph_Weizenbaum
    status: checked
  - id: 1950-human-use-of-human-beings
    year: 1950
    title: The Human Use of Human Beings
    who: Norbert Wiener
    relation: attributed
    text: Two years after Cybernetics, Wiener explored the ethical questions computers would raise, unemployment among them. In the revised edition of 1954 he likened automatic machines to slave labour and foresaw mass unemployment. He urged that they be used for human benefit, not merely for profit. The philosopher Terrell Bynum calls him the founder of computer ethics, though Wiener did not coin the term.
    source: "Norbert Wiener, The Human Use of Human Beings: Cybernetics and Society, Houghton Mifflin, 1950; second edition, 1954, chapter IX; Terrell Bynum, “Computer and Information Ethics”, Stanford Encyclopedia of Philosophy, 2001, revised 2015"
    sourceUrl: https://plato.stanford.edu/archives/sum2020/entries/ethics-computer/
    status: checked
