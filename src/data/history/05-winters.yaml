- id: 1976-mycin
  era: winters
  year: 1976
  title: MYCIN advises doctors
  line: A Stanford program advises doctors on infections, one rule at a time.
  who: Edward Shortliffe, with Bruce Buchanan and Stanley Cohen, Stanford University
  text: |
    MYCIN, named after a common ending for antibiotics, was among the first expert systems, which hold a specialist's know-how as if–then rules. Described in Shortliffe's 1976 book, it advised physicians on bacterial infections, asking questions and explaining its reasoning. Its knowledge sat in a few hundred rules drawn from experts, each with a “certainty factor” for how sure they were.

    In evaluations, a majority of reviewers rated 70 per cent of its therapies acceptable. The team noted that 75 per cent was better than the agreement Stanford's own faculty generally reached under the same criteria.

    Keeping the rules apart from the reasoning engine let others reuse it for new fields, as EMYCIN did, from tax planning to structural analysis.
  source: "Edward H. Shortliffe, Computer-Based Medical Consultations: MYCIN, Elsevier, 1976; Nils J. Nilsson, The Quest for Artificial Intelligence, Cambridge University Press, 2010, ch. 18, quoting Bruce Buchanan and Edward Shortliffe, Rule-Based Expert Systems, Addison-Wesley, 1984"
  sourceUrl: https://ai.stanford.edu/~nilsson/QAI/qai.pdf
  thread: symbols-networks
  isms: []
