- id: 1992-td-gammon
  era: winters
  year: 1992
  title: TD-Gammon
  line: A neural network teaches itself backgammon by playing against itself.
  who: Gerald Tesauro, IBM
  text: Tesauro's program joined a neural network to temporal-difference learning, a form of reinforcement learning. Starting from random weights, it learned from the results of games against itself. At the 1992 World Cup of Backgammon it played 38 exhibition games against top players and lost by only 7 points overall. Experts later adopted some of its opening moves.
  source: "Gerald Tesauro, “Temporal Difference Learning and TD-Gammon”, Communications of the ACM 38 (3), March 1995"
  sourceUrl: https://bkgm.com/articles/tesauro/tdl.html
  thread: games
  isms: []
  themes: []
  status: draft

- id: 1988-mind-children
  era: winters
  year: 1988
  title: Mind Children
  line: A roboticist predicts that robots will soon do everything people do.
  who: Hans Moravec
  text: Moravec predicted that robots would soon do everything people do, only better, and then go further. A reviewer read “soon” as within about fifty years. Like natural children, the robots would make their own way while their human parents faded. Vernor Vinge cited the book in 1993.
  source: "Hans Moravec, Mind Children: The Future of Robot and Human Intelligence, Harvard University Press, 1988; reviewed by Noel Perrin, The Washington Post, 23 October 1988"
  sourceUrl: https://frc.ri.cmu.edu/~hpm/book88/reviews/881023.WashPost.html
  thread: made-beings
  isms: [singularitarianism]
  themes: []
  status: draft

- id: 1987-second-winter
  era: winters
  year: 1987
  title: The second AI winter
  line: The expert-systems boom ends, AI firms close and budgets fall.
  who: AI companies, the American Association for Artificial Intelligence, DARPA
  text: Membership of the American Association for Artificial Intelligence peaked at 16,421 in 1987, then fell. Sponsors had expected more than the systems delivered, and Lisp machine makers lost out to makers of ordinary workstations. Several AI companies closed. Between 1987 and 1989, DARPA's budget for basic AI and Strategic Computing research fell from $47 million to $31 million.
  source: "Nils J. Nilsson, The Quest for Artificial Intelligence, Cambridge University Press, 2010, ch. 21 and 24, citing Alex Roland with Philip Shiman, Strategic Computing, MIT Press, 2002"
  sourceUrl: https://ai.stanford.edu/~nilsson/QAI/qai.pdf
  thread: booms-winters
  isms: []
  themes: []
  status: draft

- id: 1986-backpropagation
  era: winters
  year: 1986
  month: 10
  title: Backpropagation
  line: Neural networks return, with a way to train their hidden layers.
  who: David Rumelhart, Geoffrey Hinton and Ronald Williams
  text: A letter in Nature described back-propagation, which adjusts every weight in a layered network to reduce its error. Hidden units, neither input nor output, came by themselves to represent useful features of a task. That year Rumelhart, James McClelland and their PDP group published two volumes on parallel distributed processing, computation modelled on the brain. Their networks of simple units were at odds with Newell and Simon's symbol systems.
  source: "David E. Rumelhart, Geoffrey E. Hinton and Ronald J. Williams, “Learning representations by back-propagating errors”, Nature 323, 9 October 1986, pp. 533–536; Nils J. Nilsson, The Quest for Artificial Intelligence, Cambridge University Press, 2010, ch. 25 and 29"
  sourceUrl: https://ui.adsabs.harvard.edu/abs/1986Natur.323..533R/abstract
  thread: symbols-networks
  isms: []
  themes: []
  status: draft

- id: 1984-cyc
  era: winters
  year: 1984
  title: Cyc begins
  line: A project sets out to type common sense into a computer, fact by fact.
  who: Douglas Lenat, at MCC in Austin, Texas
  text: In the autumn of 1984 Lenat left Stanford for MCC, the American consortium formed in answer to Japan's Fifth Generation project. His team set out to enter millions of everyday facts and rules of thumb by hand. The name comes from the middle of “encyclopedia”, since Cyc should know enough to read one. Lenat first thought it needed a couple of million general assertions, and later put the figure nearer 200 million.
  source: "Nils J. Nilsson, The Quest for Artificial Intelligence, Cambridge University Press, 2010, ch. 26, quoting Douglas Lenat; Douglas B. Lenat and R. V. Guha, Building Large Knowledge-Based Systems, Addison-Wesley, 1990; “‘Fifth Generation’ Became Japan's Lost Generation”, The New York Times, 5 June 1992"
  sourceUrl: https://ai.stanford.edu/~nilsson/QAI/qai.pdf
  thread: symbols-networks
  isms: []
  themes: []
  status: draft

- id: 1983-strategic-computing
  era: winters
  year: 1983
  month: 10
  title: Strategic Computing
  line: DARPA launches a billion-dollar programme for intelligent military machines.
  who: Robert Kahn and Robert Cooper, DARPA
  text: DARPA's plan, written up in October 1983, aimed to move expert systems, vision and speech out of the laboratory and into military use. Its showcase projects were a pilot's associate, a naval battle-management system and an autonomous land vehicle. Congress, worried by Japan's Fifth Generation project, approved the money. From 1983 to 1993 DARPA spent just over $1 billion on it.
  source: "Nils J. Nilsson, The Quest for Artificial Intelligence, Cambridge University Press, 2010, ch. 23; Alex Roland with Philip Shiman, Strategic Computing: DARPA and the Quest for Machine Intelligence, 1983–1993, MIT Press, 2002"
  sourceUrl: https://ai.stanford.edu/~nilsson/QAI/qai.pdf
  thread: booms-winters
  isms: []
  themes: []
  status: draft

- id: 1982-fifth-generation
  era: winters
  year: 1982
  title: Japan's Fifth Generation
  line: Japan launches a ten-year plan for computers that reason and converse.
  who: Japan's Ministry of International Trade and Industry (MITI) and its institute ICOT, led by Kazuhiro Fuchi
  text: MITI's project aimed at computers that draw inferences from large knowledge bases and talk with people in natural language. ICOT built parallel inference machines based on logic programming, with Prolog as the starting point. The plan stirred fear in the United States that Japan would overtake its computer industry. By 1992 the project was fizzling out, short of many goals, after spending about $400 million.
  source: "Nils J. Nilsson, The Quest for Artificial Intelligence, Cambridge University Press, 2010, ch. 22; “‘Fifth Generation’ Became Japan's Lost Generation”, The New York Times, 5 June 1992"
  sourceUrl: https://ai.stanford.edu/~nilsson/QAI/qai.pdf
  thread: booms-winters
