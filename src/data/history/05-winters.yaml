- id: 1975-darpa-heilmeier
  era: winters
  year: 1975
  title: DARPA demands military payoffs
  line: The Pentagon's research agency turns AI work towards military needs.
  who: George Heilmeier and J. C. R. Licklider, DARPA
  text: |
    From 1962 the Pentagon's research agency, later called DARPA, generously funded open-ended AI research at MIT, Stanford, Carnegie Mellon and SRI. The Mansfield Amendment of 1969 tied Defense Department research to specific military purposes, though DARPA's managers cushioned it until the mid-1970s.

    In 1975 George Heilmeier became DARPA's director; at the electronics firm RCA he had led the team that invented the first liquid-crystal display. He asked for roadmaps and shorter-term results, such as computers that could read Morse code through noise. Licklider, who ran DARPA's computing office, warned AI leaders by email in April 1975 of pressure to turn university work to military problems.

    Heilmeier declined to continue DARPA's speech-understanding programme, whose systems could not answer in real time, judging it basic research for the National Science Foundation.
  source: "Nils J. Nilsson, The Quest for Artificial Intelligence, Cambridge University Press, 2010, ch. 8, 16 and 19, quoting J. C. R. Licklider's email of 2 April 1975"
  sourceUrl: https://ai.stanford.edu/~nilsson/QAI/qai.pdf
