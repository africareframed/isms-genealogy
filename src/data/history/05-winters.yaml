- id: 1992-td-gammon
  era: winters
  year: 1992
  title: A network teaches itself backgammon
  line: A neural network teaches itself backgammon by playing against itself.
  who: Gerald Tesauro, IBM
  text: |
    In backgammon, two players roll dice and race their pieces in opposite directions around a board. Gerald Tesauro of IBM joined a neural network to temporal-difference learning, a form of reinforcement learning, in which a program learns from rewards. Starting from random weights, it played itself, nudging its judgement of each position towards its judgement of the next, and finally towards the result.

    At the 1992 World Cup of Backgammon it played 38 exhibition games against top players and lost by only 7 points overall. Experts later adopted some of its opening moves, abandoning a play they had long preferred.

    It surpassed earlier programs, including Tesauro's own Neurogammon, which had been trained on experts' moves.
  source: "Gerald Tesauro, “Temporal Difference Learning and TD-Gammon”, Communications of the ACM 38 (3), March 1995; Nils J. Nilsson, The Quest for Artificial Intelligence, Cambridge University Press, 2010, ch. 29"
  sourceUrl: https://bkgm.com/articles/tesauro/tdl.html
  thread: games
  isms: []
  themes: []
  status: checked

- id: 1988-mind-children
  era: winters
  year: 1988
  title: Mind Children
  line: A roboticist predicts that robots will soon do everything people do.
  who: Hans Moravec
  text: |
    Hans Moravec, a roboticist at Carnegie Mellon University, predicted that robots would soon do everything people do, only better, and then go further. His case rested on computing power, which had grown about a millionfold in forty years while human ability stayed the same. A reviewer, who found the book sensational, read “soon” as within about fifty years.

    Like natural children, the robots would make their own way while their human parents faded. Making people superhuman by genetic engineering would not help, he argued: they would be second-rate robots. Vernor Vinge cited the book in 1993.
  source: "Hans Moravec, Mind Children: The Future of Robot and Human Intelligence, Harvard University Press, 1988; reviewed by Noel Perrin, “Anything We Can Do They Can Do Better”, The Washington Post, 23 October 1988"
  sourceUrl: https://frc.ri.cmu.edu/~hpm/book88/reviews/881023.WashPost.html
  thread: made-beings
  isms: [singularitarianism]
  themes: []
  status: checked

- id: 1987-second-winter
  era: winters
  year: 1987
  title: The second AI winter
  line: The expert-systems boom ends, AI firms close and budgets fall.
  who: AI companies, the American Association for Artificial Intelligence, DARPA
  text: |
    An “AI winter” is a spell when money and interest drain away from the field after its promises go unmet. At a 1984 conference panel, leading researchers had warned that inflated hopes could bring one on. Membership of the American Association for Artificial Intelligence peaked at 16,421 in 1987, then fell to between 4,000 and 5,000 by 1996.

    Sponsors had expected more than the systems delivered, and expert systems proved brittle outside their narrow fields. Lisp machines, computers built to run Lisp, the main language of AI, lost out to ordinary workstations, and several AI companies closed.

    Between 1987 and 1989, DARPA's budget for basic AI and Strategic Computing research fell from $47 million to $31 million.
  source: "Nils J. Nilsson, The Quest for Artificial Intelligence, Cambridge University Press, 2010, ch. 21 and 24, quoting Drew McDermott at the 1984 AAAI panel and citing Alex Roland with Philip Shiman, Strategic Computing, MIT Press, 2002"
  sourceUrl: https://ai.stanford.edu/~nilsson/QAI/qai.pdf
  thread: booms-winters
  isms: [ai-skepticism]
  themes: []
  status: checked

- id: 1986-backpropagation
  era: winters
  year: 1986
  month: 10
  title: Backpropagation revives neural networks
  line: Neural networks return, with a way to train their hidden layers.
  who: David Rumelhart, Geoffrey Hinton and Ronald Williams
  text: |
    Since the 1960s researchers had known how to train a single layer of a neural network, but not several at once. A letter in Nature described back-propagation, which sends a network's errors backwards through its layers, nudging every connection to reduce them. Hidden units, neither input nor output, came by themselves to represent useful features of a task.

    That year David Rumelhart, James McClelland and their PDP group published two volumes on parallel distributed processing, computation modelled on the brain. Their networks of simple units were at odds with most AI of the time, which manipulated symbols step by step.

    Similar ideas had appeared earlier, notably in Paul Werbos's 1974 Harvard thesis.
  source: "David E. Rumelhart, Geoffrey E. Hinton and Ronald J. Williams, “Learning representations by back-propagating errors”, Nature 323, 9 October 1986, pp. 533–536; Nils J. Nilsson, The Quest for Artificial Intelligence, Cambridge University Press, 2010, ch. 25 and 29 (citing Paul Werbos, “Beyond Regression”, PhD thesis, Harvard University, 1974)"
  sourceUrl: https://ui.adsabs.harvard.edu/abs/1986Natur.323..533R/abstract
  thread: symbols-networks
  isms: []
  themes: []
  status: checked

- id: 1984-cyc
  era: winters
  year: 1984
  title: Cyc begins
  line: A project sets out to type common sense into a computer, fact by fact.
  who: Douglas Lenat, at MCC in Austin, Texas
  text: |
    Expert systems knew their narrow field but lacked common sense, such as the fact that men do not get pregnant. In the autumn of 1984 Douglas Lenat, a Stanford professor, left for MCC, the American consortium formed in answer to Japan's Fifth Generation project. His team set out to enter millions of everyday facts and rules of thumb by hand.

    The name comes from the middle of “encyclopedia”: Cyc should know enough to read one, and then go on learning by itself. Lenat first thought it needed a couple of million general assertions, and later put the figure nearer 200 million.

    In 1994 Lenat moved the work to his own company, Cycorp, and by 2009 its knowledge base held over five million general assertions.
  source: "Nils J. Nilsson, The Quest for Artificial Intelligence, Cambridge University Press, 2010, ch. 22, 24 and 26, quoting Douglas Lenat"
  sourceUrl: https://ai.stanford.edu/~nilsson/QAI/qai.pdf
