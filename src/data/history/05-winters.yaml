- id: 1975-darpa-heilmeier
  era: winters
  year: 1975
  title: DARPA demands military payoffs
  line: The Pentagon's research agency turns AI work towards military needs.
  who: George Heilmeier and J. C. R. Licklider, DARPA
  text: The Mansfield Amendment of 1969 had already tied Defense Department research to specific military purposes. When Heilmeier became DARPA's director in 1975, he asked for roadmaps and shorter-term results. In an April 1975 email, Licklider warned AI leaders that university work was being redirected. Heilmeier declined to continue DARPA's speech-understanding programme, which he judged to be basic research.
  source: "Nils J. Nilsson, The Quest for Artificial Intelligence, Cambridge University Press, 2010, ch. 16 and 19, quoting J. C. R. Licklider's email of 2 April 1975"
  sourceUrl: https://ai.stanford.edu/~nilsson/QAI/qai.pdf
