- id: 1982-fifth-generation
  era: winters
  year: 1982
  title: Japan's Fifth Generation, and America's answer
  line: Japan sets out to build computers that reason, and the Pentagon answers with a billion-dollar plan.
  who: Japan's Ministry of International Trade and Industry (MITI) and its institute ICOT, led by Kazuhiro Fuchi; Robert Kahn and Robert Cooper, DARPA
  text: |
    In 1982 Japan's trade ministry, MITI, launched a ten-year plan for a fifth generation of computers, beyond valves, transistors and microchips. These would draw inferences from large stores of knowledge and talk with people in ordinary language. Its institute, ICOT, led by Kazuhiro Fuchi, built parallel “inference machines” based on logic programming, starting from the language Prolog.

    American computer firms, aware of Japan's growing lead in consumer electronics, feared losing their own lead in computers. DARPA, the Pentagon's research agency, drew up Strategic Computing, a plan of October 1983 to move expert systems, vision and speech into military use. Its showcases were a pilot's associate, a naval battle-management system and a driverless land vehicle; Congress, alarmed by Japan, approved the money.

    By 1992 Japan's project, budgeted at about $380 million, was fizzling out short of many goals; ordinary workstations had overtaken its machines. Strategic Computing cost just over $1 billion; the military did not take up its showcases as planned, and it left DARPA's budget in 1993.
  source: "Nils J. Nilsson, The Quest for Artificial Intelligence, Cambridge University Press, 2010, ch. 22 and 23 (a ten-year budget of ¥54.2 billion, about $380 million at the 1990 exchange rate; workstations and personal computers overtook ICOT's machines; Strategic Computing vanished from DARPA's budget in 1993); Alex Roland with Philip Shiman, Strategic Computing: DARPA and the Quest for Machine Intelligence, 1983–1993, MIT Press, 2002; “‘Fifth Generation’ Became Japan's Lost Generation”, The New York Times, 5 June 1992"
  sourceUrl: https://ai.stanford.edu/~nilsson/QAI/qai.pdf
  thread: booms-winters
  isms: []
  themes: []
  status: checked

- id: 1980-xcon
  era: winters
  year: 1980
  title: XCON goes to work
  line: An expert system configures computers for Digital Equipment Corporation.
  who: John McDermott, Carnegie Mellon University, for Digital Equipment Corporation (DEC)
  text: McDermott's R1 worked out how to configure DEC's VAX-11/780 computers, using 772 if–then rules in June 1980. Developed into XCON, it went into use that year at DEC's plant in Salem, New Hampshire. By 1989 DEC's configuration systems held about 17,500 rules, and DEC estimated their net return at over $40 million a year.
  source: "John McDermott, “R1: An Expert in the Computer Systems Domain”, AAAI conference, 1980; Virginia E. Barker and Dennis E. O'Connor, “Expert Systems for Configuration at Digital: XCON and Beyond”, Communications of the ACM 32 (3), March 1989, quoted in Nils J. Nilsson, The Quest for Artificial Intelligence, 2010, ch. 18"
  sourceUrl: https://cdn.aaai.org/AAAI/1980/AAAI80-076.pdf
