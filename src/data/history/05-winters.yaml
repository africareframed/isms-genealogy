  themes: []
  status: draft

- id: 1980-xcon
  era: winters
  year: 1980
  title: XCON goes to work
  line: An expert system configures computers for Digital Equipment Corporation.
  who: John McDermott, Carnegie Mellon University, for Digital Equipment Corporation (DEC)
  text: McDermott's R1 worked out how to configure DEC's VAX-11/780 computers, using 772 if–then rules in June 1980. Developed into XCON, it went into use that year at DEC's plant in Salem, New Hampshire. By 1989 DEC's configuration systems held about 17,500 rules, and DEC estimated their net return at over $40 million a year.
  source: "John McDermott, “R1: An Expert in the Computer Systems Domain”, AAAI conference, 1980; Virginia E. Barker and Dennis E. O'Connor, “Expert Systems for Configuration at Digital: XCON and Beyond”, Communications of the ACM 32 (3), March 1989, quoted in Nils J. Nilsson, The Quest for Artificial Intelligence, 2010, ch. 18"
  sourceUrl: https://cdn.aaai.org/AAAI/1980/AAAI80-076.pdf
  thread: booms-winters
  isms: []
  themes: []
  status: draft

- id: 1976-mycin
  era: winters
  year: 1976
  title: MYCIN
  line: A Stanford program advises doctors on infections, one rule at a time.
  who: Edward Shortliffe, with Bruce Buchanan and Stanley Cohen, Stanford University
  text: Described in Shortliffe's 1976 book, MYCIN advised physicians on bacterial infections, asking questions and explaining its reasoning. Its knowledge sat in a few hundred if–then rules drawn from experts, each with a certainty factor. In evaluations, a majority of reviewers rated 70 per cent of its therapies acceptable. Keeping the rules apart from the reasoning engine let others reuse it for new fields, as EMYCIN did.
  source: "Edward H. Shortliffe, Computer-Based Medical Consultations: MYCIN, Elsevier, 1976; Nils J. Nilsson, The Quest for Artificial Intelligence, Cambridge University Press, 2010, ch. 18"
  sourceUrl: https://ai.stanford.edu/~nilsson/QAI/qai.pdf
