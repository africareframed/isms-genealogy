  isms: []
  themes: []
  status: checked

- id: 2010-deepmind
  era: learning
  year: 2010
  title: DeepMind is founded
  line: A small start-up sets out to understand and recreate intelligence.
  who: Demis Hassabis, Shane Legg and Mustafa Suleyman
  text: Hassabis, Legg and Suleyman founded DeepMind in 2010, aiming to answer big questions by understanding and recreating intelligence. Hassabis later called it a tiny start-up working in a very unfashionable area. In August 2010 he met the investor Peter Thiel at his home, after the Singularity Summit. Thiel went on to invest £1.4 million, and let the company stay in London.
  source: "Demis Hassabis, “Entering our tenth year at DeepMind”, DeepMind blog, 5 December 2019; CNBC, “DeepMind's Demis Hassabis used chess to get Peter Thiel's attention”, 7 December 2020, reporting The Sunday Times"
  sourceUrl: https://deepmind.google/blog/announcements/entering-our-tenth-year-at-deepmind
