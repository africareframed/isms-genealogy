- id: 1997-deep-blue
  era: learning
  year: 1997
  month: 5
  title: Deep Blue beats Kasparov
  line: An IBM computer defeats the world chess champion in a match.
  who: IBM Research (Feng-hsiung Hsu, Murray Campbell, Joe Hoane and others), against Garry Kasparov
  text: IBM hired Hsu and Campbell in 1989 to build a chess computer. In February 1996 Kasparov beat it 4–2, though it won the first game. In the May 1997 rematch in New York, Deep Blue won 3½–2½. It used 32 processors and could evaluate 200 million chess positions a second.
  source: "IBM, “Deep Blue”, IBM History"
  sourceUrl: https://ibm.com/history/deep-blue
