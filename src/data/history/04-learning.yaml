- id: 2010-deepmind
  era: learning
  year: 2010
  title: DeepMind is founded
  line: A small start-up sets out to understand and recreate intelligence.
  who: Demis Hassabis, Shane Legg and Mustafa Suleyman
  text: |
    Demis Hassabis, Shane Legg and Mustafa Suleyman founded DeepMind in 2010, aiming to answer big questions by understanding and recreating intelligence. Hassabis, a former junior chess star and game designer, later called it a “tiny start-up working in a very unfashionable area”. Its approach blended machine learning with neuroscience, the study of the brain.

    In August 2010 Hassabis met the investor Peter Thiel at his home, after the Singularity Summit. Given a minute, he talked about chess, which Thiel had also played as a junior, instead of pitching his business. Thiel went on to invest £1.4 million and let it stay in London rather than move to Silicon Valley; Google bought DeepMind in 2014.
  source: "Demis Hassabis, “Entering our tenth year at DeepMind”, DeepMind blog, 5 December 2019; CNBC, “DeepMind's Demis Hassabis used chess to get Peter Thiel's attention”, 7 December 2020, reporting The Sunday Times"
  sourceUrl: https://deepmind.google/blog/announcements/entering-our-tenth-year-at-deepmind
