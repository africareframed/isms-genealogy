- id: 2005-stanley
  era: learning
  year: 2005
  title: Stanley wins the desert race
  line: A robot car drives 132 miles of desert with no one aboard.
  who: Stanford Racing Team, led by Sebastian Thrun
  text: |
    Congress had set the armed forces a goal: by 2015, a third of their ground combat vehicles should be unmanned. To speed this up, DARPA, the Pentagon's research agency, staged the Grand Challenge, a desert race for vehicles with no one aboard. In 2004 none finished, and its $1 million prize went unclaimed; the farthest got just under seven and a half miles.

    On 8 October 2005 five teams completed the 132-mile course. Stanford's Stanley, a modified Volkswagen Touareg built by Sebastian Thrun's team, won in just under seven hours and took the $2 million prize.

    Its lasers marked out drivable ground just ahead, and its software used those patches to learn what road looked like on camera.
  source: "DARPA, “The Grand Challenge”, Innovation Timeline; “Computerized Car Is Champ”, Stanford Magazine, November/December 2005; Greta Lorge, “Drivers Not Wanted”, Stanford Magazine, January/February 2006; Nils J. Nilsson, The Quest for Artificial Intelligence, Cambridge University Press, 2010, ch. 32 (the goal in the Defense Authorization Act for fiscal 2001; the farthest run in 2004; Stanley's lasers and camera)"
  sourceUrl: https://www.darpa.mil/about/innovation-timeline/grand-challenge
