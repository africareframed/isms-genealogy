- id: 2003-palantir
  era: learning
  year: 2003
  title: Palantir
  line: Peter Thiel and partners set up a company to help US spy agencies make sense of their data.
  who: Peter Thiel; Alex Karp; Stephen Cohen; Joe Lonsdale; Nathan Gettings; In-Q-Tel
  text: "In 2003, after 9/11, Peter Thiel and partners founded Palantir for US counter-terrorism work; In-Q-Tel, the CIA's venture arm, invested more than $2 million. Its software spread from spy agencies to the military and police, then to banks and companies, US immigration and health agencies, and England's NHS. In 2019 it took over Google's role in Project Maven, the Pentagon's AI programme, which Google quit after staff protests in 2018. Its 2023 Artificial Intelligence Platform linked language models to clients' data; US officials said its Maven Smart System helped pick Iranian targets in 2026."
  source: "Palantir Technologies Inc., Form S-1 Registration Statement, US Securities and Exchange Commission, 25 August 2020 (founded and incorporated in 2003; software for US intelligence to assist counter-terrorism; Gotham first, Foundry later for companies; Karp, Cohen and Thiel as co-founders); Alexander C. Karp and Nicholas W. Zamiska, The Technological Republic, Vintage paperback, 2026, first published 2025 (founded in the years after the September 11 attacks to work for US defence and intelligence agencies); Andy Greenberg and Ryan Mac, “How A ‘Deviant’ Philosopher Built Palantir, A CIA-Funded Data-Mining Juggernaut”, Forbes, 14 August 2013 (founders; In-Q-Tel, the CIA's venture arm, more than $2 million in two rounds; the CIA its only customer 2005–08; Marines, NYPD and LAPD; JPMorgan its first commercial customer, 2010); Spencer Woodman, “Palantir Provides the Engine for Donald Trump's Deportation Machine”, The Intercept, 2 March 2017 (ICE's $41 million case-management contract, 2014); Palantir, “CDC Partners with Palantir to Bolster the Fight Against COVID-19”, Business Wire, February 2022 (a longtime CDC partner, including against Ebola; HHS's Tiberius platform, 2020); NHS England, “New NHS software to improve care for millions of patients”, November 2023 (Federated Data Platform: up to £330 million over seven years to a Palantir-led group); Tristan Greene, “Report: Palantir took over Project Maven, the military AI program too unethical for Google”, The Next Web, 11 December 2019 (after Business Insider); Matt Mande and Gregory C. Allen, “What Is Maven Smart System, and What Does It Do?”, CSIS, 2 June 2026 (Google withdrew in 2018 after staff protests; Maven Smart System grew out of Project Maven on Palantir's platform); Andrew Tarantola, “Palantir shows off an AI that can go to war”, Engadget, 26 April 2023, and Jake Rudnitsky, “Peter Thiel's Palantir sees ‘unprecedented’ demand for A.I.”, Fortune (with Bloomberg), 9 May 2023 (AIP connects language models to clients' own data and networks); Michael Klare, “AI Plays Major Role in the War on Iran”, Arms Control Today, May 2026, and Sydney J. Freedberg Jr., “‘Insatiable appetite’ for AI: Maven usage surged for strikes on Iran, Pentagon AI chief says”, Breaking Defense, 12 May 2026 (senior US officials, among them the Pentagon's chief digital and AI officer Cameron Stanley, on Maven Smart System's role in choosing targets)"
  sourceUrl: https://www.sec.gov/Archives/edgar/data/1321655/000119312520230013/d904406ds1.htm
