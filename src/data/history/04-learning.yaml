- id: 1997-lstm
  era: learning
  year: 1997
  month: 11
  title: Networks learn to remember
  line: A recurrent network learns to remember across long sequences.
  who: Sepp Hochreiter and Jürgen Schmidhuber
  text: |
    Recurrent networks read a sequence, such as speech or text, one step at a time, carrying a memory of what came before. Trained by backpropagation, they struggled to link events far apart, because their error signals faded as they flowed back.

    Sepp Hochreiter and Jürgen Schmidhuber added memory cells that keep the error flowing, with gates that learn to open and close access to them. On artificial tasks their network bridged gaps of more than 1,000 steps, solving problems no earlier recurrent network had solved.

    In 2016 Google built its new translation system on deep LSTM networks.
  source: "Sepp Hochreiter and Jürgen Schmidhuber, “Long Short-Term Memory”, Neural Computation 9 (8), 1997, pp. 1735–1780; Yonghui Wu and others, “Google's Neural Machine Translation System: Bridging the Gap between Human and Machine Translation”, arXiv:1609.08144, 26 September 2016"
  sourceUrl: https://mlanthology.org/neco/1997/hochreiter1997neco-long
