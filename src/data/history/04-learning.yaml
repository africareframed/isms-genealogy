  status: checked

- id: 2009-imagenet
  era: learning
  year: 2009
  title: ImageNet
  line: Princeton researchers build a vast library of labelled images.
  who: Jia Deng, Li Fei-Fei, Kai Li and colleagues, Princeton University
  text: ImageNet sorted photographs into the categories of WordNet, a database of English words. At its debut it held 3.2 million images in 5,247 categories, and aimed at around 50 million. Workers on Amazon Mechanical Turk checked each image, with several voting independently.
  source: "Jia Deng, Wei Dong, Richard Socher, Li-Jia Li, Kai Li and Li Fei-Fei, “ImageNet: A Large-Scale Hierarchical Image Database”, IEEE Conference on Computer Vision and Pattern Recognition (CVPR), 2009"
  sourceUrl: https://wordnet.cs.princeton.edu/papers/imagenet_cvpr09.pdf
  thread: compute
  isms: []
  themes: []
  status: checked

- id: 2006-cuda
  era: learning
  year: 2006
  month: 11
  title: CUDA opens graphics chips to computing
  line: Nvidia lets programmers use its graphics chips for general calculation.
  who: Nvidia
  text: On 16 November 2006 Nvidia unveiled CUDA, with a C compiler for programming its graphics processors. It ran on the new GeForce 8800, whose 128 processor cores could cooperate on one problem. In 2009 a Stanford team reported training deep belief nets up to 70 times faster on such chips than on a dual-core processor.
  source: "Nvidia, press release on CUDA, 16 November 2006, in Computer Graphics World; Rajat Raina, Anand Madhavan and Andrew Y. Ng, “Large-scale Deep Unsupervised Learning using Graphics Processors”, ICML 2009"
  sourceUrl: https://www.cgw.com/Press-Center/News/2006/Nvidia-Introduces-CUDA-Architecture-for-Computin.aspx
  thread: compute
  isms: []
  themes: [compute]
  status: checked

- id: 2006-deep-belief-nets
  era: learning
  year: 2006
  month: 7
  title: Deep belief nets
  line: Hinton's group shows how to train networks many layers deep.
  who: Geoffrey Hinton, Simon Osindero and Yee-Whye Teh
  text: The paper gave a fast, greedy method that trains a deep network one layer at a time, before slower fine-tuning. Its model of handwritten digits, with three hidden layers, classified them better than the best discriminative methods. Hinton was then leading CIFAR's Neural Computation and Adaptive Perception programme, whose members included Yann LeCun and Yoshua Bengio.
  source: "Geoffrey E. Hinton, Simon Osindero and Yee-Whye Teh, “A Fast Learning Algorithm for Deep Belief Nets”, Neural Computation 18 (7), 2006, pp. 1527–1554; CIFAR, “Our story”, cifar.ca"
  sourceUrl: https://www.cs.utoronto.ca/~hinton/absps/ncfast.pdf
