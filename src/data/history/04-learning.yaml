- id: 1998-lenet-mnist
  era: learning
  year: 1998
  title: A network learns to read handwriting
  line: A convolutional network learns to read handwriting, and millions of cheques.
  who: Yann LeCun, Léon Bottou, Yoshua Bengio and Patrick Haffner
  text: |
    Yann LeCun's team at AT&T Labs argued that networks could learn to read handwriting from examples, rather than rely on features designed by hand. Their convolutional network, LeNet-5, scanned each image with small detectors for edges, line ends and corners, then combined them layer by layer.

    To compare methods fairly, the team built MNIST, mixing digits written by US Census Bureau staff and by high-school students. It held 60,000 training digits and 10,000 for testing, drawn from two collections of NIST, the US standards agency. Convolutional networks beat every other technique compared, and LeNet-5 misread under 1 per cent of the test digits.

    A cheque-reading system built on these methods, sold by NCR to American banks, read several million cheques a day.
  source: "Yann LeCun, Léon Bottou, Yoshua Bengio and Patrick Haffner, “Gradient-Based Learning Applied to Document Recognition”, Proceedings of the IEEE 86 (11), November 1998"
  sourceUrl: https://gwern.net/doc/ai/nn/cnn/1998-lecun.pdf
