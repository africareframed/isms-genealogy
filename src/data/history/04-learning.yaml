- id: 2006-cuda
  era: learning
  year: 2006
  month: 11
  title: CUDA opens graphics chips to computing
  line: Nvidia lets programmers use its graphics chips for general calculation.
  who: Nvidia
  text: |
    Graphics processors, or GPUs, are the chips that draw images on a computer screen, using many small cores working in parallel. On 16 November 2006 Nvidia unveiled CUDA, which let programmers use its graphics chips for general calculation, writing in the common language C.

    It ran on the new GeForce 8800, whose 128 processor cores could cooperate on one problem. Nvidia pictured uses in product design, data analysis, technical computing and game physics, claiming speeds up to 100 times those of traditional approaches.

    In 2009 a Stanford team reported training deep belief nets up to 70 times faster on such chips than on a dual-core processor. A four-layer network with 100 million adjustable weights, which had needed weeks of training, now took about a day.
  source: "Nvidia, press release on CUDA, 16 November 2006, in Computer Graphics World; Rajat Raina, Anand Madhavan and Andrew Y. Ng, “Large-scale Deep Unsupervised Learning using Graphics Processors”, Proceedings of the 26th International Conference on Machine Learning (ICML), 2009 (the proceedings version gives up to 70 times; a later abstract gives 55)"
  sourceUrl: https://www.cgw.com/Press-Center/News/2006/Nvidia-Introduces-CUDA-Architecture-for-Computin.aspx
