- id: 1997-deep-blue
  era: learning
  year: 1997
  month: 5
  title: Deep Blue beats Kasparov
  line: An IBM computer defeats the world chess champion in a match.
  who: IBM Research (Feng-hsiung Hsu, Murray Campbell, Joe Hoane and others), against Garry Kasparov
  text: |
    Chess had long been seen as a test of whether a computer could rival the human brain. In 1989 IBM hired Feng-hsiung Hsu and Murray Campbell to build Deep Blue, which lost 4–2 to the world champion, Garry Kasparov, in 1996. In the 1997 rematch in New York it won 3½–2½, the first match a computer had won against a reigning champion at tournament pace.

    Its strength was brute computing power: 32 processors and 256 chips made for chess, evaluating 200 million positions a second. IBM itself said Deep Blue could not learn: Kasparov adapted as he played, while only its makers could adjust it, between games.

    Kasparov implied that human players had intervened in the second game and wanted a rematch, but IBM retired the machine to the Smithsonian.
  source: "IBM, “Deep Blue”, IBM History (32 processors; 200 million positions a second; retired to the Smithsonian); Nils J. Nilsson, The Quest for Artificial Intelligence, Cambridge University Press, 2010, ch. 32, quoting IBM's Deep Blue website (256 chess processors; not a learning system; Kasparov's implication about the second game)"
  sourceUrl: https://ibm.com/history/deep-blue
