- id: 2005-stanley
  era: learning
  year: 2005
  title: Stanley wins the desert race
  line: A robot car drives 132 miles of desert with no one aboard.
  who: Stanford Racing Team, led by Sebastian Thrun
  text: In 2004 no vehicle finished DARPA's Grand Challenge across the desert, and its $1 million prize went unclaimed. On 8 October 2005 five teams completed the 132-mile course. Stanford's Stanley, a modified Volkswagen Touareg, won in just under seven hours and took the $2 million prize.
  source: "DARPA, “The Grand Challenge”, Innovation Timeline; “Computerized Car Is Champ”, Stanford Magazine, November/December 2005"
  sourceUrl: https://www.darpa.mil/about/innovation-timeline/grand-challenge
