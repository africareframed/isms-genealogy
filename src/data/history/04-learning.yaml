- id: 2006-deep-belief-nets
  era: learning
  year: 2006
  month: 7
  title: Hinton trains deep networks
  line: Hinton's group shows how to train networks many layers deep.
  who: Geoffrey Hinton, Simon Osindero and Yee-Whye Teh
  text: |
    Networks with many layers of artificial neurons were hard to train, and the field had long faced scepticism and patchy funding. Geoffrey Hinton, at the University of Toronto, had been backed by CIFAR, a Canadian research institute, since 1987.

    His 2006 paper with Simon Osindero and Yee-Whye Teh trained a deep network quickly, one layer at a time, before slower fine-tuning. Its model of handwritten digits misread 1.25 per cent of test digits, slightly better than rivals not told how the pixels were arranged.

    Hinton was then leading CIFAR's Neural Computation and Adaptive Perception programme, whose members included Yann LeCun and Yoshua Bengio. The three later shared the 2018 Turing Award for their work on deep learning.
  source: "Geoffrey E. Hinton, Simon Osindero and Yee-Whye Teh, “A Fast Learning Algorithm for Deep Belief Nets”, Neural Computation 18 (7), 2006, pp. 1527–1554; CIFAR, “Our story”, cifar.ca; CIFAR, “Long-time CIFAR fellow Geoffrey Hinton awarded 2024 Nobel Prize in Physics”, 8 October 2024 (fellow since 1987; scepticism and an episodic dearth of funding; NCAP; the 2018 Turing Award)"
  sourceUrl: https://www.cs.utoronto.ca/~hinton/absps/ncfast.pdf
