- id: 2011-watson-jeopardy
  era: learning
  year: 2011
  month: 2
  title: Watson wins Jeopardy!
  line: IBM's question-answering machine beats two champions on television.
  who: IBM Research, led by David Ferrucci
  text: |
    Watson, IBM's question-answering system, was built to understand questions put in everyday language, not just keywords as search engines did. In February 2011, in two televised matches over three days, it beat Ken Jennings and Brad Rutter, the quiz show's two foremost champions.

    For each clue it ran hundreds of algorithms at once, buzzing in only when confident enough, all within about three seconds. It ran on 90 servers with 2,880 processor cores, filling a room, and was not connected to the internet.

    It won $77,147, against $24,000 for Jennings and $21,600 for Rutter, despite answering “Toronto” to a clue in the category US Cities. IBM went on to apply Watson's technology in business, from weather forecasts for retailers to finance.
  source: "IBM, “Watson, ‘Jeopardy!’ champion”, IBM History"
  sourceUrl: https://www.ibm.com/history/watson-jeopardy
