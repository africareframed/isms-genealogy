- id: 1998-lenet-mnist
  era: learning
  year: 1998
  title: LeNet and the MNIST digits
  line: A convolutional network learns to read handwriting, and millions of cheques.
  who: Yann LeCun, Léon Bottou, Yoshua Bengio and Patrick Haffner
  text: The paper argued that networks trained by backpropagation could classify handwritten characters with minimal preprocessing. Its convolutional network, LeNet-5, was tested on MNIST, a set of 60,000 training digits built from two US NIST collections. On that test, convolutional networks outperformed every other technique compared. A cheque-reading system built on these methods read several million cheques a day.
  source: "Yann LeCun, Léon Bottou, Yoshua Bengio and Patrick Haffner, “Gradient-Based Learning Applied to Document Recognition”, Proceedings of the IEEE 86 (11), November 1998"
  sourceUrl: https://gwern.net/doc/ai/nn/cnn/1998-lecun.pdf
