- id: 2012-google-cat
  era: learning
  year: 2012
  month: 6
  title: The Google Brain cat
  line: A network trained on YouTube frames learns to detect cats without labels.
  who: Quoc Le, Andrew Ng, Jeff Dean and colleagues, Google and Stanford
  text: The team trained a neural network with a billion connections on 10 million unlabelled images from the internet. Training ran for three days on 1,000 machines with 16,000 processor cores. Without being told what to look for, the network grew detectors for faces, human bodies and cat faces. On 20,000 ImageNet categories it reached 15.8 per cent accuracy, a 70 per cent relative gain on the previous best.
  source: "Quoc V. Le, Marc'Aurelio Ranzato, Rajat Monga and others, “Building High-level Features Using Large Scale Unsupervised Learning”, arXiv:1112.6209, 2011, presented at ICML 2012; Jeff Dean and Andrew Ng, “Using large-scale brain simulations for machine learning and A.I.”, Google blog, 26 June 2012"
  sourceUrl: https://arxiv.org/abs/1112.6209v1
  thread: compute
  isms: []
  themes: [compute]
  status: draft

- id: 2011-siri
  era: learning
  year: 2011
  month: 10
  title: Siri
  line: Apple puts a voice assistant on its new iPhone.
  who: Apple
  text: Apple announced the iPhone 4S on 4 October 2011 with Siri, “an intelligent assistant that helps you get things done just by asking”. Users could speak to make calls, send messages, schedule meetings and reminders, or look up facts. Siri launched as a beta, in English, French and German.
  source: "Apple, “Apple Launches iPhone 4S, iOS 5 & iCloud”, press release, 4 October 2011"
  sourceUrl: https://www.apple.com/newsroom/2011/10/04Apple-Launches-iPhone-4S-iOS-5-iCloud/
