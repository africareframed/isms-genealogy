- id: 2011-watson-jeopardy
  era: learning
  year: 2011
  month: 2
  title: Watson wins Jeopardy!
  line: IBM's question-answering machine beats two champions on television.
  who: IBM Research, led by David Ferrucci
  text: In a televised two-match contest over three days, Watson beat Ken Jennings and Brad Rutter, the show's two foremost champions. It answered questions put in natural language without being connected to the internet. The room-sized system used 90 servers with 2,880 processor cores. Watson won $77,147, against $24,000 for Jennings and $21,600 for Rutter.
  source: "IBM, “Watson, ‘Jeopardy!’ champion”, IBM History"
  sourceUrl: https://www.ibm.com/history/watson-jeopardy
