- id: 2011-siri
  era: learning
  year: 2011
  month: 10
  title: Apple launches Siri
  line: Apple puts a voice assistant on its new iPhone.
  who: Apple
  text: |
    Apple announced the iPhone 4S on 4 October 2011 with Siri, “an intelligent assistant that helps you get things done just by asking”. Users could speak to make calls, send messages, schedule meetings and reminders, or look up facts.

    Apple said Siri understood context, so people could speak naturally: asked whether an umbrella was needed that weekend, it knew to fetch the forecast. It could also use personal details people allowed it, such as names in their address book and their location.

    Siri launched as a beta, in English, French and German.
  source: "Apple, “Apple Launches iPhone 4S, iOS 5 & iCloud”, press release, 4 October 2011"
  sourceUrl: https://www.apple.com/newsroom/2011/10/04Apple-Launches-iPhone-4S-iOS-5-iCloud/
