- id: 1993-vinge-singularity
  era: learning
  year: 1993
  month: 3
  title: The coming technological singularity
  line: Vinge tells a NASA symposium that the human era may soon end.
  who: Vernor Vinge
  text: |
    Vernor Vinge, of San Diego State University's mathematics department, spoke at a symposium held by NASA's Lewis Research Center and the Ohio Aerospace Institute. He expected the means to create superhuman intelligence within thirty years, probably between 2005 and 2030.

    He named four routes, from intelligent computers and networks that wake up to close human–computer links and improved biology. He called the change a singularity: a point beyond which our models no longer hold. Shortly after, he argued, “the human era will be ended”.
  source: "Vernor Vinge, “The Coming Technological Singularity: How to Survive in the Post-Human Era”, VISION-21 Symposium, NASA Lewis Research Center and Ohio Aerospace Institute, 30–31 March 1993"
  sourceUrl: https://edoras.sdsu.edu/~vinge/misc/singularity.html
