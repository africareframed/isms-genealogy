- id: 2009-imagenet
  era: learning
  year: 2009
  title: ImageNet is built
  line: Princeton researchers build a vast library of labelled images.
  who: Jia Deng, Li Fei-Fei, Kai Li and colleagues, Princeton University
  text: |
    Programs that recognise objects learn from labelled pictures, and a Princeton team set out to supply them on a new scale. ImageNet sorted photographs into the categories of WordNet, a database of English words, from “mammal” down to “husky”. At its debut it held 3.2 million images in 5,247 categories, and aimed at around 50 million.

    Candidate pictures came from image search engines, queried in several languages. Workers on Amazon Mechanical Turk, an online platform for small paid tasks, then checked each image, with several voting independently.

    In 2010 ImageNet launched a yearly contest, with 1.2 million training images in 1,000 categories; a deep network won it in 2012.
  source: "Jia Deng, Wei Dong, Richard Socher, Li-Jia Li, Kai Li and Li Fei-Fei, “ImageNet: A Large-Scale Hierarchical Image Database”, IEEE Conference on Computer Vision and Pattern Recognition (CVPR), 2009; ImageNet, “Large Scale Visual Recognition Challenge 2010”, challenge page, image-net.org; ImageNet, “ILSVRC2012” results, image-net.org"
  sourceUrl: https://wordnet.cs.princeton.edu/papers/imagenet_cvpr09.pdf
