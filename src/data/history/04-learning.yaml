- id: 1997-lstm
  era: learning
  year: 1997
  month: 11
  title: Long short-term memory
  line: A recurrent network learns to remember across long sequences.
  who: Sepp Hochreiter and Jürgen Schmidhuber
  text: Recurrent networks trained by backpropagation struggled to link events far apart in time, because their error signals faded. Hochreiter and Schmidhuber added memory cells that keep the error flowing, with gates that control access to them. On artificial tasks their network bridged time lags of more than 1,000 steps.
  source: "Sepp Hochreiter and Jürgen Schmidhuber, “Long Short-Term Memory”, Neural Computation 9 (8), 1997, pp. 1735–1780"
  sourceUrl: https://mlanthology.org/neco/1997/hochreiter1997neco-long
  thread: symbols-networks
