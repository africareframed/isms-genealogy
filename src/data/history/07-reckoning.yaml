- id: 1854-laws-of-thought
  era: reckoning
  year: 1854
  title: The Laws of Thought
  line: Boole turns the rules of reasoning into an algebra of 0 and 1.
  who: George Boole
  text: |
    George Boole, a largely self-taught English mathematician and a professor in Cork, publishes An Investigation of the Laws of Thought. He applies the methods of symbolic algebra to logic, so that arguments of any complexity can be worked out by calculation. His symbols, he writes, take “the values 0 and 1, and of these values alone”.

    Boole also hoped his algebra would throw light on the inner workings of the mind. In a master's thesis at MIT, Claude Shannon later used Boolean algebra to lay the theoretical basis of digital circuits. Such circuits are fundamental to the working of modern computers.
  source: "George Boole, An Investigation of the Laws of Thought, Walton and Maberly, London, and Macmillan, Cambridge, 1854; Marcel Jackson and Stanley Burris, “George Boole”, Stanford Encyclopedia of Philosophy, revised 1 March 2026; Claude E. Shannon, A Symbolic Analysis of Relay and Switching Circuits, MS thesis, Massachusetts Institute of Technology, 1940 (DSpace@MIT); Encyclopaedia Britannica, “A Symbolic Analysis of Relay and Switching Circuits”"
  sourceUrl: https://plato.stanford.edu/entries/boole/
  thread: reasoning
  status: checked

- id: 1843-lovelace-notes
  era: reckoning
  year: 1843
  title: Lovelace's notes on the Analytical Engine
  line: Notes on Babbage's planned engine set out a program, and its limits.
  who: Ada Lovelace, Charles Babbage
  text: |
    Ada Lovelace, a mathematician and the daughter of the poet Lord Byron, translates Luigi Menabrea's article on Babbage's Analytical Engine. Babbage began the engine in 1834 as a general-purpose, programmable calculating machine, but never finished it. It would read punched cards, as the Jacquard loom did to weave its patterns, and she wrote that it “weaves algebraical patterns”.

    Her added notes show how it could be set to compute Bernoulli numbers, and she has been called the first computer programmer. She saw that it might act on more than numbers: given the rules of harmony, it might compose music. Yet she held that it could not originate anything, a view Turing answered in 1950 as “Lady Lovelace's Objection”.
  source: "Ada Lovelace, translation of and notes to L. F. Menabrea, “Notions sur la machine analytique de Charles Babbage” (1842), as “Sketch of the Analytical Engine invented by Charles Babbage”, Scientific Memoirs 3, 1843, 666–731, notes signed A. A. L. (Classics in the History of Psychology, York University); Encyclopaedia Britannica, “Ada Lovelace”; Computer History Museum, “The Engines”; Whipple Museum of the History of Science, University of Cambridge, “Charles Babbage's Difference Engine”; A. M. Turing, “Computing Machinery and Intelligence”, Mind 59, 1950, section 6"
  sourceUrl: https://www.britannica.com/biography/Ada-Lovelace
  thread: reasoning
  status: checked

- id: 1822-difference-engine
  era: reckoning
  year: 1822
  title: Babbage starts the Difference Engine
  line: Babbage wins government money for a machine to calculate mathematical tables.
  who: Charles Babbage, Joseph Clement
  text: |
    Tables of numbers guided ships at sea, but they were worked out by human “computers” and copied by hand, so errors crept in. The mathematician Charles Babbage designed a hand-cranked machine that reduced the work to mechanical addition. Meeting the astronomer John Herschel in 1821, he wished aloud that the calculations had been “executed by steam”.

    Government money came in 1822, but work stopped in 1832 after a dispute with his engineer, Joseph Clement. When funding was cut off in 1842, more than £17,000 had been spent, ten times what was first planned. London's Science Museum finished a working engine to his second design in 1991, and its printer in 2002.
  source: "Whipple Museum of the History of Science, University of Cambridge, “Charles Babbage's Difference Engine”; Computer History Museum, “The Engines” and “A Modern Sequel”; Science Museum Group, Babbage's Difference Engine No. 2, object 1992-556"
  sourceUrl: https://www.whipplemuseum.cam.ac.uk/explore-whipple-collections/calculating-devices/charles-babbages-difference-engine
  thread: reasoning
  status: checked

- id: 1770-the-turk
  era: reckoning
  year: 1770
  title: The chess-playing Turk
  line: An automaton plays chess across Europe, with a man hidden inside.
  who: Wolfgang von Kempelen
  text: |
    In 1770 Wolfgang von Kempelen, a Hungarian civil servant, presents a chess-playing automaton at the court of Empress Maria Theresa in Vienna. A wooden figure in oriental dress sat behind a cabinet, and Kempelen opened the cabinet's doors to show the clockwork inside. But a chess player concealed in the cabinet followed the game on a small board and worked the figure with levers.

    It toured Europe for decades, and Benjamin Franklin played it in Paris. Charles Babbage saw it in 1819 and knew it was a trick, but it set him thinking about a real chess machine. In 2005 Amazon named a platform for paid online tasks after it; its workers are often hired to label AI training data.
  source: "Encyclopaedia Britannica, “The Mechanical Turk: AI Marvel or Parlor Trick?”; Abigail Geiger, “What is Mechanical Turk?”, Pew Research Center, 11 July 2016; Oscar Schwartz, “Untold History of AI: How Amazon's Mechanical Turkers Got Squeezed Inside the Machine”, IEEE Spectrum, 22 April 2019"
  sourceUrl: https://www.britannica.com/story/the-mechanical-turk-ai-marvel-or-parlor-trick
  thread: games
  image: collage-moment-turk
  status: checked

- id: 1673-leibniz-calculator
  era: reckoning
  year: 1673
  month: 2
  title: Leibniz shows his calculator
  line: Leibniz shows the Royal Society a calculator that can also multiply and divide.
  who: Gottfried Wilhelm Leibniz
  text: |
    On 1 February 1673 Gottfried Wilhelm Leibniz, a German philosopher and mathematician, showed the Royal Society in London a model of his calculating machine. Its stepped drums, turned by a crank, could add, subtract, multiply and divide. It multiplied by repeated addition and divided by repeated subtraction.

    He held that outstanding people should not waste their time on menial calculation. As early as 1666 he had aimed to reduce all reasoning to combinations of basic elements. He hoped for an alphabet of thought: symbols for ideas, with a calculus of logic, that could help end disputes.
  source: "Landeshauptstadt Hannover, “The baroque ancestor of the calculator”, hannover.de, on the machine in the Gottfried Wilhelm Leibniz Library; J. J. O'Connor and E. F. Robertson, “Gottfried Wilhelm von Leibniz”, MacTutor History of Mathematics, University of St Andrews, 1998; Ivo Thomas, “Precursors of Modern Logic: Leibniz”, Encyclopedia of Philosophy, 1967 (Encyclopedia.com)"
  sourceUrl: https://www.hannover.de/en/view/content/542574/full/0/602624
  thread: reasoning
  status: checked

- id: 1651-leviathan
  era: reckoning
  year: 1651
  title: Reason is reckoning
  line: Hobbes writes that reasoning is nothing but adding and subtracting.
  who: Thomas Hobbes
  text: |
    Thomas Hobbes, an English philosopher, wrote Leviathan, his book on the state, in Paris, where he lived in exile from 1640 to 1651. In it he defines reason as “nothing but Reckoning”, the adding and subtracting of the consequences of general names. In De Corpore (1655) he puts it more plainly still, saying that by reasoning he understands computation.

    Even an argument is a sum, on this view: a proposition adds two names, and a syllogism three. In 1985 the philosopher John Haugeland cast Hobbes as a prophet of artificial intelligence. The Stanford Encyclopedia of Philosophy finds that claim rather over-dramatic, since the link amounts to little more than reasoning as addition and subtraction.
  source: "Thomas Hobbes, Leviathan, printed for Andrew Crooke, London, 1651, ch. 5 (Project Gutenberg); Stewart Duncan, “Thomas Hobbes”, Stanford Encyclopedia of Philosophy, revised 1 March 2025, citing Hobbes, De Corpore, 1655, ch. 1 and 4.6, and John Haugeland, Artificial Intelligence: The Very Idea, MIT Press, 1985, p. 23"
  sourceUrl: https://plato.stanford.edu/entries/hobbes/
  thread: reasoning
  status: checked

- id: 1642-pascaline
  era: reckoning
  year: 1642
  title: Pascal builds a calculator
  line: Pascal builds an adding machine to help his father, a tax collector.
  who: Blaise Pascal
  text: |
    In 1642 Blaise Pascal, a young French mathematician, began building a calculating machine to help his father, a tax collector in Rouen. Numbers were entered by turning its wheels, and each digit of the result showed in its own window. It could only add and subtract.

    It worked in France's money, with 20 sols to the livre and 12 deniers to the sol, which made the design harder. By 1652 he had made 50, but few were sold. Wilhelm Schickard, a German astronomer and mathematician, had built one by 1624, which almost certainly makes Pascal the second inventor of a mechanical calculator.
  source: "Encyclopaedia Britannica, “Pascaline”; J. J. O'Connor and E. F. Robertson, “Blaise Pascal”, MacTutor History of Mathematics, University of St Andrews, December 1996; Encyclopaedia Britannica, “Wilhelm Schickard”"
  sourceUrl: https://www.britannica.com/technology/Pascaline
  thread: reasoning
  status: checked
