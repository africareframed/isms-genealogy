- id: 1942-three-laws-of-robotics
  era: reckoning
  year: 1942
  month: 3
  title: Asimov's Three Laws of Robotics
  line: A science-fiction writer sets out rules to stop robots harming people.
  who: Isaac Asimov, with his editor John W. Campbell
  text: |
    In the story “Runaround”, in the magazine Astounding Science Fiction, the writer Isaac Asimov formally states three laws built into his fictional robots. A robot may not injure a human being or, through inaction, let one come to harm. It must obey human orders unless they conflict with that First Law, and protect itself unless that conflicts with either.

    Asimov credited his editor, John W. Campbell, with formulating the laws in a conversation in December 1940. Many of his plots turn on clashes between the laws; in “Runaround” a robot with a strengthened Third Law is caught between competing demands. Britannica notes that the laws later found a place in discussions of robotics and AI.
  source: "Isaac Asimov, “Runaround”, Astounding Science Fiction, March 1942; “Laws of Robotics”, The Encyclopedia of Science Fiction, ed. John Clute and David Langford; Encyclopaedia Britannica, “Three Laws of Robotics”"
  sourceUrl: https://sf-encyclopedia.com/entry/laws_of_robotics
