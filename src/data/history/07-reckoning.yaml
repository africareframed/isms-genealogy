- id: 1941-zuse-z3
  era: reckoning
  year: 1941
  month: 5
  title: Zuse shows the Z3
  line: A Berlin engineer shows a programmable computer built from about 2,000 relays.
  who: Konrad Zuse
  text: |
    Konrad Zuse, who had worked as a structural engineer for an aircraft maker, had pursued the idea of a “mechanical brain” since about 1936. On 12 May 1941 he presented his Z3 to a small group of experts in his Berlin flat. It was built from about 2,000 relays, electrical switches that are either on or off, and worked in binary.

    Germany's patent office calls it the world's first functional, freely programmable computer. In 1998 it was shown to be, in principle, a universal machine of the kind Turing had described in 1936. The machine was destroyed in a bombing raid in 1944; a replica stands in the Deutsches Museum.
  source: "Deutsches Patent- und Markenamt (German Patent and Trademark Office), “Konrad Zuse: Making history in the living room”, dpma.de, 8 December 2025"
  sourceUrl: https://www.dpma.de/en/explore/milestones/computer-pioneers/konrad-zuse
  thread: compute
  status: checked

- id: 1940-bletchley-bombe
  era: reckoning
  year: 1940
  month: 3
  title: The bombe starts breaking Enigma
  line: Turing's codebreaking machine starts searching for each day's Enigma settings.
  who: Alan Turing, Gordon Welchman
  text: |
    Enigma was a cipher machine that German forces used to encrypt their radio messages, with settings that changed every day. Three Polish mathematicians had broken it before the war, and from 1938 they used a machine, the bomba. At Bletchley Park, Britain's wartime codebreaking centre, Alan Turing designed a new machine, the bombe, to find each day's settings.

    It worked from cribs, words expected in a message, and from the fact that Enigma never enciphered a letter as itself. Gordon Welchman's diagonal board cut the number of false leads. The first bombe, Victory, began work on 14 March 1940; about 211 were built, and they gave the Allies a stream of intelligence.
  source: "The National Museum of Computing, Bletchley Park, page on the Bombe and its rebuild, tnmoc.org; Encyclopaedia Britannica, “Alan Turing”"
  sourceUrl: https://tnmoc.org/bombe
  thread: compute
  status: checked

- id: 1936-on-computable-numbers
  era: reckoning
  year: 1936
  title: On Computable Numbers
  line: Turing describes an imaginary machine, and the limits of what machines can compute.
  who: Alan Turing
  text: |
    Alan Turing, a 23-year-old fellow of King's College, Cambridge, analyses what a person does when calculating by fixed rules. He reduces it to a machine that reads and writes symbols on a tape, one square at a time, following a table of rules. With it he answers the Entscheidungsproblem, a central question of logic: no general mechanical method can decide which statements of logic can be proved.

    He also shows there could be “a single machine which can be used to compute any computable sequence”. This universal machine, able to imitate any other, captures the basic logical principles of the digital computer. Alonzo Church reached the same result on logic independently, and in 1937 named the devices Turing machines.
  source: "A. M. Turing, “On Computable Numbers, with an Application to the Entscheidungsproblem”, Proceedings of the London Mathematical Society, s2-42, 1936–37 (received 28 May 1936), section 6; Liesbeth De Mol, “Turing Machines”, Stanford Encyclopedia of Philosophy, revised 21 May 2025; Encyclopaedia Britannica, “Alan Turing”"
  sourceUrl: https://plato.stanford.edu/entries/turing-machine/
  thread: reasoning
  status: checked

- id: 1920-rur
  era: reckoning
  year: 1920
  month: 11
  title: R.U.R. gives the world “robot”
  line: A Czech play calls its artificial workers robots, and they rise up.
  who: Karel Čapek, Josef Čapek
  text: |
    Karel Čapek, a 30-year-old Czech writer, publishes his play R.U.R. (Rossum's Universal Robots) in Prague in November 1920. It is first staged in January 1921. Its robots are artificial workers made by chemistry, not machines, and in the end they overthrow their makers.

    Karel's brother Josef, a painter, suggested the name, from a Slavic root for labour with overtones of serfdom. Within three years the play reached New York and London, and it was soon translated into more than 30 languages. In the MIT Press Reader, John M. Jordan traces its robots, both slaves and rebels, through later fiction, from HAL 9000 to the Terminator.
  source: "Karel Čapek, R.U.R. (Rossum's Universal Robots), Aventinum, Prague, 1920; Embassy of the Czech Republic in Tirana, “100 Year Ago ‘Robot’ Was Born”, mzv.gov.cz, 29 May 2021; John M. Jordan, “The Czech Play That Gave Us the Word ‘Robot’”, The MIT Press Reader, 29 July 2019"
  sourceUrl: https://mzv.gov.cz/tirana/en/about_the_czech_republic/x100_year_ago_robot_was_born.html
  thread: made-beings
  status: checked

- id: 1914-el-ajedrecista
  era: reckoning
  year: 1914
  title: El Ajedrecista plays chess
  line: A Spanish engineer's machine plays a chess endgame, with nobody hidden inside.
  who: Leonardo Torres Quevedo
  text: |
    Leonardo Torres Quevedo, a Spanish engineer whose inventions ranged from cable cars to an early remote control, built his chess player in 1912. He showed it in public at the University of Paris in 1914. Playing a king and rook against a human's lone king, it chose and made its own moves, and it was certain to win.

    Unlike the Turk's owners, he was no showman: he built it to demonstrate his ideas about machines that “think”. In a 1914 essay on automatics he proposed calculating machines built from electrical switches, and machines that sense and adjust to their surroundings. Nick Montfort, in a 2005 history of interactive fiction, called it the first computer game.
  source: "Allison Marsh, “This 1920 Chess Automaton Was Wired to Win”, IEEE Spectrum, 29 June 2023, citing Nick Montfort, Twisty Little Passages, MIT Press, 2005"
  sourceUrl: https://spectrum.ieee.org/this-1920-chess-automaton-was-wired-to-win
  thread: games
  status: checked

- id: 1863-darwin-among-the-machines
  era: reckoning
  year: 1863
  month: 6
  title: Darwin among the Machines
  line: A letter warns that machines are evolving and may one day replace us.
  who: Samuel Butler
  text: |
    Samuel Butler, a young Englishman then raising sheep in New Zealand, writes to The Press in Christchurch under the name Cellarius. He applies Darwin's theory of evolution, published four years earlier, to machines. Machines evolve too, he argues, and one day humans may be to them what horses and dogs are to us.

    His remedy is war to the death against them, declared at once. He reworked the idea as the Book of the Machines in Erewhon (1872), a novel whose people have banned machines. A 2012 timeline of early arguments about AI risk, by Luke Muehlhauser, opens with this letter.
  source: "Cellarius [Samuel Butler], “Darwin among the Machines”, The Press, Christchurch, 13 June 1863; reprinted in Samuel Butler, Canterbury Pieces, ed. R. A. Streatfeild, A. C. Fifield, London, 1914; James A. Lynch, “Butler, Samuel”, Encyclopedia of Science, Technology, and Ethics (Encyclopedia.com); Luke Muehlhauser, “AI Risk & Opportunity: A Timeline of Early Ideas and Arguments”, LessWrong, 2012, which opens with the letter"
  sourceUrl: https://gutenberg.org/files/3279/3279-h/3279-h.htm
  isms: [rationalism]
  themes: [luddite]
  thread: warnings
