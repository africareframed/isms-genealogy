- id: 2020-alphafold-2
  era: scale
  year: 2020
  month: 11
  title: AlphaFold predicts protein shapes
  line: DeepMind's AlphaFold predicts protein shapes with accuracy rivalling laboratory methods.
  who: DeepMind
  text: |
    Proteins carry out almost every function of life, and what each one does depends largely on its 3D shape. Finding a shape in the laboratory can take years, so only about 170,000 were known, against more than 180 million protein sequences. Predicting the shape from the chain of amino acids had challenged biologists for about 50 years.

    CASP, a contest held every two years since 1994, asks teams to predict shapes just found in laboratories but not yet published. At CASP14 DeepMind's AlphaFold reached a median score of 92.4 out of 100 on its main measure, GDT. A score around 90 is informally considered competitive with experimental methods.
  source: "DeepMind, “AlphaFold: a solution to a 50-year-old grand challenge in biology”, 30 November 2020"
  sourceUrl: https://deepmind.google/blog/alphafold-a-solution-to-a-50-year-old-grand-challenge-in-biology/
