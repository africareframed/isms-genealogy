- id: 2020-gpt-3
  era: scale
  year: 2020
  month: 5
  title: GPT-3 learns from a few examples
  line: A model ten times bigger learns new tasks from a few examples.
  who: Tom B. Brown, Benjamin Mann, Nick Ryder and colleagues, OpenAI
  text: |
    OpenAI researchers described GPT-3, a language model with 175 billion parameters, the adjustable numbers a network learns. That was about ten times more than any earlier model of its kind. Like GPT-2, it learned by predicting the next word in a text.

    Shown a few examples in plain text, it could take on new tasks without further training, such as translating or unscrambling words. Human judges found it hard to tell its news articles from ones written by people. From June 2020 OpenAI offered access through an online service, its API, rather than releasing the model, saying this made misuse easier to curb.
  source: "Tom B. Brown, Benjamin Mann, Nick Ryder and others, “Language Models are Few-Shot Learners”, arXiv:2005.14165, 28 May 2020; OpenAI, “OpenAI API”, 11 June 2020"
  sourceUrl: https://arxiv.org/abs/2005.14165v1
  isms: []
  themes: [scaling-laws]
  thread: talking
  status: checked

- id: 2020-scaling-laws
  era: scale
  year: 2020
  month: 1
  title: OpenAI charts the scaling laws
  line: OpenAI researchers find that language models improve along smooth, predictable curves.
  who: Jared Kaplan (Johns Hopkins University and OpenAI), Sam McCandlish and colleagues at OpenAI
  text: |
    Jared Kaplan, Sam McCandlish and colleagues measured how language models improve as they grow. They tracked the models' prediction error: how far off they were in guessing the next word of a text. It fell along smooth power laws in model size, data and training compute: each tenfold increase cut it by a similar share.

    Some trends held across more than seven orders of magnitude, a ten-million-fold range, and the network's shape mattered far less than its size. The curves showed how best to spend a fixed computing budget: on very large models trained on modest data. DeepMind's Chinchilla study revised that advice in 2022.
  source: "Jared Kaplan, Sam McCandlish and others, “Scaling Laws for Neural Language Models”, arXiv:2001.08361, 23 January 2020; Jordan Hoffmann, Sebastian Borgeaud, Arthur Mensch and others, “Training Compute-Optimal Large Language Models”, arXiv:2203.15556, 29 March 2022"
  sourceUrl: https://arxiv.org/abs/2001.08361v1
  isms: []
  themes: [scaling-laws, compute]
  thread: compute
  status: checked

- id: 2019-openai-capped-profit
  era: scale
  year: 2019
  month: 3
  title: OpenAI creates a capped-profit arm
  line: The non-profit lab takes in investors to pay for computing power.
  who: OpenAI; Microsoft
  text: |
    In March 2019 OpenAI, founded as a non-profit, created a “capped-profit” company to raise money. It said it needed billions of dollars for cloud computing, talent and AI supercomputers. Investors' returns were capped, at first at 100 times their stake, and anything above that went to the non-profit.

    The non-profit's board kept control, and the company's main legal duty was to the aims of OpenAI's charter. In July Microsoft invested $1 billion and became OpenAI's exclusive cloud provider. It also became the preferred partner for selling some of OpenAI's technologies.
  source: OpenAI, “OpenAI LP”, 11 March 2019; OpenAI, “Microsoft invests in and partners with OpenAI”, 22 July 2019
  sourceUrl: https://openai.com/index/openai-lp/
