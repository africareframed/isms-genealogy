- id: 2018-bert
  era: scale
  year: 2018
  month: 10
  title: Google releases BERT
  line: A Google model learns language by reading each word's context on both sides.
  who: Jacob Devlin, Ming-Wei Chang, Kenton Lee and Kristina Toutanova, Google
  text: |
    Google researchers released BERT, short for Bidirectional Encoder Representations from Transformers. Earlier language models mostly read text one way, left to right. BERT learned by hiding 15% of the words in books and Wikipedia, then guessing each from the words on both sides.

    Adapted to each task with one extra layer, it set new best results on eleven language tasks, and Google shared it freely. From October 2019 it helped Google Search understand about one in ten English searches in the United States. It could tell, for example, that “2019 brazil traveler to usa need a visa” was about a Brazilian going to the US.
  source: "Jacob Devlin, Ming-Wei Chang, Kenton Lee and Kristina Toutanova, “BERT: Pre-training of Deep Bidirectional Transformers for Language Understanding”, arXiv:1810.04805, 11 October 2018; Pandu Nayak, “Understanding searches better than ever before”, Google, 25 October 2019"
  sourceUrl: https://arxiv.org/abs/1810.04805v1
  isms: []
  themes: []
  thread: symbols-networks
