- id: 2022-chinchilla
  era: scale
  year: 2022
  month: 3
  title: Chinchilla shows models need more data
  line: DeepMind finds that large models need far more data for their size.
  who: Jordan Hoffmann, Sebastian Borgeaud, Arthur Mensch and colleagues, DeepMind
  text: |
    A DeepMind team found that large language models had been trained on too little data for their size. The cause, they wrote, was a focus on making models bigger while keeping their training data the same. For a fixed computing budget, model size and training data should grow in equal proportion: double one, double the other.

    Their model Chinchilla had 70 billion parameters, the adjustable numbers inside a network, a quarter as many as DeepMind's Gopher. Trained with the same amount of computing on about four times the data, it outperformed Gopher and GPT-3 across a wide range of tasks. Being smaller, it also needed much less computing to adapt and run.
  source: Jordan Hoffmann, Sebastian Borgeaud, Arthur Mensch and others, “Training Compute-Optimal Large Language Models”, arXiv:2203.15556, 29 March 2022
  sourceUrl: https://arxiv.org/abs/2203.15556v1
  isms: []
  themes: [scaling-laws, compute]
  thread: compute
  status: checked

- id: 2021-anthropic-founded
  era: scale
  year: 2021
  month: 5
  title: Anthropic is founded
  line: A former OpenAI research chief starts a company focused on AI safety.
  who: Dario Amodei, Daniela Amodei
  text: |
    Dario Amodei, formerly OpenAI's vice-president of research, founded Anthropic with his sister Daniela. Its team had earlier worked on GPT-3, on scaling laws and on AI safety research. They called it an AI safety and research company.

    It was set up as a public benefit corporation, whose directors may balance shareholders' financial interests with a public purpose. In May 2021 it raised $124 million, led by Jaan Tallinn, a co-founder of Skype, with Dustin Moskovitz and Eric Schmidt among the backers. It aimed to make large AI systems more reliable, steerable, interpretable and robust.
  source: "Anthropic, “Anthropic raises $124 million to build more reliable, general AI systems”, 28 May 2021; Devin Coldewey, “Anthropic is the new AI research outfit from OpenAI's Dario Amodei, and it has $124M to burn”, TechCrunch, 28 May 2021; Anthropic, “The Long-Term Benefit Trust”, 19 September 2023"
  sourceUrl: https://anthropic.com/news/anthropic-raises-124-million-to-build-more-reliable-general-ai-systems
