- id: 2020-gebru-google
  era: scale
  year: 2020
  month: 12
  title: Timnit Gebru leaves Google
  line: A dispute over a paper on large language models ends with an ethics team co-lead out of Google.
  who: Timnit Gebru; Google
  text: |
    Timnit Gebru, co-lead of Google's Ethical AI team, wrote “On the Dangers of Stochastic Parrots” with the linguist Emily M. Bender and others. It warned that ever larger language models use much energy, absorb abusive language from the web and can fool people with fluent text.

    Gebru says Google told her to retract it or remove its Google authors' names. On 2 December 2020 she announced that Google had forced her out; Google said she resigned.

    More than 1,400 Google staff signed an open letter calling her exit “unprecedented research censorship”. Her co-lead Margaret Mitchell was fired in February 2021, and the paper appeared that March.
  source: "Karen Hao, “We read the paper that forced Timnit Gebru out of Google. Here's what it says.”, MIT Technology Review, 4 December 2020; Bobby Allyn, “Google Employees Call Black Scientist's Ouster ‘Unprecedented Research Censorship’”, NPR, 3 December 2020; Megan Rose Dickey, “Google fires top AI ethics researcher Margaret Mitchell”, TechCrunch, 19 February 2021; Emily M. Bender and others, “On the Dangers of Stochastic Parrots”, FAccT '21, ACM, March 2021"
  sourceUrl: https://www.technologyreview.com/2020/12/04/1013294/google-ai-ethics-research-paper-forced-out-timnit-gebru/
  isms: [ai-ethics, ai-skepticism]
  themes: [scaling-laws]
