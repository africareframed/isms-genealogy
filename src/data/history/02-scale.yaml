- id: 2022-stable-diffusion
  era: scale
  year: 2022
  month: 8
  title: Stable Diffusion goes public
  line: An image generator's weights are released for anyone to download and run.
  who: Stability AI
  text: |
    On 22 August 2022 Stability AI released Stable Diffusion, which turns a line of text into an image in seconds. It built on latent diffusion, from researchers at LMU Munich and Runway: the network forms a picture by removing noise in many small steps.

    Its weights, the numbers the trained network runs on, were free to download; it needed a graphics card with about 7 GB of memory. The licence, CreativeML OpenRAIL-M, allowed commercial use but made users responsible for using it ethically and lawfully.

    It had learned from part of LAION-5B, an open collection of 5.85 billion images paired with text. In January 2023 Getty Images sued Stability AI in London, saying it had copied millions of copyrighted images without a licence.
  source: "Stability AI, “Stable Diffusion Public Release”, stability.ai, 22 August 2022; Stability AI, “Stable Diffusion Launch Announcement”, stability.ai, 10 August 2022; Open Future, “Stable Diffusion text to image generator released under an open license”, 22 August 2022; Robin Rombach, Andreas Blattmann, Dominik Lorenz, Patrick Esser and Björn Ommer, “High-Resolution Image Synthesis with Latent Diffusion Models”, arXiv:2112.10752, 20 December 2021; Christoph Schuhmann, Romain Beaumont, Richard Vencu and others, “LAION-5B: An open large-scale dataset for training next generation image-text models”, arXiv:2210.08402, 16 October 2022; Andrew Tarantola, “Getty Images sues the maker of AI art generator Stable Diffusion over data scraping allegations”, Engadget, 17 January 2023"
  sourceUrl: https://stability.ai/blog/stable-diffusion-public-release
  isms: []
