- id: 2018-gender-shades
  era: scale
  year: 2018
  month: 2
  title: Gender Shades tests face analysis
  line: Face analysis from big firms misreads darker-skinned women far more often than lighter-skinned men.
  who: Joy Buolamwini; Timnit Gebru
  text: |
    Joy Buolamwini of the MIT Media Lab and Timnit Gebru, then at Microsoft Research, tested how well commercial software guessed gender from faces. The systems came from Microsoft, IBM and Face++. Two widely used sets of test faces were overwhelmingly lighter-skinned, so they built one of 1,270 parliamentarians from three African and three European countries.

    Darker-skinned women were misclassified up to 34.7% of the time, lighter-skinned men at most 0.8%. The authors noted that such technology was already used in high-stakes fields such as health care and law enforcement. The study appeared at the first Conference on Fairness, Accountability and Transparency, in New York.
  source: "Joy Buolamwini and Timnit Gebru, “Gender Shades: Intersectional Accuracy Disparities in Commercial Gender Classification”, PMLR 81, 2018, pp. 77–91; FAT* 2018, facctconference.org/2018 (23–24 February 2018, New York University)"
  sourceUrl: https://proceedings.mlr.press/v81/buolamwini18a.html
  isms: [ai-ethics]
  themes: [facial-recognition]
  thread: warnings
  status: checked

- id: 2017-transformer
  era: scale
  year: 2017
  month: 6
  title: Attention Is All You Need
  line: Google researchers propose the Transformer, the design behind today's language models.
  who: Ashish Vaswani, Noam Shazeer, Niki Parmar, Jakob Uszkoreit, Llion Jones, Aidan Gomez, Łukasz Kaiser, Illia Polosukhin
  text: |
    Eight researchers, most of them at Google Brain and Google Research, proposed a new kind of network for language, the Transformer. The leading translation networks mostly read a sentence word by word, in order, which made them slow to train. The Transformer relied only on attention: each word weighs every other word in the passage, near or far, to settle its meaning.

    Because it took in a whole passage at once, its training could run many calculations in parallel. It translated better than earlier systems and trained far faster, in 3.5 days on eight graphics processors for its best English–French model. BERT and GPT-4 were both built on it.
  source: Ashish Vaswani, Noam Shazeer, Niki Parmar and others, “Attention Is All You Need”, arXiv:1706.03762, 12 June 2017
  sourceUrl: https://arxiv.org/abs/1706.03762v1
  isms: []
