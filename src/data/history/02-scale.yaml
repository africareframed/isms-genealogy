- id: 2019-gpt-2
  era: scale
  year: 2019
  month: 2
  title: OpenAI holds back GPT-2
  line: OpenAI holds back a language model, citing fears of misuse.
  who: OpenAI
  text: |
    OpenAI described GPT-2, a language model: a program trained simply to predict the next word in a text. It had 1.5 billion parameters, the adjustable numbers inside a network, and learned from 8 million web pages. Citing fears that it could write misleading news articles, impersonate people or churn out spam, OpenAI withheld the full model.

    It released a much smaller one, then larger versions in stages, leaving time to study risks and benefits. Some researchers called this a sensible precaution; others called it a publicity stunt. In November 2019 OpenAI released the full model, saying it had seen no strong evidence of misuse.
  source: "OpenAI, “Better language models and their implications”, 14 February 2019, updated May 2019; Irene Solaiman, Miles Brundage, Jack Clark and others, “Release Strategies and the Social Impacts of Language Models”, arXiv:1908.09203, 2019; Karen Hao, “OpenAI has released the largest version yet of its fake-news-spewing AI”, MIT Technology Review, 29 August 2019; OpenAI, “GPT-2: 1.5B release”, 5 November 2019"
  sourceUrl: https://openai.com/index/better-language-models/
  isms: []
  themes: []
