- id: 2016-machine-bias
  era: deep-learning
  year: 2016
  month: 5
  title: ProPublica tests a risk score
  line: ProPublica finds a risk score wrongly flags Black defendants almost twice as often as white ones.
  who: ProPublica; Julia Angwin
  text: |
    ProPublica examined COMPAS, software that US courts used to rate defendants' risk of reoffending, from bail to sentencing. It gathered the scores of more than 7,000 people arrested in Broward County, Florida, and tracked who was charged again within two years.

    Black defendants who did not reoffend were almost twice as likely as white ones to have been labelled higher risk. A Black teenager who had taken a child's bike was rated high risk; a white man convicted of armed robbery, low.

    Northpointe, its maker, disputed the analysis. Computer scientists showed that, except in special cases, a score cannot both mean the same risk for each group and spread its errors equally.
  source: "Julia Angwin, Jeff Larson, Surya Mattu and Lauren Kirchner, “Machine Bias”, ProPublica, 23 May 2016; Jon Kleinberg, Sendhil Mullainathan and Manish Raghavan, “Inherent Trade-Offs in the Fair Determination of Risk Scores”, arXiv:1609.05807, 19 September 2016"
  sourceUrl: https://www.propublica.org/article/machine-bias-risk-assessments-in-criminal-sentencing
  isms: [ai-ethics]
  themes: []
  thread: warnings
  status: checked

- id: 2016-alphago
  era: deep-learning
  year: 2016
  month: 3
  title: AlphaGo beats Lee Sedol
  line: A program defeats one of the world's best Go players, four games to one.
  who: DeepMind; Lee Sedol
  text: |
    Go, an ancient Chinese board game, has about 10 to the power of 170 possible positions, more than the atoms in the known universe. DeepMind's AlphaGo combined deep neural networks, trained on thousands of expert games and on games against itself, with a search for promising moves. In Seoul, from 9 to 15 March 2016, it beat Lee Sedol, a top-ranked professional with 18 world titles, by four games to one.

    In the second game AlphaGo played move 37, which a human had a one-in-10,000 chance of choosing; players have studied it ever since. Lee won the fourth game with move 78, just as unlikely. Over 200 million people watched; DeepMind says experts had thought such a win a decade away.
  source: "Demis Hassabis, “What we learned in Seoul with AlphaGo”, Google, 16 March 2016; Google DeepMind, “AlphaGo”, project page, deepmind.google; British Go Association, “Google DeepMind Challenge Match – Lee Sedol v AlphaGo – match report”"
  sourceUrl: https://blog.google/technology/ai/what-we-learned-in-seoul-with-alphago/
