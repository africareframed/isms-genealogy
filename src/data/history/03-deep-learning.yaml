- id: 2014-superintelligence
  era: deep-learning
  year: 2014
  month: 7
  title: Bostrom's Superintelligence
  line: A philosopher argues that a machine smarter than us could decide our fate.
  who: Nick Bostrom
  text: "The Oxford philosopher Nick Bostrom argued that machines may one day surpass humans in general intelligence. Such a superintelligence could become very powerful, and humanity's fate could depend on it, as the fate of gorillas now depends on us. Humanity has one advantage, he wrote: it gets to make the first move. The book asks how to use it to make an intelligence explosion survivable."
  source: "Nick Bostrom, Superintelligence: Paths, Dangers, Strategies, Oxford University Press, 3 July 2014; Oxford Martin School, University of Oxford, publication page"
  sourceUrl: https://www.oxfordmartin.ox.ac.uk/publications/superintelligence-paths-dangers-strategies
  isms: [rationalism]
  themes: [alignment]
