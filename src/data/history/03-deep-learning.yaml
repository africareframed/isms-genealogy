- id: 2012-imagenet
  era: deep-learning
  year: 2012
  month: 10
  title: A deep network wins ImageNet
  line: A neural network wins an image-recognition contest by a wide margin, and Google hires its makers.
  who: Alex Krizhevsky, Ilya Sutskever and Geoffrey Hinton, University of Toronto; Google
  text: |
    ImageNet's yearly contest asked programs to name the objects in photographs, choosing from 1,000 categories after training on 1.2 million labelled images. In 2012 a University of Toronto team, Alex Krizhevsky, Ilya Sutskever and Geoffrey Hinton, entered a deep neural network. “Deep” means many layers of artificial neurons, each working on the output of the one below.

    In October's results it missed the right label in its top five guesses for 15.3% of test images, against 26.2% for the runner-up. The network had 60 million parameters and took five to six days to train on two GTX 580 graphics cards.

    Hinton and the two students formed a start-up, DNNresearch, and in March 2013 Google bought it, for a sum later reported as $44 million. It wanted their work on deep neural networks for image and voice search. Krizhevsky and Sutskever moved to Google, while Hinton split his time between Google and the University of Toronto.
  source: "Alex Krizhevsky, Ilya Sutskever and Geoffrey E. Hinton, “ImageNet Classification with Deep Convolutional Neural Networks”, Advances in Neural Information Processing Systems 25 (NIPS 2012); ImageNet, “ImageNet Large Scale Visual Recognition Competition 2012 (ILSVRC2012)”, results, and challenge page (workshop at ECCV 2012, Florence, 12 October 2012; full results released 13 October 2012); University of Toronto News, “Google acquires U of T neural networks company”, 12 March 2013; Rip Empson, “Google Scoops Up Neural Networks Startup DNNresearch To Boost Its Voice And Image Search Tech”, TechCrunch, 12 March 2013; Heidi Hackford, “Idealists, Big Tech, and AI”, Computer History Museum, 13 April 2021"
  sourceUrl: https://www.image-net.org/challenges/LSVRC/2012/results
  isms: []
