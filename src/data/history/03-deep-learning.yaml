- id: 2014-google-deepmind
  era: deep-learning
  year: 2014
  month: 1
  title: Google buys DeepMind
  line: Google buys the London AI start-up, reportedly for more than $500 million.
  who: Google; Demis Hassabis, Shane Legg, Mustafa Suleyman
  text: Google bought DeepMind, a London company founded by Demis Hassabis, Shane Legg and Mustafa Suleyman. The Information reported a price of more than $500 million. Google reportedly agreed to set up an ethics board, so that DeepMind's technology would not be abused. Facebook had reportedly held talks to buy it in late 2013.
  source: Catherine Shu, “Google Acquires Artificial Intelligence Startup DeepMind For More Than $500M”, TechCrunch, 26 January 2014
