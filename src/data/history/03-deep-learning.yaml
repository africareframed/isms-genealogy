- id: 2012-imagenet
  era: deep-learning
  year: 2012
  month: 10
  title: A deep network wins ImageNet
  line: A neural network wins an image-recognition contest by a wide margin.
  who: Alex Krizhevsky, Ilya Sutskever and Geoffrey Hinton, University of Toronto
  text: A University of Toronto team, Alex Krizhevsky, Ilya Sutskever and Geoffrey Hinton, won the 2012 ImageNet image-recognition challenge, whose results came out in October. Its deep convolutional network missed the right label in its top five guesses for 15.3% of test images, against 26.2% for the runner-up. The network had 60 million parameters and took five to six days to train on two GTX 580 graphics cards.
  source: Alex Krizhevsky, Ilya Sutskever and Geoffrey E. Hinton, “ImageNet Classification with Deep Convolutional Neural Networks”, Advances in Neural Information Processing Systems 25 (NIPS 2012); ImageNet, “ImageNet Large Scale Visual Recognition Competition 2012 (ILSVRC2012)”, results, and challenge page (workshop at ECCV 2012, Florence, 12 October 2012; full results released 13 October 2012)
  sourceUrl: https://www.image-net.org/challenges/LSVRC/2012/results
  isms: []
  themes: [compute]
  thread: symbols-networks
  status: checked

- id: 2012-google-cat
  era: deep-learning
  year: 2012
  month: 6
  title: The Google Brain cat
  line: A network trained on YouTube frames learns to detect cats without labels.
  who: Quoc Le, Andrew Ng, Jeff Dean and colleagues, Google and Stanford
  text: The team trained a neural network with a billion connections on 10 million unlabelled images, frames taken from YouTube videos. Training ran for three days on 1,000 machines with 16,000 processor cores. Without being told what to look for, the network grew detectors for faces, human bodies and cat faces. On 20,000 ImageNet categories it reached 15.8 per cent accuracy, a 70 per cent relative gain on the previous best.
  source: "Quoc V. Le, Marc'Aurelio Ranzato, Rajat Monga and others, “Building High-level Features Using Large Scale Unsupervised Learning”, arXiv:1112.6209, 2011, presented at ICML 2012; Jeff Dean and Andrew Ng, “Using large-scale brain simulations for machine learning and A.I.”, Google blog, 26 June 2012"
  sourceUrl: https://arxiv.org/abs/1112.6209v1
  thread: compute
  isms: []
  themes: [compute]
  status: checked

- id: 2015-autonomous-weapons-letter
  era: deep-learning
  year: 2015
  month: 7
  day: 28
  title: A letter against killer robots
  line: Over a thousand AI researchers call for a ban on weapons that choose and attack targets on their own.
  who: Future of Life Institute; Stuart Russell; Stephen Hawking; Elon Musk; Steve Wozniak; Demis Hassabis; Noam Chomsky
  text: |
    In late July 2015, as the International Joint Conference on Artificial Intelligence opened in Buenos Aires, AI researchers published an open letter. It called for a ban on offensive autonomous weapons, which pick and attack targets with no human deciding, such as armed quadcopters hunting people. If any major power pushed ahead, it warned, an arms race would make them cheap and everywhere, “the Kalashnikovs of tomorrow”.

    The letter was the idea of Stuart Russell, a Berkeley computer scientist, and the Future of Life Institute organised it. Over 1,000 AI and robotics researchers signed at launch, with Stephen Hawking, Elon Musk, Steve Wozniak, Noam Chomsky and DeepMind's Demis Hassabis. It granted that such weapons might spare soldiers' lives, but feared they would make it easier to go to war.
  source: "Future of Life Institute, “Autonomous Weapons Open Letter: AI & Robotics Researchers”, futureoflife.org, announced 28 July 2015 at the opening of IJCAI (the text; quadcopters; arms race; fewer casualties against a lower threshold for war); Lucas Matney, “Hawking, Musk Warn Of ‘Virtually Inevitable’ AI Arms Race”, TechCrunch, 27 July 2015 (Buenos Aires; over 1,000 AI and robotics researchers; named signers); Bill Chappell, “Researchers Warn Against ‘Autonomous Weapons’ Arms Race”, NPR, 28 July 2015, as reprinted by GBH (Stuart Russell's idea; organised by the Future of Life Institute)"
  sourceUrl: https://futureoflife.org/open-letter/open-letter-autonomous-weapons-ai-robotics/
  isms: []
  themes: []
  thread: war
  status: checked
