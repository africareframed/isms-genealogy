- id: 2013-dnnresearch
  era: deep-learning
  year: 2013
  month: 3
  title: Google buys DNNresearch
  line: Google hires the ImageNet winners by buying their start-up.
  who: Google; Geoffrey Hinton, Alex Krizhevsky, Ilya Sutskever
  text: Google bought DNNresearch, the start-up Geoffrey Hinton had formed in 2012 with his students Alex Krizhevsky and Ilya Sutskever. It wanted their work on deep neural networks for image and voice search. Krizhevsky and Sutskever moved to Google, while Hinton split his time between Google and the University of Toronto. The terms were not disclosed.
  source: University of Toronto News, “Google acquires U of T neural networks company”, 12 March 2013; Rip Empson, “Google Scoops Up Neural Networks Startup DNNresearch To Boost Its Voice And Image Search Tech”, TechCrunch, 12 March 2013
  sourceUrl: https://www.utoronto.ca/news/google-acquires-u-t-neural-networks-company
