- id: 2014-google-deepmind
  era: deep-learning
  year: 2014
  month: 1
  title: Google buys DeepMind
  line: Google buys the London AI start-up, reportedly for more than $500 million.
  who: Google; Demis Hassabis, Shane Legg, Mustafa Suleyman
  text: |
    DeepMind, a London company founded by Demis Hassabis, Shane Legg and Mustafa Suleyman, built general-purpose learning algorithms. In December 2013 its researchers showed a network that learned to play seven Atari games from screen pixels, beating a human expert at three.

    In January 2014 Google bought it; The Information reported a price of more than $500 million. The deal was reportedly led by Google's chief executive, Larry Page.

    Google reportedly agreed to set up an ethics board, so that DeepMind's technology would not be abused. Facebook had reportedly held talks to buy it in late 2013.
  source: "Catherine Shu, “Google Acquires Artificial Intelligence Startup DeepMind For More Than $500M”, TechCrunch, 26 January 2014; Volodymyr Mnih, Koray Kavukcuoglu, David Silver and others (DeepMind Technologies), “Playing Atari with Deep Reinforcement Learning”, arXiv:1312.5602, 19 December 2013"
  sourceUrl: https://techcrunch.com/2014/01/26/google-deepmind/
