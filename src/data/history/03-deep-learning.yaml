- id: 2015-openai-founded
  era: deep-learning
  year: 2015
  month: 12
  title: OpenAI is founded
  line: A non-profit lab launches with $1 billion pledged to make AI benefit everyone.
  who: Sam Altman, Elon Musk, Greg Brockman, Ilya Sutskever
  text: |
    OpenAI launched as a non-profit research company, free of any need to make a financial return. Its aim was to advance digital intelligence in the way most likely to benefit humanity as a whole. Human-level AI, its founders wrote, could do society great good or great damage.

    AI, it said, should be spread as broadly and evenly as possible, and any patents of its own would be shared with the world. Backers including Sam Altman, Elon Musk, Greg Brockman, Reid Hoffman and Peter Thiel committed $1 billion. Altman and Musk were co-chairs, and Ilya Sutskever, one of the 2012 ImageNet winners, was research director.
  source: "OpenAI, “Introducing OpenAI”, 11 December 2015; ImageNet, “ImageNet Large Scale Visual Recognition Competition 2012 (ILSVRC2012)”, results"
  sourceUrl: https://openai.com/index/introducing-openai/
