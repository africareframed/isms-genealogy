  status: checked

- id: 2014-gans
  era: deep-learning
  year: 2014
  month: 6
  title: Generative adversarial networks
  line: Two networks compete, one forging data and the other spotting fakes.
  who: Ian Goodfellow, Yoshua Bengio and colleagues, Université de Montréal
  text: Ian Goodfellow and colleagues at the Université de Montréal proposed a new way to train networks that generate data. A generator makes samples, while a discriminator tries to tell them apart from real training data. The generator is trained to make the discriminator err, in a two-player game.
  source: Ian J. Goodfellow, Jean Pouget-Abadie, Mehdi Mirza and others, “Generative Adversarial Networks”, arXiv:1406.2661, 10 June 2014
  sourceUrl: https://arxiv.org/abs/1406.2661v1
  isms: []
  themes: []
