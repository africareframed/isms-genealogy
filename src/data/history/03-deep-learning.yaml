- id: 2017-asilomar-principles
  era: deep-learning
  year: 2017
  month: 1
  title: The Asilomar AI Principles
  line: AI researchers and others agree on 23 principles for beneficial AI.
  who: Future of Life Institute
  text: At a conference at Asilomar in January 2017, participants drew up 23 principles for beneficial AI. Each won the support of at least 90% of participants, in a survey after group discussions. They included aligning highly autonomous systems with human values, and avoiding an arms race in lethal autonomous weapons.
  source: The FLI Team, “A Principled AI Discussion in Asilomar”, Future of Life Institute, 18 January 2017
  sourceUrl: https://futureoflife.org/2017/01/17/principled-ai-discussion-asilomar/
  isms: [pro-human]
  themes: [alignment]
  thread: warnings
  status: checked

- id: 2016-machine-bias
  era: deep-learning
  year: 2016
  month: 5
  title: “Machine Bias”
  line: ProPublica finds a risk score wrongly flags Black defendants almost twice as often as white ones.
  who: ProPublica; Julia Angwin
  text: ProPublica examined COMPAS, software that rates defendants' risk of reoffending, using the scores of more than 7,000 people arrested in Broward County, Florida. Black defendants who did not reoffend were almost twice as likely as white ones to have been labelled higher risk. Northpointe, its maker, disputed the analysis.
  source: "Julia Angwin, Jeff Larson, Surya Mattu and Lauren Kirchner, “Machine Bias”, ProPublica, 23 May 2016"
  sourceUrl: https://www.propublica.org/article/machine-bias-risk-assessments-in-criminal-sentencing
  isms: [ai-ethics]
  themes: []
  thread: warnings
  status: checked

- id: 2016-alphago
  era: deep-learning
  year: 2016
  month: 3
  title: AlphaGo beats Lee Sedol
  line: A program defeats one of the world's best Go players, four games to one.
  who: DeepMind; Lee Sedol
  text: In Seoul, from 9 to 15 March 2016, DeepMind's AlphaGo beat Lee Sedol by four games to one. Lee was a nine-dan professional with 18 world titles. In the second game AlphaGo played a move that had a one-in-10,000 chance of being played by a human. Lee won the fourth game with a move just as unlikely.
  source: Demis Hassabis, “What we learned in Seoul with AlphaGo”, Google, 16 March 2016; British Go Association, “Google DeepMind Challenge Match – Lee Sedol v AlphaGo – match report”
  sourceUrl: https://blog.google/technology/ai/what-we-learned-in-seoul-with-alphago/
  isms: []
  themes: []
  thread: games
  image: collage-moment-alphago
  status: checked

- id: 2015-openai-founded
  era: deep-learning
  year: 2015
  month: 12
  title: OpenAI is founded
  line: A non-profit lab launches with $1 billion pledged to make AI benefit everyone.
  who: Sam Altman, Elon Musk, Greg Brockman, Ilya Sutskever
  text: OpenAI launched as a non-profit research company, free of any need to make a financial return. Its aim was to advance digital intelligence in the way most likely to benefit humanity as a whole. Backers including Sam Altman, Elon Musk, Greg Brockman, Reid Hoffman and Peter Thiel committed $1 billion. Altman and Musk were co-chairs, and Ilya Sutskever was research director.
  source: OpenAI, “Introducing OpenAI”, 11 December 2015
  sourceUrl: https://openai.com/index/introducing-openai/
  isms: []
  themes: []
  thread: booms-winters
  status: checked

- id: 2015-puerto-rico-conference
  era: deep-learning
  year: 2015
  month: 1
  title: The Puerto Rico conference
  line: AI builders meet on safety, and an open letter calls for beneficial AI.
  who: Future of Life Institute; Elon Musk
  text: In January 2015 the Future of Life Institute brought leading AI researchers from academia and industry to Puerto Rico. An open letter that followed called for research to make increasingly capable AI robust and beneficial. Stuart Russell, Demis Hassabis and Stephen Hawking were among its signers. Within two weeks of the meeting Elon Musk gave the institute $10 million for such research.
  source: "Future of Life Institute, AI conference page, “The Future of AI: Opportunities and Challenges”, Puerto Rico, 2–5 January 2015; Future of Life Institute, “Research Priorities for Robust and Beneficial Artificial Intelligence: An Open Letter”, January 2015; Future of Life Institute, January 2015 newsletter; Devindra Hardawar, “Elon Musk donates $10M to keep AI from going full Skynet”, Engadget, 15 January 2015"
  sourceUrl: https://futureoflife.org/open-letter/ai-open-letter/
