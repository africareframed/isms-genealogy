- id: 2013-word-vectors
  era: deep-learning
  year: 2013
  month: 1
  title: Google turns words into vectors
  line: Google researchers turn words into numbers that capture their meaning.
  who: Tomas Mikolov, Kai Chen, Greg Corrado and Jeffrey Dean, Google
  text: |
    Tomas Mikolov and colleagues at Google showed how to learn a list of numbers, a vector, for each word from huge amounts of text. The network learned each vector by predicting words from their neighbours, so similar words ended up close together. Training on 1.6 billion words took less than a day.

    As Mikolov's earlier work had shown, simple sums on such vectors capture meaning: king minus man plus woman lands closest to queen. Word vectors soon became widely used. In 2016 researchers found that vectors trained on Google News carried gender stereotypes, pairing man with computer programmer and woman with homemaker.
  source: "Tomas Mikolov, Kai Chen, Greg Corrado and Jeffrey Dean, “Efficient Estimation of Word Representations in Vector Space”, arXiv:1301.3781, 16 January 2013; Tolga Bolukbasi, Kai-Wei Chang, James Zou, Venkatesh Saligrama and Adam Kalai, “Man is to Computer Programmer as Woman is to Homemaker? Debiasing Word Embeddings”, arXiv:1607.06520, 21 July 2016"
  sourceUrl: https://arxiv.org/abs/1301.3781v1
  isms: []
