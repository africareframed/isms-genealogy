- id: 2014-gans
  era: deep-learning
  year: 2014
  month: 6
  title: Two networks learn by competing
  line: Two networks compete, one forging data and the other spotting fakes.
  who: Ian Goodfellow, Yoshua Bengio and colleagues, Université de Montréal
  text: |
    Ian Goodfellow, a doctoral student in Montreal, had the idea in a bar: set two neural networks against each other. He coded it that night, and it worked the first time. With colleagues at the Université de Montréal he published it in June 2014 as generative adversarial networks, or GANs.

    A generator makes samples, such as images, while a discriminator tries to tell them from real training data. The paper likened them to counterfeiters and police, each improving until the fakes pass for real.

    By 2018 Nvidia had used GANs to make faces of imaginary celebrities; MIT Technology Review warned of more convincing fake images and video.
  source: "Ian J. Goodfellow, Jean Pouget-Abadie, Mehdi Mirza and others, “Generative Adversarial Networks”, arXiv:1406.2661, 10 June 2014; Martin Giles, “The GANfather: The man who's given machines the gift of imagination”, MIT Technology Review, 21 February 2018"
  sourceUrl: https://arxiv.org/abs/1406.2661v1
  isms: []
  themes: []
  thread: symbols-networks
