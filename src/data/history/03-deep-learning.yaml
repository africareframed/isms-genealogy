- id: 2015-puerto-rico-conference
  era: deep-learning
  year: 2015
  month: 1
  title: The Puerto Rico conference
  line: AI builders meet on safety, and an open letter calls for beneficial AI.
  who: Future of Life Institute; Elon Musk
  text: |
    The Future of Life Institute works to steer powerful technology away from extreme large-scale risks. In January 2015 it brought leading AI researchers from academia and industry to Puerto Rico. An open letter that followed called for research to make increasingly capable AI robust and beneficial.

    Stuart Russell, Demis Hassabis and Stephen Hawking were among its signers, and more than 11,000 people have signed it since. Within two weeks of the meeting Elon Musk gave the institute $10 million for such research. In July 2015 the institute chose 37 research teams to share about $7 million from Musk and the Open Philanthropy Project.
  source: "Future of Life Institute, AI conference page, “The Future of AI: Opportunities and Challenges”, Puerto Rico, 2–5 January 2015; Future of Life Institute, “Research Priorities for Robust and Beneficial Artificial Intelligence: An Open Letter”, January 2015; Future of Life Institute, January 2015 newsletter; Devindra Hardawar, “Elon Musk donates $10M to keep AI from going full Skynet”, Engadget, 15 January 2015; Future of Life Institute, announcement of the 2015 grant winners, 1 July 2015"
  sourceUrl: https://futureoflife.org/open-letter/ai-open-letter/
