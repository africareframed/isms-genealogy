- id: 2017-asilomar-principles
  era: deep-learning
  year: 2017
  month: 1
  title: Researchers agree the Asilomar Principles
  line: AI researchers and others agree on 23 principles for beneficial AI.
  who: Future of Life Institute
  text: |
    In January 2017 the Future of Life Institute brought AI researchers and experts in economics, law, ethics and philosophy to Asilomar, California. Speakers and panellists included Demis Hassabis of DeepMind, Nick Bostrom of Oxford and Elon Musk. Participants drew up 23 principles, each backed by at least 90% of them in a survey after group discussions.

    The first says AI research should aim at beneficial intelligence, not undirected intelligence. Others call for aligning highly autonomous systems with human values, avoiding an arms race in lethal autonomous weapons and strict controls on self-improving AI. By the institute's count, 1,200 AI and robotics researchers have since signed them, with 2,342 others.
  source: "The FLI Team, “A Principled AI Discussion in Asilomar”, Future of Life Institute, 18 January 2017; Future of Life Institute, “Beneficial AI 2017”, event page (Asilomar, 3–8 January 2017); Future of Life Institute, “Asilomar AI Principles”, open letter page"
  sourceUrl: https://futureoflife.org/2017/01/17/principled-ai-discussion-asilomar/
  isms: [pro-human]
  themes: [alignment]
  thread: warnings
