- id: 1950-shannon-chess
  era: birth
  year: 1950
  month: 3
  title: Shannon plans a chess program
  line: Bell Labs' Claude Shannon sets out how a computer could play chess.
  who: Claude Shannon, Bell Telephone Laboratories
  text: |
    Shannon, a Bell Labs mathematician and keen chess player, wrote the first technical paper on computer chess. It was entirely theoretical, and described no program actually run on a computer. He hoped chess would open the way to weightier problems, such as translating languages or making military decisions.

    Calculating every game to its end was impractical: about 10¹²⁰ variations, over 10⁹⁰ years' work at one per microsecond. Instead he weighed two strategies: examining every line a few moves deep, or using chess knowledge to follow only promising ones. The second anticipated what Newell and Simon would call heuristics, rules of thumb that narrow a search.
  source: "Claude E. Shannon, “Programming a Computer for Playing Chess”, Philosophical Magazine, series 7, 41 (314), March 1950; Jeremy Norman, “Shannon Issues the First Technical Paper on Computer Chess”, HistoryofInformation.com; Nils J. Nilsson, The Quest for Artificial Intelligence, Cambridge University Press, 2010, ch. 2 and 5"
  sourceUrl: https://historyofinformation.com/detail.php?entryid=94
  thread: games
  isms: []
  themes: []
  status: checked

- id: 1948-cybernetics
  era: birth
  year: 1948
  title: Cybernetics
  line: Wiener names a science of feedback in animals and machines.
  who: Norbert Wiener, MIT
  text: |
    Wiener, a professor at MIT, set out a theory of control, feedback and communication in living things and machines. Feedback lets a system correct itself by sensing its own output, as James Watt's governor held a steam engine at a steady speed. He took the name from the Greek for steersman, since ships' steering engines were early feedback mechanisms.

    The book's ideas spread into fields from bioengineering to political science, and later gave English words such as cyborg and cyberspace. In a closing note he asked whether a machine could play chess, and thought it might play as well as most people. McCarthy later said he named artificial intelligence partly to escape cybernetics, not wishing to accept Wiener as a guru or argue with him.
  source: "Norbert Wiener, Cybernetics: Or Control and Communication in the Animal and the Machine, Hermann & Cie, Paris, and MIT Press, 1948; MIT Libraries, “MIT 150 Books: Cybernetics”; Nils J. Nilsson, The Quest for Artificial Intelligence, Cambridge University Press, 2010, ch. 2 and 3"
  sourceUrl: https://libraries.mit.edu/150books/2011/04/04/1948/
