- id: 1955-logic-theorist
  era: birth
  year: 1955
  month: 12
  title: The Logic Theorist
  line: A program proves theorems from Principia Mathematica by searching for them.
  who: Allen Newell, Herbert Simon and Cliff Shaw, RAND Corporation
  text: On 15 December 1955 Simon worked through the program's first proof by hand. It searched for proofs by transforming logical formulas, guided by rules of thumb that Newell and Simon called heuristics. Running at RAND in 1956, it proved 38 of the first 52 theorems of Whitehead and Russell's Principia Mathematica. Newell and Simon later described intelligence as a symbol system solving problems by search.
  source: "Allen Newell and Herbert A. Simon, “The Logic Theory Machine: A Complex Information Processing System”, RAND paper P-868, 15 June 1956, and IRE Transactions on Information Theory, September 1956; Nils J. Nilsson, The Quest for Artificial Intelligence, Cambridge University Press, 2010, ch. 3 and 5"
  sourceUrl: https://www.historyofinformation.com/detail.php?id=742
  thread: reasoning
  isms: []
  themes: []
  status: draft

- id: 1955-dartmouth-proposal
  era: birth
  year: 1955
  month: 8
  title: A name for the field
  line: Four scientists propose a summer study of “artificial intelligence”.
  who: John McCarthy, Marvin Minsky, Nathaniel Rochester and Claude Shannon
  text: McCarthy led the writing of a proposal to the Rockefeller Foundation, dated 31 August 1955. It asked for “a 2 month, 10 man study of artificial intelligence” at Dartmouth the next summer. The study would assume that every feature of intelligence can be described precisely enough for a machine to simulate it. The proposal is apparently the first appearance of the phrase.
  source: "John McCarthy, Marvin Minsky, Nathaniel Rochester and Claude Shannon, “A Proposal for the Dartmouth Summer Research Project on Artificial Intelligence”, 31 August 1955, reprinted in AI Magazine 27 (4), 2006; Computer History Museum, “The 1956 Dartmouth Workshop and its Immediate Consequences”"
  sourceUrl: https://computerhistory.org/?p=3246
