- id: 1966-eliza
  era: birth
  year: 1966
  month: 1
  title: ELIZA plays the therapist
  line: A simple program plays a therapist, and users credit it with understanding.
  who: Joseph Weizenbaum, MIT
  text: |
    Weizenbaum's program ran on MIT's MAC time-sharing system, where many users shared one large computer from distant typewriters. It scanned typed sentences for key words and answered from rules kept in a separate script. Its scripts made it answer like a Rogerian psychotherapist, a role in which knowing little about the world seems natural.

    When a user typed that men are all alike, it asked in what way; told of a boyfriend, it echoed the words back. Weizenbaum observed that users lent the program knowledge and insight it did not have.

    He later argued, notably in Computer Power and Human Reason (1976), that computers should not be given tasks that demand wisdom.
  source: "Joseph Weizenbaum, “ELIZA: A Computer Program for the Study of Natural Language Communication Between Man and Machine”, Communications of the ACM 9 (1), January 1966; Nils J. Nilsson, The Quest for Artificial Intelligence, Cambridge University Press, 2010, ch. 24"
  sourceUrl: https://courses.cs.umbc.edu/331/papers/eliza.html
