- id: 1950-turing-imitation-game
  era: birth
  year: 1950
  month: 10
  title: Computing Machinery and Intelligence
  line: Turing swaps “Can machines think?” for a test of conversation.
  who: Alan Turing
  text: |
    Turing, an English mathematician, had described an imaginary computing machine in 1936. His paper in Mind opens with the question “Can machines think?” and swaps it for the imitation game. An interrogator questions two hidden players in writing, a man and a woman, and must tell which is which.

    Turing then put a machine in one of their places; this became known as the Turing test. He predicted that by about 2000 an average interrogator would spot the machine at most 70 per cent of the time, after five minutes. He also answered nine objections to thinking machines, and proposed building a machine like a child's mind and educating it.
  source: "A. M. Turing, “Computing Machinery and Intelligence”, Mind 59 (236), October 1950, pp. 433–460; Nils J. Nilsson, The Quest for Artificial Intelligence, Cambridge University Press, 2010, ch. 2"
  sourceUrl: https://courses.cs.umbc.edu/471/papers/turing.pdf
