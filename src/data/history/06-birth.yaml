- id: 1946-eniac
  era: birth
  year: 1946
  month: 2
  title: ENIAC is announced
  line: The first general-purpose electronic computer fills a room in Philadelphia.
  who: John Mauchly and J. Presper Eckert, University of Pennsylvania, for the US Army
  text: Built under a contract from the Army's Ballistics Research Laboratory, ENIAC was announced on 14 February 1946. It needed about 18,000 vacuum tubes, weighed 30 tons and filled a room 30 by 50 feet. A firing-table calculation that took 12 hours by hand took it 30 seconds. It was run by six women, among the very first programmers anywhere.
  source: "Penn Engineering, “Celebrating Penn Engineering History: ENIAC”, University of Pennsylvania School of Engineering and Applied Science"
  sourceUrl: https://www.engineering.upenn.edu/about/history-heritage/eniac/
