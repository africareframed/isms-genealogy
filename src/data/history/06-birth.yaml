  status: draft

- id: 1958-perceptron
  era: birth
  year: 1958
  title: The Perceptron
  line: The US Navy unveils a machine that learns by trial and error.
  who: Frank Rosenblatt, Cornell Aeronautical Laboratory, with the Office of Naval Research
  text: In July 1958 the Office of Naval Research demonstrated Rosenblatt's perceptron, simulated on an IBM 704. After 50 trials it had taught itself to tell cards marked on the left from cards marked on the right. Rosenblatt called it the first machine “capable of having an original idea”. A hardware version, the Mark I, was first shown in public in June 1960.
  source: "Cornell University, “Professor's perceptron paved the way for AI – 60 years too soon”, Cornell Chronicle, 25 September 2019; Nils J. Nilsson, The Quest for Artificial Intelligence, Cambridge University Press, 2010, ch. 4"
  sourceUrl: https://psychology.cornell.edu/news/professors-perceptron-paved-way-ai-60-years-too-soon
