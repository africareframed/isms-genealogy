- id: 1950-turing-imitation-game
  era: birth
  year: 1950
  month: 10
  title: Computing Machinery and Intelligence
  line: Turing swaps “Can machines think?” for a test of conversation.
  who: Alan Turing
  text: Turing's paper in Mind opens with the question “Can machines think?” He replaces it with the imitation game, in which an interrogator questions two hidden players in writing and must tell which is which. He expected that by about 2000 an average interrogator would have at most a 70 per cent chance of spotting the machine. He also proposed building a machine like a child's mind and educating it.
  source: "A. M. Turing, “Computing Machinery and Intelligence”, Mind 59 (236), October 1950, pp. 433–460"
  sourceUrl: https://courses.cs.umbc.edu/471/papers/turing.shtml
