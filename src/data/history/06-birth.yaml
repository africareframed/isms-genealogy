- id: 1960-wiener-automation
  era: birth
  year: 1960
  title: Moral consequences of automation
  line: The founder of cybernetics warns that learning machines may outrun their makers.
  who: Norbert Wiener
  text: Writing in Science, Wiener pointed to checkers programs that beat their own programmers after 10 to 20 hours of play. Machines that learn, he argued, can act in ways their makers did not foresee, and faster than people can react. If we cannot interfere once a machine starts, we must be sure it pursues “the purpose which we really desire”.
  source: "Norbert Wiener, “Some Moral and Technical Consequences of Automation”, Science 131 (3410), 6 May 1960"
  sourceUrl: https://www.cs.umd.edu/users/gasarch/BLOGPAPERS/moral.pdf
  thread: warnings
