- id: 1955-logic-theorist
  era: birth
  year: 1955
  month: 12
  title: The Logic Theorist proves theorems
  line: A program proves theorems from Principia Mathematica by searching for them.
  who: Allen Newell, Herbert Simon and Cliff Shaw, RAND Corporation
  text: |
    On 15 December 1955 Simon worked through the program's first proof by hand. In the new term he told his students: “Over the Christmas holiday, Allen Newell and I invented a machine that thinks.”

    It searched for proofs by transforming logical formulas, guided by rules of thumb that Newell and Simon called heuristics. The programmer Cliff Shaw got it running in 1956 on the RAND Corporation's computer in Santa Monica, California. It proved 38 of the first 52 theorems of Whitehead and Russell's Principia Mathematica, finding a new and better proof for one.

    Newell and Simon later argued that a physical symbol system, a machine that manipulates symbols, has all that intelligent action needs.
  source: "Allen Newell and Herbert A. Simon, “The Logic Theory Machine: A Complex Information Processing System”, RAND paper P-868, 15 June 1956, and IRE Transactions on Information Theory, September 1956; Nils J. Nilsson, The Quest for Artificial Intelligence, Cambridge University Press, 2010, ch. 3 and 5; Jeremy Norman, “Newell, Simon & Shaw Develop the First Artificial Intelligence Program”, HistoryofInformation.com; Hunter Heyck, biography of Herbert A. Simon, A.M. Turing Award laureates, Association for Computing Machinery"
  sourceUrl: https://historyofinformation.com/detail.php?id=742
  thread: reasoning
  isms: []
