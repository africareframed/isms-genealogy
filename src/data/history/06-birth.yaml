- id: 1958-perceptron
  era: birth
  year: 1958
  title: The Navy unveils the perceptron
  line: The US Navy unveils a machine that learns by trial and error.
  who: Frank Rosenblatt, Cornell Aeronautical Laboratory, with the Office of Naval Research
  text: |
    In July 1958 the Office of Naval Research demonstrated Rosenblatt's perceptron, simulated on an IBM 704, a computer the size of a room. After 50 trials it had taught itself to tell cards marked on the left from cards marked on the right. Rosenblatt, a research psychologist at the Cornell Aeronautical Laboratory, called it the first machine “capable of having an original idea”.

    Inspired by the brain's neurons, a perceptron makes a guess and, when it is wrong, adjusts the strength of its connections. Reporters took keen interest, and The New York Times reported a new Navy device that learns by doing. A hardware version, the Mark I, was first shown in public in June 1960, with small motors turning the dials that set its weights.
  source: "Melanie Lefkowitz, “Professor's perceptron paved the way for AI – 60 years too soon”, Cornell Chronicle, Cornell University, 25 September 2019; Nils J. Nilsson, The Quest for Artificial Intelligence, Cambridge University Press, 2010, ch. 4"
  sourceUrl: https://news.cornell.edu/node/313946
