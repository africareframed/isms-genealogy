- id: 1946-eniac
  era: birth
  year: 1946
  month: 2
  title: ENIAC is announced
  line: The first general-purpose electronic computer fills a room in Philadelphia.
  who: John Mauchly and J. Presper Eckert, University of Pennsylvania, for the US Army
  text: |
    Built under a contract from the Army's Ballistics Research Laboratory, ENIAC was announced on 14 February 1946. It needed about 18,000 vacuum tubes, weighed 30 tons and filled a room 30 by 50 feet. A ballistics calculation that took 12 hours on a hand calculator took it 30 seconds.

    Beyond firing tables for artillery, it worked on weather prediction and atomic-energy calculations. Six women ran it, among the earliest programmers in the world, preparing each job by plugging in cables and setting switches. The press of the day pictured only the men, and the six were recognised only decades later.
  source: "Penn Engineering, “Celebrating Penn Engineering History: ENIAC”, University of Pennsylvania School of Engineering and Applied Science"
  sourceUrl: https://www.engineering.upenn.edu/about/history-heritage/eniac/
