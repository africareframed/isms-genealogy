- id: 1955-dartmouth-proposal
  era: birth
  year: 1955
  month: 8
  title: The Dartmouth proposal names the field
  line: Four scientists propose a summer study of “artificial intelligence”.
  who: John McCarthy, Marvin Minsky, Nathaniel Rochester and Claude Shannon
  text: |
    McCarthy, a mathematics professor at Dartmouth, led the writing, with Minsky of Harvard, Rochester of IBM and Shannon of Bell Labs. Their proposal, dated 31 August 1955, asked the Rockefeller Foundation for “a 2 month, 10 man study of artificial intelligence” at Dartmouth.

    The summer study would assume that every feature of intelligence can be described precisely enough for a machine to simulate it. It would try to make machines use language, form concepts, solve problems now reserved for humans and improve themselves. A carefully chosen group working together for one summer, they wrote, could make a significant advance.

    The proposal is apparently the first appearance of the phrase.
  source: "John McCarthy, Marvin Minsky, Nathaniel Rochester and Claude Shannon, “A Proposal for the Dartmouth Summer Research Project on Artificial Intelligence”, 31 August 1955, reprinted in AI Magazine 27 (4), 2006; Computer History Museum, “The 1956 Dartmouth Workshop and its Immediate Consequences”; Nils J. Nilsson, The Quest for Artificial Intelligence, Cambridge University Press, 2010, ch. 3"
  sourceUrl: https://computerhistory.org/?p=3246
