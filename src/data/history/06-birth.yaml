- id: 1943-mcculloch-pitts
  era: birth
  year: 1943
  title: A logical calculus of neurons
  line: Two scientists model neurons as switches, and networks of them as logic.
  who: Warren McCulloch and Walter Pitts
  text: Because a neuron either fires or does not, McCulloch and Pitts treated nervous activity as propositional logic. They showed that the behaviour of any net of such idealised neurons can be written in logic. Conversely, for any logical expression meeting certain conditions, a net can be built that behaves as it describes.
  source: "Warren S. McCulloch and Walter Pitts, “A Logical Calculus of the Ideas Immanent in Nervous Activity”, Bulletin of Mathematical Biophysics 5 (4), 1943, pp. 115–133"
  sourceUrl: https://link.springer.com/article/10.1007/BF02478259
