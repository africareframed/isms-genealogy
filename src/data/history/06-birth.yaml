- id: 1965-ultraintelligent-machine
  era: birth
  year: 1965
  title: The first ultraintelligent machine
  line: A statistician foresees machines that design ever better machines.
  who: I. J. Good
  text: Good defined an ultraintelligent machine as one that could far surpass any human in every intellectual activity. Designing machines is one such activity, so it could build better machines, and an intelligence explosion would follow. The first such machine would be “the last invention that man need ever make”. That held, he added, only if it were docile enough to be kept under control.
  source: "I. J. Good, “Speculations Concerning the First Ultraintelligent Machine”, Advances in Computers 6, Academic Press, 1965"
  sourceUrl: https://quoteinvestigator.com/2022/01/04/ultraintelligent/
