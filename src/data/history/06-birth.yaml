- id: 1966-shakey
  era: birth
  year: 1966
  month: 3
  title: SRI builds Shakey the robot
  line: A wheeled robot at SRI perceives its rooms and plans its moves.
  who: SRI's Artificial Intelligence Center (Charles Rosen, Nils Nilsson, Bertram Raphael and others)
  text: |
    Work began at SRI, then the Stanford Research Institute, in March 1966, under a contract from ARPA, a US defence research agency. Named for how it shook when it stopped, Shakey moved through a set of rooms with a camera, range finder and bump sensors. Asked in English to push a box off a platform, it worked out that it must first push a ramp to the platform.

    SRI calls it the first mobile robot that could perceive and reason about its surroundings. The A* search method, devised to plan its routes, was later used for driving directions and in computer games. The agency, renamed DARPA in 1972, declined to fund more, and the project ended that year.
  source: "Nils J. Nilsson, The Quest for Artificial Intelligence, Cambridge University Press, 2010, ch. 2, 8 and 12; SRI International, “Shakey the Robot”, sri.com"
  sourceUrl: https://sri.com/hoi/shakey-the-robot
