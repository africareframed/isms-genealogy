- id: 1973-lighthill-report
  era: birth
  year: 1973
  title: The Lighthill report
  line: A British survey finds that AI has not delivered what it promised.
  who: Sir James Lighthill, for the Science Research Council
  text: The Science Research Council asked the Cambridge mathematician to review AI, and published his report in 1973. He backed work on automation and on models of the brain, but found the bridge between them, robots and language, disappointing. Its methods, he argued, would founder on the combinatorial explosion. The report became the basis for ending support for AI at most British universities.
  source: "James Lighthill, “Artificial Intelligence: A General Survey”, in Artificial Intelligence: a paper symposium, Science Research Council, 1973"
  sourceUrl: https://www.aiai.ed.ac.uk/events/lighthill1973/lighthill.pdf
  thread: booms-winters
  isms: []
  themes: []
  status: draft

- id: 1969-perceptrons
  era: birth
  year: 1969
  title: Perceptrons
  line: Two MIT scientists prove what simple neural networks cannot do.
  who: Marvin Minsky and Seymour Papert
  text: Their book gave a mathematical analysis of Rosenblatt's machines. It proved that limited, single-layer perceptrons cannot detect some properties of an image, such as whether a figure is connected. Some say it turned AI away from neural networks and towards symbolic programs. Nils Nilsson doubted that, and Geoffrey Hinton later said the book never proved neural nets were nonsense.
  source: "Marvin Minsky and Seymour Papert, Perceptrons: An Introduction to Computational Geometry, MIT Press, 1969; Nils J. Nilsson, The Quest for Artificial Intelligence, Cambridge University Press, 2010, ch. 16; Geoffrey Hinton, oral-history interview by Vassilis Galanos, University of Edinburgh, 14 June 2024"
  sourceUrl: https://groups.inf.ed.ac.uk/aics_history/AICSCSHistory_Interview005_GeoffreyHinton_publish.pdf
  thread: symbols-networks
  isms: []
  themes: []
  status: draft

- id: 1966-shakey
  era: birth
  year: 1966
  month: 3
  title: Shakey the robot
  line: A wheeled robot at SRI perceives its rooms and plans its moves.
  who: SRI's Artificial Intelligence Center (Charles Rosen, Nils Nilsson, Bertram Raphael and others)
  text: Work began at SRI in March 1966, under a contract from ARPA. Shakey carried a camera, a range finder and bump sensors, and planned its way through a set of rooms. SRI calls it the first mobile robot that could perceive and reason about its surroundings. ARPA declined to fund more, and the project ended in 1972.
  source: "Nils J. Nilsson, The Quest for Artificial Intelligence, Cambridge University Press, 2010, ch. 12; SRI International, “Shakey the Robot”, sri.com"
  sourceUrl: https://sri.com/hoi/shakey-the-robot
