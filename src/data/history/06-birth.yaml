  themes: [alignment]
  status: draft

- id: 1959-samuel-checkers
  era: birth
  year: 1959
  title: Samuel's checkers player
  line: An IBM program learns to play checkers better than the man who wrote it.
  who: Arthur Samuel, IBM
  text: Samuel had written checkers programs for IBM computers since 1952, to explore how a computer could learn. In 1959 he reported that after 8 or 10 hours of play, his program on the IBM 704 played better checkers than he did. The paper's title, Some Studies in Machine Learning, is often credited with coining the term. In 1962 the program beat Robert Nealey, a checkers master from Connecticut.
  source: "Arthur L. Samuel, “Some Studies in Machine Learning Using the Game of Checkers”, IBM Journal of Research and Development 3 (3), July 1959; Nils J. Nilsson, The Quest for Artificial Intelligence, Cambridge University Press, 2010, ch. 5"
  sourceUrl: https://people.csail.mit.edu/brooks/idocs/Samuel.pdf
