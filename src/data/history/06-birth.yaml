- id: 1965-ultraintelligent-machine
  era: birth
  year: 1965
  title: Good foresees an intelligence explosion
  line: A mathematician foresees machines that design ever better machines.
  who: I. J. Good
  text: |
    Good, a mathematician and cryptographer, defined an ultraintelligent machine as one far surpassing any human in every intellectual activity. Designing machines is one such activity, so it could build better machines, and an intelligence explosion would follow. The first such machine would be “the last invention that man need ever make”.

    He added one condition, that the machine be docile enough to tell us how to control it. Good believed humanity's survival depended on building one early, and thought it more likely than not to come within the twentieth century. In 1993 the science fiction writer Vernor Vinge reprinted the passage in his essay on the technological singularity.
  source: "I. J. Good, “Speculations Concerning the First Ultraintelligent Machine”, Advances in Computers 6, Academic Press, 1965; Quote Investigator, “The First Ultraintelligent Machine Is the Last Invention That Humanity Need Ever Make”, 4 January 2022; Nils J. Nilsson, The Quest for Artificial Intelligence, Cambridge University Press, 2010, ch. 35"
  sourceUrl: https://quoteinvestigator.com/2022/01/04/ultraintelligent/
