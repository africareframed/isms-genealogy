- id: 1950-shannon-chess
  era: birth
  year: 1950
  month: 3
  title: Programming a computer to play chess
  line: Bell Labs' Claude Shannon sets out how a computer could play chess.
  who: Claude Shannon, Bell Telephone Laboratories
  text: Shannon's paper in the Philosophical Magazine was the first technical paper on computer chess. It was entirely theoretical, and described no program actually run on a computer. He contrasted two strategies, examining every possible line of play or using chess knowledge to follow only promising ones. The second anticipated what Newell and Simon would call heuristics.
  source: "Claude E. Shannon, “Programming a Computer for Playing Chess”, Philosophical Magazine, series 7, 41 (314), March 1950; Nils J. Nilsson, The Quest for Artificial Intelligence, Cambridge University Press, 2010, ch. 5"
  sourceUrl: https://historyofinformation.com/detail.php?entryid=94
