- id: 1969-perceptrons
  era: birth
  year: 1969
  title: Minsky and Papert show the perceptron's limits
  line: Two MIT scientists prove what simple neural networks cannot do.
  who: Marvin Minsky and Seymour Papert
  text: |
    Marvin Minsky and Seymour Papert, a mathematician who had worked with the psychologist Jean Piaget, jointly directed MIT's AI laboratory. Their book analysed Rosenblatt's perceptrons mathematically; Minsky had debated Rosenblatt at conferences. It proved that networks with a single layer of adjustable weights cannot compute some simple functions, such as whether two inputs differ.

    Some have blamed it for a fading interest in neural networks. Nils Nilsson doubted that: Rosenblatt had already turned to other topics, and the success of heuristic programs had drawn attention away. Geoffrey Hinton, a neural-network researcher, later said the book never proved neural nets were nonsense, nor showed that deeper networks shared those limits.
  source: "Marvin Minsky and Seymour Papert, Perceptrons: An Introduction to Computational Geometry, MIT Press, 1969; Nils J. Nilsson, The Quest for Artificial Intelligence, Cambridge University Press, 2010, ch. 8 and 16; Geoffrey Hinton, oral-history interview by Vassilis Galanos, University of Edinburgh, 14 June 2024; Melanie Lefkowitz, “Professor's perceptron paved the way for AI – 60 years too soon”, Cornell Chronicle, 25 September 2019"
  sourceUrl: https://groups.inf.ed.ac.uk/aics_history/AICSCSHistory_Interview005_GeoffreyHinton_publish.pdf
  thread: symbols-networks
