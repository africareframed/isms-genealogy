- id: 1966-eliza
  era: birth
  year: 1966
  month: 1
  title: ELIZA
  line: A simple program plays a therapist, and users credit it with understanding.
  who: Joseph Weizenbaum, MIT
  text: Weizenbaum's program ran on MIT's MAC time-sharing system. It scanned typed sentences for key words and answered from rules kept in a separate script. Its scripts made it answer like a Rogerian psychotherapist, a role in which knowing little about the world seems natural. Weizenbaum observed that users lent the program knowledge and insight it did not have.
  source: "Joseph Weizenbaum, “ELIZA: A Computer Program for the Study of Natural Language Communication Between Man and Machine”, Communications of the ACM 9 (1), January 1966"
  sourceUrl: https://courses.cs.umbc.edu/331/papers/eliza.html
