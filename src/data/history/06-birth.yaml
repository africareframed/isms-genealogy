- id: 1973-lighthill-report
  era: birth
  year: 1973
  title: Britain cuts AI after the Lighthill report
  line: A British survey finds that AI has not delivered what it promised.
  who: Sir James Lighthill, for the Science Research Council
  text: |
    Britain's Science Research Council asked Lighthill, a Cambridge mathematician famous for his work on fluids, to review AI. His report of July 1972, published in 1973, found no part of the field had made the major impact promised around 1960.

    He backed work on automation and on models of the brain, but found the bridge between them, robots and language, disappointing. Its methods, he argued, would founder on the combinatorial explosion: the possibilities to search multiply explosively as problems grow.

    The report led to deep cuts in British AI research, among them Donald Michie's work on the Freddy robot at Edinburgh. In June 1973 BBC television held a debate on it at the Royal Institution, with Lighthill, Michie, John McCarthy and Richard Gregory.
  source: "James Lighthill, “Artificial Intelligence: A General Survey”, in Artificial Intelligence: a paper symposium, Science Research Council, 1973; Nils J. Nilsson, The Quest for Artificial Intelligence, Cambridge University Press, 2010, ch. 16; Artificial Intelligence Applications Institute, University of Edinburgh, “BBC TV – June 1973 – Lighthill Controversy Debate at the Royal Institution”; Jon Agar, “What is science for? The Lighthill report on artificial intelligence reinterpreted”, The British Journal for the History of Science 53 (3), 2020"
  sourceUrl: https://www.aiai.ed.ac.uk/events/lighthill1973/lighthill.pdf
