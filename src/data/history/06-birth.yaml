- id: 1948-cybernetics
  era: birth
  year: 1948
  title: Cybernetics
  line: Wiener names a science of feedback in animals and machines.
  who: Norbert Wiener, MIT
  text: Wiener's book set out a theory of control, feedback and communication in living things and machines. He took its name from the Greek for steersman, since ships' steering engines were early feedback mechanisms. Its chapters ranged from computing machines and the nervous system to learning and self-reproducing machines. McCarthy later said he named artificial intelligence partly to escape association with cybernetics.
  source: "Norbert Wiener, Cybernetics: Or Control and Communication in the Animal and the Machine, Hermann & Cie, Paris, and MIT Press, 1948; MIT Libraries, “MIT 150 Books: Cybernetics”; Nils J. Nilsson, The Quest for Artificial Intelligence, Cambridge University Press, 2010, ch. 3"
  sourceUrl: https://libraries.mit.edu/150books/2011/04/04/1948/
