- id: 1943-mcculloch-pitts
  era: birth
  year: 1943
  title: Neurons are modelled as logic
  line: Two scientists model neurons as switches, and networks of them as logic.
  who: Warren McCulloch and Walter Pitts
  text: |
    Warren McCulloch was an American neurophysiologist and Walter Pitts a logician. Their model neuron fired when enough exciting signals reached it from other units, unless inhibiting signals held it back.

    Because a neuron either fires or does not, they treated nervous activity as propositional logic, the logic of true and false statements. They showed that the behaviour of any net of such idealised neurons can be written in logic. Conversely, for any logical expression meeting certain conditions, a net can be built that behaves as it describes.

    Units of this kind became the building blocks of later neural networks, among them Rosenblatt's perceptron.
  source: "Warren S. McCulloch and Walter Pitts, “A Logical Calculus of the Ideas Immanent in Nervous Activity”, Bulletin of Mathematical Biophysics 5 (4), 1943, pp. 115–133; Nils J. Nilsson, The Quest for Artificial Intelligence, Cambridge University Press, 2010, ch. 2 and 4"
  sourceUrl: https://link.springer.com/article/10.1007/BF02478259
  thread: symbols-networks
  isms: []
  themes: []
  status: checked

- id: 1972-dreyfus
  era: birth
  year: 1972
  title: What Computers Can't Do
  line: A philosopher argues that AI built from rules cannot capture how people really think and act.
  who: Hubert Dreyfus; RAND Corporation
  text: |
    Hubert Dreyfus, a philosopher at MIT, spent the summer of 1961 studying AI at the RAND Corporation, a think tank in California. In December 1965 RAND issued his paper “Alchemy and Artificial Intelligence”, which judged AI's ultimate goals as far out of reach as the alchemists'. Claiming progress from early successes, he wrote, was like the first man up a tree claiming progress towards the moon.

    Significant progress, the paper concluded, must await a different sort of computer; the only prototype was the little-understood human brain. In 1967 an MIT chess program beat Dreyfus, who had written that no program could play even amateur chess.

    In 1972 he expanded his case into a book, What Computers Can't Do; his exchanges with AI researchers were often contentious. Human expertise, he argued, rests on a body living in the world, not on rules a program could follow.
  source: "Hubert L. Dreyfus, “Alchemy and Artificial Intelligence”, RAND Corporation paper P-3244, December 1965 (the abstract on rand.org: a different sort of computer, the human brain); Hubert L. Dreyfus, What Computers Can't Do: A Critique of Artificial Reason, Harper & Row, 1972 (as cited by Nilsson); Nils J. Nilsson, The Quest for Artificial Intelligence, Cambridge University Press, 2010, chs. 14 and 24 (teaching at MIT; the summer of 1961; alchemy; the tree; MAC HACK VI and the chess game of 1967; contentious interactions; the body; read in the author's online draft of 13 September 2009)"
  sourceUrl: https://www.rand.org/pubs/papers/P3244.html
  isms: []
