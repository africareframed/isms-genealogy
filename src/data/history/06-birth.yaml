- id: 1956-dartmouth-workshop
  era: birth
  year: 1956
  title: The Dartmouth workshop
  line: A small group spends a summer at Dartmouth founding a new field.
  who: John McCarthy, Marvin Minsky, Nathaniel Rochester and Claude Shannon, with Allen Newell, Herbert Simon, Arthur Samuel, Oliver Selfridge, Ray Solomonoff and others
  text: |
    With money from the Rockefeller Foundation, the workshop met at Dartmouth College for about six weeks of the summer. Besides the proposal's four authors came Arthur Samuel of IBM, who had written a checkers program, Ray Solomonoff, Oliver Selfridge and others. It turned out to be more a rolling workshop than a joint study.

    Newell and Simon brought a working program that proved theorems in logic. Neither liked the name artificial intelligence, and for years they called their work complex information processing.

    The meeting came to be seen as the official start of AI research, with McCarthy, Minsky, Newell and Simon as its fathers.
  source: "Nils J. Nilsson, The Quest for Artificial Intelligence, Cambridge University Press, 2010, ch. 3; Computer History Museum, “The 1956 Dartmouth Workshop and its Immediate Consequences: The Origins of Artificial Intelligence”"
  sourceUrl: https://ai.stanford.edu/~nilsson/QAI/qai.pdf
