- id: 1960-wiener-automation
  era: birth
  year: 1960
  title: Wiener warns about learning machines
  line: The founder of cybernetics warns that learning machines may outrun their makers.
  who: Norbert Wiener
  text: |
    Wiener, a mathematician at MIT, wrote in Science about checkers programs that beat their own programmers after 10 to 20 hours of play. Machines that learn, he argued, can act in ways their makers did not foresee, and faster than people can react.

    He recalled the sorcerer's apprentice, whose broom nearly drowns him, and imagined a bottle factory run for maximum output that bankrupts its owner. If we cannot interfere once a machine starts, we must be sure it pursues “the purpose which we really desire”.

    The Berkeley computer scientist Stuart Russell later saw echoes of this warning in fears of superintelligent AI. Putting the right purpose into a machine, he writes, is now called value alignment.
  source: "Norbert Wiener, “Some Moral and Technical Consequences of Automation”, Science 131 (3410), 6 May 1960; Stuart Russell, “Human-Compatible Artificial Intelligence”, in Stephen Muggleton and Nicholas Chater (eds.), Human-Like Machine Intelligence, Oxford University Press, 2021, ch. 1 (author's manuscript, University of California, Berkeley)"
  sourceUrl: https://www.cs.umd.edu/users/gasarch/BLOGPAPERS/moral.pdf
  thread: warnings
  isms: [ai-safety]
  themes: [alignment]
  status: checked

- id: 1959-samuel-checkers
  era: birth
  year: 1959
  title: Samuel's program outplays its maker
  line: An IBM program learns to play checkers better than the man who wrote it.
  who: Arthur Samuel, IBM
  text: |
    Samuel, a former engineering professor who joined IBM in 1949, had written checkers programs for its computers since 1952, to explore how machines learn. His program looked a few moves ahead and scored each position by features such as piece advantage and mobility. It learned by adjusting how much each feature counted, and by remembering positions it had already scored.

    In 1959 he reported that after 8 or 10 hours of play, his program on the IBM 704 played better checkers than he did. The paper's title, Some Studies in Machine Learning, is often credited with coining the term. In 1962 the program beat Robert Nealey, a checkers master from Connecticut; in 1965 it lost all eight games to two world-title contenders.
  source: "Arthur L. Samuel, “Some Studies in Machine Learning Using the Game of Checkers”, IBM Journal of Research and Development 3 (3), July 1959; Nils J. Nilsson, The Quest for Artificial Intelligence, Cambridge University Press, 2010, ch. 5; Gil Press, “Inventing Machine Learning”, 1 April 2025"
  sourceUrl: https://people.csail.mit.edu/brooks/idocs/Samuel.pdf
