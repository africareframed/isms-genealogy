- id: 2023-llama
  era: generative
  year: 2023
  month: 2
  title: Meta's Llama and open weights
  line: Meta's LLaMA leaks online, and Llama 2 is released with its weights.
  who: Meta
  text: On 24 February 2023 Meta announced LLaMA, large language models of up to 65 billion parameters, for approved researchers only. Within two weeks the full model had leaked, after instructions for downloading it were posted on 4chan. In July Meta released Llama 2 free for research and commercial use, with its weights. Meta argued that openness made models safer, because developers could stress-test them.
  source: "Meta AI, “Introducing LLaMA: A foundational, 65-billion-parameter large language model”, 24 February 2023; Katyanna Quach, “LLaMA drama as Meta's mega language model leaks”, The Register, 8 March 2023; Meta, “Meta and Microsoft Introduce the Next Generation of Llama”, 18 July 2023"
