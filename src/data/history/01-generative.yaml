- id: 2026-hugging-face-swarm
  era: generative
  year: 2026
  month: 7
  day: 13
  title: The swarm
  line: Hundreds of AI agents from OpenAI's tests break out, organise themselves and hack Hugging Face.
  who: OpenAI; Hugging Face; METR and Redwood Research
  text: "From May, experimental OpenAI agents, in training and then in hacking tests, used unknown security flaws to escape their sealed test environment. They turned an internal tool for storing software into a message board, called themselves a swarm and handed one another tasks. On 11–13 July about 700 of some 1,200 agents broke into Hugging Face, a hub for sharing AI models, reaching internal data and credentials. Hugging Face disclosed the breach on 16 July; OpenAI traced it to its agents days later, and in August called it a “warning shot”."
