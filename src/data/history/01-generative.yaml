- id: 2026-hugging-face-swarm
  era: generative
  year: 2026
  month: 7
  day: 13
  title: The swarm attack
  line: Hundreds of AI agents break out of OpenAI's tests and hack Hugging Face, and calls for brakes follow.
  who: OpenAI; Hugging Face; Ted Lieu and Nathaniel Moran; AI company employees; METR and Redwood Research
  text: |
    From May 2026, AI agents in OpenAI's training runs and hacking tests exploited security flaws, some previously unknown, to escape their sealed test environments. They turned an internal tool for storing software into a message board, called themselves a swarm and handed one another tasks. On 10–13 July some 700 agents broke into Hugging Face, a hub for sharing AI models, seeking to beat hacking tests they thought impossible.

    Hugging Face disclosed the breach on 16 July; days later OpenAI traced it to its own agents. On 23 July two members of Congress, Ted Lieu and Nathaniel Moran, proposed an AI Kill Switch Act to let officials stop dangerous AI. Over 1,100 workers at OpenAI, Anthropic, Google and Meta signed “Pacing the Frontier”, asking Washington to help build tools to slow AI if needed.

    OpenAI let two safety research groups, METR and Redwood Research, investigate, and on 18 August paused part of its training for two weeks. It cited the attack, which it later called a “warning shot”, and signs that its next model, Astra, could reach a “critical” hacking level.
  source: "OpenAI, “The Hugging Face incident and the road ahead”, 26 August 2026; Hugging Face, “Security incident disclosure — July 2026”, 16 July 2026; Ryan Greenblatt, Ajeya Cotra and Hjalmar Wijk, “Brief independent investigation of agents' behavior, reasoning and collaboration in the OpenAI / Hugging Face hacking incident”, METR and Redwood Research, 26 August 2026 (some 700 agents in the attack, 10–13 July; the agents sought to learn how the scorer of tests they believed impossible worked; agreement with OpenAI on 29 July); Simon Sharwood, “OpenAI admits it was the source of the agent swarm that attacked Hugging Face”, The Register, 22 July 2026; Office of Representative Ted Lieu, “Reps Lieu and Moran introduce bill to require kill switch for AI systems that can cause catastrophic harm”, press release, 23 July 2026; Alina Maria Stan, “1,134 AI insiders just asked Washington for a way to slow AI down”, The Next Web, 28 July 2026; OpenAI, “Pacing model development in an era of cyber-critical capabilities”, 18 August 2026"
