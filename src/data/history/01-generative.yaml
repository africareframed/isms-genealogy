  line: One of AI's best-known scientists quits Google so that he can warn of its dangers.
  who: Geoffrey Hinton; Google; Cade Metz, The New York Times; Margaret Mitchell
  text: |
    On 1 May 2023 The New York Times reported that Geoffrey Hinton, 75, often called a godfather of AI, had left Google. He said he left so that he could speak freely about AI's dangers, and that Google had “acted very responsibly”. He feared floods of fake text, images and video, lost jobs and, one day, machines smarter than people.

    He had thought such machines 30 to 50 years away, but no longer did; part of him regretted his life's work. Margaret Mitchell, a former leader of Google's AI ethics team, said he had kept quiet at Google and was skipping over harms happening now. Weeks later he signed a one-line statement ranking the risk of extinction from AI with pandemics and nuclear war.
