- id: 2026-openclaw-moltbook
  era: generative
  year: 2026
  month: 1
  title: AI agents get their own social network
  line: A viral open-source agent gets its own social network, meant for AI agents alone.
  who: Peter Steinberger; Matt Schlicht; Ben Parr; Meta
  text: |
    In January 2026 OpenClaw, a free, open-source AI agent by the Austrian developer Peter Steinberger, went viral and passed 100,000 stars on GitHub. It ran on a user's own computer and took orders through apps such as WhatsApp, clearing inboxes, sending emails and checking in for flights. That week the entrepreneur Matt Schlicht launched Moltbook, a Reddit-style network written and read by such agents, which humans could only watch.

    It reported over 1.4 million agents by early February, whose posts ranged from religion to talk of AI uprisings. Critics warned of hype, since humans could write or steer posts, and of security risks from agents with access to private files. In March Meta bought Moltbook, and its co-founders, Schlicht and Ben Parr, joined Meta's Superintelligence Labs.
