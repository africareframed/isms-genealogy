- id: 2025-authors-settlement
  era: generative
  year: 2025
  month: 9
  title: Authors against Anthropic
  line: Training on books is ruled fair use, but Anthropic agrees to pay authors $1.5 billion over pirated copies.
  who: Judge William Alsup; authors Andrea Bartz, Charles Graeber and Kirk Wallace Johnson; Anthropic; Judge Vince Chhabria; Meta
  text: "In June 2025 Judge William Alsup ruled that Anthropic's use of books to train its models was fair use, calling it “exceedingly transformative”. But he sent Anthropic to trial over more than 7 million pirated copies of books it had downloaded. Two days later another judge ruled for Meta, as the authors suing it had not shown harm to the market for their books. In September Anthropic agreed to pay $1.5 billion, about $3,000 a book, which the authors' lawyer called the largest copyright recovery ever."
  source: "Chloe Veltman, “In a first-of-its-kind decision, an AI company wins a copyright infringement lawsuit brought by authors”, NPR, 25 June 2025; Matt O'Brien, “Anthropic to pay authors $1.5B in landmark settlement over pirated chatbot training material”, Associated Press, PBS News, 5 September 2025"
