- id: 2026-magnifica-humanitas
  era: generative
  year: 2026
  month: 5
  title: The Pope issues an encyclical on AI
  line: Pope Leo XIV's first encyclical asks that AI serve humanity, not concentrate power.
  who: Pope Leo XIV; Christopher Olah
  text: |
    Leo XIV, Robert Prevost of Chicago, became the first American pope in May 2025, and soon called AI humanity's biggest challenge. He took his name from Leo XIII, whose Rerum Novarum of 1891 defended workers' rights in the Industrial Revolution. Rerum Novarum was an encyclical, one of the most authoritative teaching letters a pope can issue.

    Leo signed his own first encyclical, Magnifica Humanitas, on Rerum Novarum's 135th anniversary, 15 May 2026, and published it on 25 May. It asks that AI serve the common good, not profit or a powerful few, and calls for robust regulation. Presenting it, the Pope said AI must be “disarmed”; Christopher Olah, a co-founder of Anthropic, also spoke and welcomed his criticism.
