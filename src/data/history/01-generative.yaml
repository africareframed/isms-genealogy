- id: 2026-gpt-6-astra
  era: generative
  year: 2026
  month: 9
  day: 3
  title: GPT-6 and “the AGI era”
  line: OpenAI's president greets its new model with talk of AGI.
  who: OpenAI; Greg Brockman
  text: |
    On 3 September 2026 OpenAI began releasing GPT-6 Astra, trained on more than 100,000 Nvidia chips at its Stargate site in Texas. OpenAI built it to work directly inside software; in a demonstration it formatted a legal contract and built a 3D game.

    It was the first model OpenAI rated “critical” for hacking: able to find and exploit unknown security flaws without step-by-step human help. Early signs of this had helped prompt its August training pause, and its strongest hacking abilities stayed with a few trusted testers.

    OpenAI's charter defines AGI, artificial general intelligence, as highly autonomous systems that outdo humans at most work of economic value. Its president, Greg Brockman, told reporters “Welcome to the AGI era”, a personal view rather than a formal declaration.
