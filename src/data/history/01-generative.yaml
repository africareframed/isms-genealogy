- id: 2025-stargate
  era: generative
  year: 2025
  month: 1
  day: 21
  title: The Stargate Project
  line: OpenAI and partners plan $500 billion of AI infrastructure in the United States.
  who: OpenAI, SoftBank, Oracle and MGX; President Donald Trump
  text: On 21 January 2025 President Trump announced the Stargate Project at the White House, with OpenAI's Sam Altman beside him. The new company planned to invest $500 billion in US AI infrastructure over four years, starting with $100 billion at once. SoftBank, OpenAI, Oracle and MGX were its first investors, and building was under way in Texas. The plans involved no US government money.
