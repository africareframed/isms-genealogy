    On 1 and 2 November 2023 Rishi Sunak's government hosted an AI Safety Summit at Bletchley Park. In the Second World War, British codebreakers there, Alan Turing among them, broke Germany's Enigma cipher.

    Twenty-eight countries and the European Union, the United States and China among them, agreed the Bletchley Declaration. It warned that frontier AI, the most capable general-purpose models, could cause “serious, even catastrophic, harm”. It named risks from deliberate misuse and from losing control of such systems.

