- id: 2026-anthropic-ipo
  era: generative
  year: 2026
  month: 11
  day: 19
  title: Anthropic goes public
  line: The maker of Claude lists on the Nasdaq in the largest IPO on record.
  who: Anthropic; Dario and Daniela Amodei
  text: |
    On 19 November 2026 Anthropic, the maker of Claude, began trading on the Nasdaq under the ticker ANT, after pricing its shares at $83. Former OpenAI leaders had founded it in 2021; two of them, the siblings Dario and Daniela Amodei, rang the opening bell. Selling shares to the public for the first time raised about $81 billion, more than SpaceX's $75 billion in June, the previous record.

    Bloomberg counted $107.3 billion, adding $26 billion that firms such as Google, Nvidia and Microsoft paid privately at the same price. Shares opened at $111.50, valuing the company at about $2 trillion; OpenAI, its main rival, had not yet gone public. Outside, in Times Square, protesters called for a freeze on AI and no bailout for Big Tech when its bubble burst.
