- id: 2025-ai-2027
  era: generative
  year: 2025
  month: 4
  day: 3
  title: AI 2027
  line: A detailed scenario imagines AI overtaking humans by the end of 2027, and millions read it.
  who: Daniel Kokotajlo, Scott Alexander, Thomas Larsen, Eli Lifland and Romeo Dean; AI Futures Project; JD Vance; Gary Marcus
  text: |
    On 3 April 2025 the AI Futures Project, a non-profit in Berkeley, California, published AI 2027. The project's leader, Daniel Kokotajlo, had quit OpenAI over concerns that it was acting recklessly. The blogger Scott Alexander turned the team's forecast into a story.

    In it a fictional lab, OpenBrain, builds AI agents that speed up their own research and reach superintelligence around the end of 2027. Readers choose an ending: a race with China in which AI destroys humanity, or a slowdown that keeps humans in control. It was read by millions; in May 2025 Vice President JD Vance told the columnist Ross Douthat that he had read it.

    Gary Marcus, an emeritus professor of neuroscience at New York University, called it “a work of fiction, not a work of science”. At the end of 2025 Kokotajlo pushed his forecast for fully automated coding back to about 2030; in April 2026, to mid-2028.
  source: "Daniel Kokotajlo, Scott Alexander, Thomas Larsen, Eli Lifland and Romeo Dean, “AI 2027”, AI Futures Project, ai-2027.com, 3 April 2025 (the two endings; Scott Alexander's role); Kevin Roose, “This A.I. Forecast Predicts Storms Ahead”, The New York Times, 3 April 2025, as reprinted by The Star (Malaysia), 7 April 2025 (Berkeley non-profit led by Kokotajlo; why he left OpenAI); 80,000 Hours, “AI 2027's author returns with a plan to change the ending | Daniel Kokotajlo”, interview by Luisa Rodriguez and Elizabeth Cox, 27 August 2026 (read by millions); Zvi Mowshowitz, “AI #117: OpenAI Buys Device Maker IO”, LessWrong, 22 May 2025 (quoting Vance's interview with Ross Douthat of 21 May 2025: he had read it); Gary Marcus, “The ‘AI 2027’ Scenario: How realistic is it?”, Marcus on AI, 22 May 2025; Aisha Down, “AI expert delays timeline for its possible destruction of humanity”, The Guardian, as reprinted by the Irish Examiner, 6 January 2026 (Marcus's post and title); Eli Lifland, Brendan Halstead, Alex Kastner and Daniel Kokotajlo, “AI Futures Timelines and Takeoff Model: Dec 2025 Update”, LessWrong, 31 December 2025 (Kokotajlo's automated-coder median, 2030); Daniel Kokotajlo, Eli Lifland and Brendan Halstead, “Q1 2026 Timelines Update”, LessWrong, 2 April 2026 (moved to mid-2028)"
