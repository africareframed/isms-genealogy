  line: In the war in Ukraine, AI begins to steer drones to their targets, and some now choose a target on their own.
  who: Ukraine and Russia; Ukraine's Ministry of Defence; Kateryna Bondar, CSIS
  text: "In 2024 Ukraine began buying 10,000 AI-enhanced drones, a fraction of the nearly 2 million it ordered that year, CSIS reported. Such drones can stay on target if the pilot's signal is jammed; Ukrainian sources told CSIS they lift hit rates from 10–20% to 70–80%. On 6 July 2026 a self-targeting Russian drone killed three civilians in Zaporizhzhia, which CSIS's Kateryna Bondar said would be the first documented case. In August 2026 Ukraine's defence ministry said over 70 AI systems were striking targets, and aimed to fit AI to every front-line drone."
