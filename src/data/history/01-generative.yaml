  text: Microsoft published a Humanist AI code of conduct for its own models and put it to a six-week public consultation. It says people must keep meaningful control, and that models should stay subordinate and never set their own goals. It rejects the race to an all-purpose superintelligence, and Microsoft plans to use the revised code to guide model development from 2027.
