  title: The Riemann hypothesis
  line: An Anthropic mathematician releases a computer-checked proof of one of mathematics' most famous open problems.
  who: Levent Alpöge; Claude; the Lean and Mathlib communities; Alex Kontorovich; the Clay Mathematics Institute
  text: "Posed in 1859, the Riemann hypothesis concerns how the prime numbers are spread out, and is another of the Millennium Prize problems. On 20 November, a day after Anthropic went public, its mathematician Levent Alpöge released a proof made with Claude: 17 million lines of Lean. The Lean and Mathlib communities, who maintain that proof-checking software and its library, certified the statement and the proof next day. The Rutgers mathematician Alex Kontorovich asked himself whether he understood it and answered “Not yet”; the Clay Institute said assessment takes time."
  source: "Lean and Mathlib communities, “Lean verification of the Riemann Hypothesis”, joint statement endorsed by the Lean FRO and the Mathlib Initiative, Lean community blog, 21 November 2026; Associated Press, “Anthropic worker claims to have solved a Holy Grail of math problems with the help of AI”, KCRA, 21 November 2026 (Kontorovich; Martin Bridson, president of the Clay Mathematics Institute)"
