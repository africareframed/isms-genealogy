- id: 2025-deepseek-r1
  era: generative
  year: 2025
  month: 1
  title: DeepSeek-R1
  line: A Chinese lab gives away a reasoning model, and Nvidia's shares fall 17%.
  who: DeepSeek
  text: On 20 January 2025 the Chinese company DeepSeek released R1, a reasoning model it said performed on par with OpenAI's o1. Its weights were free to download and adapt under the MIT licence. Its paper reported that strong reasoning emerged in a sibling model, R1-Zero, trained by reinforcement learning without first studying labelled examples. A week later Nvidia's shares fell 16.9% in one trading day, losing nearly $600 billion in market value.
  source: "DeepSeek, “DeepSeek-R1 Release”, DeepSeek API Docs, 20 January 2025; DeepSeek-AI, “DeepSeek-R1: Incentivizing Reasoning Capability in LLMs via Reinforcement Learning”, arXiv:2501.12948, 22 January 2025; Rebecca Szkutak, “Nvidia drops $600B off its market cap amid the rise of DeepSeek”, TechCrunch, 27 January 2025"
  sourceUrl: https://api-docs.deepseek.com/news/news250120
  isms: []
  themes: [compute]
  thread: compute
  status: checked

- id: 2024-nobel-prizes
  era: generative
  year: 2024
  month: 10
  title: Two Nobel prizes for AI
  line: Neural-network pioneers and AlphaFold's makers win Nobel prizes in physics and chemistry.
  who: John Hopfield, Geoffrey Hinton, Demis Hassabis, John Jumper
  text: On 8 October 2024 the Nobel Prize in Physics went to John Hopfield and Geoffrey Hinton. The Royal Swedish Academy of Sciences cited foundational discoveries that enable machine learning with artificial neural networks. The next day Demis Hassabis and John Jumper shared half the chemistry prize, for predicting protein structures with AlphaFold. David Baker won the other half, for computational protein design.
  source: The Royal Swedish Academy of Sciences, “The Nobel Prize in Physics 2024”, press release, 8 October 2024; Meghan Rosen and Andrea Tamayo, “Work on protein structure and design wins the 2024 chemistry Nobel”, Science News, 9 October 2024
  sourceUrl: https://www.nobelprize.org/prizes/physics/2024/press-release/
