  title: Mathematicians push back
  line: Fields medallists warn that answers without understanding harm mathematics, and many speak of grief.
  who: Terence Tao and other Fields medallists; OpenAI; the Association for Human Mathematics; Hugo Duminil-Copin
  text: "On 11 September, 25 Fields medallists, Terence Tao among them, warned that AI companies' race for answers was harming a field built on understanding. On 5 October Quanta Magazine found mathematicians facing the change with grief, anger and a search for fresh ideas. When OpenAI released more than 370 AI-made results the next day, the Association for Human Mathematics urged mathematicians to stop working with OpenAI. The Fields medallist Hugo Duminil-Copin wrote on a mathematics blog: “I am paralysed.”"
