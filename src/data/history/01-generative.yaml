- id: 2026-navier-stokes
  era: generative
  year: 2026
  month: 9
  day: 8
  title: AI takes on the Millennium Prize problems
  line: OpenAI, then an Anthropic mathematician, claim two of mathematics' seven $1 million problems, and many mathematicians push back.
  who: Clay Mathematics Institute; OpenAI; Tristan Buckmaster; Levent Alpöge; Fields medallists; the Association for Human Mathematics; Hugo Duminil-Copin; Claude; the Lean and Mathlib communities; Alex Kontorovich
  text: |
    In 2000 the Clay Mathematics Institute named seven Millennium Prize problems, offering $1 million for each; only one had since been solved. On 8 September OpenAI said some 10,000 AI agents had settled another: Navier–Stokes, whose equations for flowing water and air can predict infinite speeds. The mathematician Tristan Buckmaster asked whether OpenAI had drawn on his work with Levent Alpöge of Anthropic; OpenAI denied using their prompts or proofs.

    On 11 September the Clay Institute said Navier–Stokes had “apparently been settled”; 25 Fields medallists warned that AI firms' race for solutions harmed mathematics. When OpenAI released over 370 solutions in October, the Association for Human Mathematics urged a boycott; another medallist, Hugo Duminil-Copin, wrote: “I am paralysed.”

    On 20 November Alpöge released a proof, made with Claude, of another: the Riemann hypothesis of 1859, on how prime numbers are spread. It filled 17 million lines of Lean, a language for computer-checked proofs; the Lean and Mathlib communities certified it next day. The Rutgers mathematician Alex Kontorovich asked himself if he understood it and answered “Not yet”; the Clay Institute said assessment takes time.
  source: "Clay Mathematics Institute, “The Millennium Prize Problems”, claymath.org (seven problems, $1 million each, the Poincaré conjecture solved); Konstantin Kakaes, “AI Has Solved One of Math's $1 Million Millennium Prize Problems”, Quanta Magazine, 8 September 2026 (10,000 agents; a tiny part of a fluid flowing infinitely quickly); Axios, “OpenAI's historic math solution overshadowed by credit controversy”, 8 September 2026 (Buckmaster's questions; Alpöge at Anthropic); NPR, “AI solved one of math's hardest problems. Humanity learned nothing (so far)”, 22 September 2026 (OpenAI denied using their prompts or proofs); Clay Mathematics Institute, “Navier-Stokes Announcement”, claymath.org news, 11 September 2026; “A Severe Misalignment of AI in Mathematics”, statement by Fields medallists, mathandai.org, 11 September 2026 (28 signatories listed by November); Scientific American, “25 winners of math's ‘Nobel Prize’ decry the AI invasion of their discipline”, September 2026 (25 at release); Jeremy Kahn, “OpenAI publishes solutions to more than 370 outstanding math challenges”, Fortune, 7 October 2026, updated 8 October; Association for Human Mathematics, “AHM Statement on OpenAI's October 6 Release of Mathematical Documents”, published on its statements page, ahmath.org/statements, and reposted as a guest post on Terence Tao's blog What's new, 7 October 2026; Quanta Magazine, “Transformation”, weekly updates on mathematics and AI, September to November 2026 (the AHM's call to boycott OpenAI; Alpöge's paper on working with Claude); “100+ reactions to 100+ solutions”, Proofs and Prompts, 8 October 2026 (Duminil-Copin); Lean and Mathlib communities, “Lean verification of the Riemann Hypothesis”, joint statement endorsed by the Lean FRO and the Mathlib Initiative, Lean community blog, 21 November 2026; Associated Press, “Anthropic worker claims to have solved a Holy Grail of math problems with the help of AI”, KCRA, 21 November 2026, also in The Boston Globe (Lean; Kontorovich; Martin Bridson, president of the Clay Mathematics Institute)"
