    On 28 February 2026 the United States and Israel attacked Iran; US forces hit over 1,000 targets in a day, their top general said. Central Command's commander, Admiral Brad Cooper, said AI tools turned work that took hours or days into seconds, with humans making final decisions. In May he told the US Senate that 38 days of major combat had brought over 13,500 strikes.

