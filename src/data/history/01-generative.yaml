- id: 2026-anthropic-pentagon
  era: generative
  year: 2026
  month: 3
  title: Anthropic and the Pentagon
  line: A lab refuses two military uses, and the Pentagon labels it a supply-chain risk.
  who: Anthropic; Pete Hegseth, US defence secretary; OpenAI
  text: "In early 2026 the Pentagon sought any lawful use of AI models, but Anthropic ruled out mass surveillance of Americans and fully autonomous weapons. On 27 February the defence secretary, Pete Hegseth, moved to label it a supply-chain risk, a tag usually kept for foreign adversaries. Within hours OpenAI announced its own deal with the Pentagon, and the designation was made official on 5 March. Anthropic sued: in August a federal judge ruled the designation unlawful, but in September an appeals court upheld a parallel one."
  source: "Axios, “Trump blacklists Anthropic: Here's what being a ‘supply chain risk’ means”, 27 February 2026; NPR, “OpenAI announces Pentagon deal after Trump bans Anthropic”, 27 February 2026; NPR, “Pentagon labels AI company Anthropic a supply chain risk”, March 2026; Rebecca Bellan, “It's official: The Pentagon has labeled Anthropic a supply-chain risk”, TechCrunch, 5 March 2026; Associated Press, “Judge says Pentagon's measures against Anthropic were ‘illegal and baseless’”, PBS News, 28 August 2026; Axios, “Judge blocks Pentagon's Anthropic blacklist”, 28 August 2026; Al Jazeera, “US court upholds Pentagon's blacklisting of Anthropic”, 25 September 2026"
  sourceUrl: https://www.npr.org/2026/03/06/g-s1-112713/pentagon-labels-ai-company-anthropic-a-supply-chain-risk
