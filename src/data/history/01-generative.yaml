- id: 2026-humanist-ai-code
  era: generative
  year: 2026
  month: 9
  title: Humanist AI
  line: Microsoft sets out rules to keep its own models under human control.
  who: Microsoft AI; Mustafa Suleyman
  text: Microsoft published a Humanist AI code of conduct for its own models and put it to a six-week public consultation. It says people must keep meaningful control, and that models should stay subordinate and never set their own goals. It rejects the race to an all-purpose superintelligence, and Microsoft plans to use the revised code to guide model development from 2027.
  source: "Axios, “Microsoft: ‘People matter more than AI’”, 14 September 2026"
  sourceUrl: https://axios.com/2026/09/14/microsoft-ai-people-code
  isms: [rationalism]
  themes: [alignment]
  thread: warnings
  status: checked

- id: 2026-gpt-6-astra
  era: generative
  year: 2026
  month: 9
  title: GPT-6 and “the AGI era”
  line: OpenAI's president greets its new model with talk of AGI.
  who: OpenAI; Greg Brockman
  text: On 3 September 2026 OpenAI began releasing GPT-6 Astra, first to selected organisations. It was trained on more than 100,000 GPUs at OpenAI's Stargate site in Texas. OpenAI had slowed the release for extra safety tests, after finding that its cyber skills could reach the “critical” level of its own framework. Its president, Greg Brockman, told reporters “Welcome to the AGI era”, a personal view rather than a formal declaration.
  source: Axios, “‘Welcome to the AGI era,’ OpenAI says as GPT-6 Astra debuts”, 3 September 2026; Camila Nogueira, “OpenAI launches GPT-6 Astra, claims AGI era has begun”, BetaNews, September 2026; Jess Kinghorn, “Jensen Huang says 100,000 Nvidia GPUs were used to train OpenAI's latest model, GPT-6 Astra …”, PC Gamer, 7 September 2026
  sourceUrl: https://axios.com/2026/09/03/openai-astra-gpt-6-agi-brockman
  isms: []
