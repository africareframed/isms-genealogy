  text: On 1 and 2 November 2023 the British government hosted an AI Safety Summit at Bletchley Park. Twenty-eight countries and the European Union, the United States and China among them, agreed the Bletchley Declaration. It warned of the potential for “serious, even catastrophic, harm” from the most capable frontier models. They pledged to support shared research on frontier AI safety, and to meet again in 2024.
  source: UK Government, “The Bletchley Declaration by Countries Attending the AI Safety Summit, 1-2 November 2023”, GOV.UK, 1 November 2023
  sourceUrl: https://www.gov.uk/government/publications/ai-safety-summit-2023-the-bletchley-declaration/the-bletchley-declaration-by-countries-attending-the-ai-safety-summit-1-2-november-2023
