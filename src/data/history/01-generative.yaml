  text: |
    On 25 September 2026, during a state visit by China's president, Xi Jinping, the White House announced a US–China Super Intelligence Dialogue. It would cover the technology's risks and benefits, with a channel for incidents that the US had proposed for threats to national security. The two countries had first held talks on AI risks in Geneva in May 2024.

