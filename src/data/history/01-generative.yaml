  status: checked

- id: 2024-o1-reasoning
  era: generative
  year: 2024
  month: 9
  title: OpenAI's o1 reasoning model
  line: A model trained to think at length before it answers.
  who: OpenAI
  text: On 12 September 2024 OpenAI presented o1, a model trained by reinforcement learning to work through a long chain of thought before answering. Along the way it learns to catch and correct its own mistakes. OpenAI reported that it improved with more training and with more time spent thinking. It ranked in the 89th percentile on Codeforces programming contests.
  source: OpenAI, “Learning to Reason with LLMs”, openai.com, 12 September 2024
  sourceUrl: https://openai.com/index/learning-to-reason-with-llms/
