  text: |
    Three authors sued Anthropic, the maker of the Claude chatbot, for training its models on their books without permission. On 23 June 2025 Judge William Alsup ruled that this was fair use, an American doctrine allowing some uses of copyrighted work without consent. He called the training “exceedingly transformative”, but sent Anthropic to trial over more than 7 million pirated copies of books it had downloaded.

    Two days later another judge ruled for Meta, as the authors suing it had not shown harm to the market for their books. In September Anthropic agreed to pay $1.5 billion, about $3,000 for each of some 500,000 books. The authors' lawyer called it the largest copyright recovery ever.
