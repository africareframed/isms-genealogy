- id: 2023-us-executive-order
  era: generative
  year: 2023
  month: 10
  title: Biden's executive order on AI
  line: The White House requires developers of the largest models to report to the government.
  who: President Joe Biden; revoked by President Donald Trump
  text: On 30 October 2023 President Biden signed Executive Order 14110, on the safe, secure and trustworthy development of AI. Under the Defense Production Act, developers of the most powerful models had to report their training and red-team test results. The threshold was training with more than 10²⁶ operations. President Trump revoked the order on 20 January 2025.
  source: Executive Order 14110, “Safe, Secure, and Trustworthy Development and Use of Artificial Intelligence”, 30 October 2023, Federal Register 88 FR 75191, 1 November 2023, revoked by Executive Order 14148, 20 January 2025
