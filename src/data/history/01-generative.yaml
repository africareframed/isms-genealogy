  text: |
    On 8 October 2024 John Hopfield and Geoffrey Hinton won the Nobel Prize in Physics, for discoveries that enable machine learning with neural networks. Hopfield's network, drawing on the physics of magnetic atoms, could store patterns and rebuild them from distorted copies. Hinton built on it with the Boltzmann machine, which finds properties in data and can generate new examples.

    The next day Demis Hassabis and John Jumper of Google DeepMind shared half the chemistry prize, for predicting protein structures with AlphaFold. Their model has predicted the shapes of almost all the 200 million proteins known to science, the building blocks of life. David Baker won the other half, for designing new proteins by computer, including ones not found in nature.
