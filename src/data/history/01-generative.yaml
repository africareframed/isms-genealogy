  title: Anthropic and the Pentagon
  line: A lab refuses two military uses, and the Pentagon labels it a supply-chain risk.
  who: Anthropic; Pete Hegseth, US defence secretary; OpenAI
  text: "In early 2026 the Pentagon sought any lawful use of AI models, but Anthropic ruled out mass surveillance of Americans and fully autonomous weapons. On 27 February the defence secretary, Pete Hegseth, moved to label it a supply-chain risk, a tag usually kept for foreign adversaries. Within hours OpenAI announced its own deal with the Pentagon, and the designation was made official on 5 March. Anthropic sued: in August a federal judge ruled the designation unlawful, but in September an appeals court upheld a parallel one."
