  text: |
    On 30 October 2023 President Biden signed Executive Order 14110, on the safe, secure and trustworthy development of AI. Congress was still early in debating safeguards, and Biden said AI was driving change at “warp speed”.

    Under the Defense Production Act, developers of the most powerful models had to report their training and red-team test results. Red-teaming is a structured effort to find flaws and weaknesses in an AI system. The threshold was training with more than 10²⁶ operations, a hundred million billion billion calculations.

