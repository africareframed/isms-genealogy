- id: 2026-ai-mathematics
  era: generative
  year: 2026
  month: 11
  day: 20
  title: Machines that do mathematics
  line: AI helps settle open problems in mathematics, up to a machine-checked proof of the Riemann hypothesis.
  who: Levent Alpöge; Anthropic; OpenAI; Alex Kontorovich; the Lean and Mathlib communities
  text: "In July 2026 Levent Alpöge, an Anthropic mathematician working with Claude Fable 5, disproved the Jacobian conjecture, open since 1939. In October OpenAI released hundreds of results on open problems, among them a proof of the quasi-Riemann hypothesis, a weaker form. On 20 November, a day after Anthropic listed, Alpöge released a proof of the Riemann hypothesis made with Claude: 17 million lines of Lean. The Lean and Mathlib communities certified the formal proof next day; the Rutgers mathematician Alex Kontorovich asked himself if he understood it: “Not yet.”"
  source: "Eva Roytburg, “Mathematicians grapple with a ‘very rapid and very unsettling change’ as AI cracks yet another century-old problem”, Fortune, 21 July 2026; OpenAI, “Sharing AI progress in mathematics”, 6 October 2026; Konstantin Kakaes, “AI Proved the Quasi-Riemann Hypothesis. What Happens Now?”, Quanta Magazine, 19 October 2026; Associated Press, “Anthropic worker claims to have solved a Holy Grail of math problems with the help of AI”, KCRA, 21 November 2026; the Lean and Mathlib communities, “Lean verification of the Riemann Hypothesis”, joint statement endorsed by the Lean FRO and the Mathlib Initiative, Lean community blog, 21 November 2026"
  sourceUrl: https://leanprover-community.github.io/blog/posts/riemann-hypothesis/
