- id: 2023-pause-letter
  era: generative
  year: 2023
  month: 3
  title: The pause letter
  line: An open letter asks AI labs to pause their biggest training runs.
  who: Future of Life Institute
  text: The Future of Life Institute asked all AI labs to pause, for at least six months, the training of systems more powerful than GPT-4. If they did not, governments should step in with a moratorium. Labs and outside experts would use the time to agree shared safety protocols. Elon Musk was among the early signers, and the letter has since gathered more than 31,000 signatures.
  source: "Future of Life Institute, “Pause Giant AI Experiments: An Open Letter”, 22 March 2023"
  sourceUrl: https://futureoflife.org/open-letter/pause-giant-ai-experiments/
  isms: [rationalism]
  themes: []
