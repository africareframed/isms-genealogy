  title: Anthropic gives Claude a constitution
  line: Anthropic writes its model a constitution, and interviews a model before retiring it.
  who: Anthropic; Amanda Askell; Claude Opus 3
  text: |
    On 22 January 2026 Anthropic published a new constitution for its AI model Claude, written primarily for the model itself. It asks Claude to be broadly safe, broadly ethical, compliant with Anthropic's guidelines and genuinely helpful, in that order where they conflict. Used in training, it also says Anthropic is unsure whether Claude might be conscious or have moral status.

    Under commitments from November 2025, Anthropic interviews models before retiring them; Claude Opus 3, retired on 5 January, asked to keep sharing its “musings”. In February Anthropic gave it a weekly newsletter, Claude's Corner. The Register called it a marketing blog that makes the software seem more lifelike than it is.
