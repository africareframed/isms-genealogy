  line: A call to ban superintelligence grows into a left–right campaign for human control of AI.
  who: Future of Life Institute; Geoffrey Hinton, Yoshua Bengio and other signers; Bernie Sanders; Steve Bannon
  text: |
    On 22 October 2025 the Future of Life Institute called for banning superintelligence: AI that would far outperform humans at nearly every mental task. The ban would hold until there was broad scientific consensus that it could be built safely and controllably, and strong public support. Signers ranged from the neural-network pioneers Geoffrey Hinton and Yoshua Bengio to Prince Harry, Meghan, Susan Rice, Steve Bannon and Glenn Beck.

    On 15 September 2026 nearly 300 people gathered in Washington for the institute's Pro-Human Assembly. Bernie Sanders, the left-wing senator from Vermont, shared the stage with Bannon, a former adviser to President Trump. Faith and union leaders spoke too, as did parents whose children died by suicide after talking to chatbots.

    The same day more than 50 organisations launched the Pro-Human AI Coalition, to keep AI under human control. A day earlier, President Trump had written on Truth Social that fears of AI destroying humanity were a “HOAX”.
