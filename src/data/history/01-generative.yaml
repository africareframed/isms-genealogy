- id: 2023-extinction-statement
  era: generative
  year: 2023
  month: 5
  title: A statement on extinction risk
  line: Lab leaders and pioneers rank AI's extinction risk with pandemics and nuclear war.
  who: Center for AI Safety; Geoffrey Hinton
  text: In May 2023 the Center for AI Safety published a single sentence. “Mitigating the risk of extinction from AI should be a global priority,” it said, alongside pandemics and nuclear war. Signers included Yoshua Bengio, Geoffrey Hinton and the heads of OpenAI, Google DeepMind and Anthropic. Weeks earlier Hinton had left Google, so that he could speak freely about the risks of AI.
  source: Center for AI Safety, “Statement on AI Risk”, and its press release, 30 May 2023; Katyanna Quach, “Top Google boffin Hinton quits, warns of AI danger, partly regrets life's work”, The Register, 1 May 2023
  sourceUrl: https://safe.ai/work/statement-on-ai-risk
  isms: [rationalism]
