  line: OpenAI's GPT-4 takes in images and text and passes a simulated bar exam.
  who: OpenAI
  text: On 14 March 2023 OpenAI released GPT-4, a large multimodal model that accepts images as well as text. It passed a simulated bar exam with a score around the top 10% of test takers. Its technical report withheld the model's size, hardware, training compute and data. It went to paying ChatGPT Plus subscribers and, through a waitlist, to developers.
