- id: 2024-eu-ai-act
  era: generative
  year: 2024
  month: 8
  title: The EU AI Act
  line: Europe's law sorts AI systems by risk and bans some uses outright.
  who: European Union
  text: The European Union's AI Act entered into force on 1 August 2024. It sorts AI systems into four levels of risk, from minimal to unacceptable. Its first bans applied from 2 February 2025, among them social scoring and untargeted scraping of images to build facial-recognition databases. An amendment in force from July 2026 delayed the rules for high-risk systems to December 2027 or August 2028.
  source: European Commission, “AI Act”, Shaping Europe's digital future, digital-strategy.ec.europa.eu (timeline, prohibited practices and the AI Omnibus), consulted November 2026
  sourceUrl: https://digital-strategy.ec.europa.eu/en/policies/regulatory-framework-ai
  isms: []
  themes: [facial-recognition]
  thread: law
  status: checked

- id: 2023-openai-board-crisis
  era: generative
  year: 2023
  month: 11
  title: The OpenAI board crisis
  line: OpenAI's board removes Sam Altman, and within two weeks he is back.
  who: OpenAI's board; Sam Altman
  text: On 17 November 2023 OpenAI's board removed Sam Altman as chief executive, saying he had been “not consistently candid” with it. Nearly all the company's staff threatened to quit and join him at Microsoft unless the directors resigned. By the end of the month Altman was back, under a new board chaired by Bret Taylor. Two departing directors, Helen Toner and Tasha McCauley, had ties to effective altruism.
  source: OpenAI, “OpenAI announces leadership transition”, 17 November 2023; OpenAI, “Sam Altman returns as CEO, OpenAI has a new initial board”, 29 November 2023; Semafor, “The AI industry turns against its favorite philosophy”, 21 November 2023 (staff threat and the two directors' ties to effective altruism)
  sourceUrl: https://openai.com/index/openai-announces-leadership-transition/
  isms: [effective-altruism]
  themes: []
  thread: booms-winters
  status: checked

- id: 2023-bletchley-summit
  era: generative
  year: 2023
  month: 11
  title: The Bletchley Park summit
  line: Twenty-eight countries and the EU agree a declaration on the risks of frontier AI.
  who: UK government; 28 countries and the European Union
  text: On 1 and 2 November 2023 the British government hosted an AI Safety Summit at Bletchley Park. Twenty-eight countries and the European Union, the United States and China among them, agreed the Bletchley Declaration. It warned of the potential for “serious, even catastrophic, harm” from the most capable frontier models. They pledged to support shared research on frontier AI safety, and to meet again in 2024.
  source: UK Government, “The Bletchley Declaration by Countries Attending the AI Safety Summit, 1-2 November 2023”, GOV.UK, 1 November 2023
  sourceUrl: https://www.gov.uk/government/publications/ai-safety-summit-2023-the-bletchley-declaration/the-bletchley-declaration-by-countries-attending-the-ai-safety-summit-1-2-november-2023
  isms: []
