- id: 2022-chip-export-controls
  era: generative
  year: 2022
  month: 10
  title: The chip controls
  line: The United States limits China's access to the advanced chips used to train AI.
  who: US Department of Commerce, Bureau of Industry and Security; Nvidia
  text: "On 7 October 2022 the US Commerce Department restricted China's ability to obtain advanced computing chips, build supercomputers and make advanced semiconductors. It said China used them for advanced military systems and surveillance, and sought to lead the world in AI by 2030. Nvidia then sold Chinese firms the A800 and H800, slower chips with performance just under the limits. In October 2023 Commerce widened the rules to cover them; Secretary Gina Raimondo said the aim was to control access to computing power."
  source: "Bureau of Industry and Security, US Department of Commerce, “Commerce Implements New Export Controls on Advanced Computing and Semiconductor Manufacturing Items to the People's Republic of China (PRC)”, press release, 7 October 2022; William Alan Reinsch, Matthew Schleich and Thibault Denamiel, “Insight into the U.S. Semiconductor Export Controls Update”, Center for Strategic and International Studies, 20 October 2023; Kif Leswing, CNBC, “U.S. curbs export of more AI chips, including Nvidia H800, to China”, NBC News, 18 October 2023"
