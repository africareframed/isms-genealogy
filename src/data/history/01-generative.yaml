- id: 2024-machines-of-loving-grace
  era: generative
  year: 2024
  month: 10
  day: 11
  title: Machines of Loving Grace
  line: The head of the AI company Anthropic imagines what AI could do if all goes well, then writes a sequel on the risks.
  who: Dario Amodei, Anthropic; Jeremy Kahn, Fortune
  text: |
    On 11 October 2024 Dario Amodei, who runs the AI company Anthropic, posted “Machines of Loving Grace”, titled after a 1967 Richard Brautigan poem. In about 15,000 words it pictured millions of AI copies smarter than Nobel winners in most fields: “a country of geniuses in a datacenter”.

    Such AI might come as early as 2026, he wrote, and squeeze 50 to 100 years of progress in biology into five to ten. TechCrunch called such predictions stretches, and noted that Anthropic was raising billions of dollars from investors.

    On 26 January 2026 a 20,000-word sequel, “The Adolescence of Technology”, said such AI might be only one or two years away. It could help make bioweapons, help autocrats tighten control and disrupt half of entry-level office jobs.

    Amodei urged laws making AI companies open about their safety practices, and curbs on selling advanced chips to China. Fortune's Jeremy Kahn did not doubt his sincerity, but called the essay as much “a novella-length marketing message” as a prophecy.
