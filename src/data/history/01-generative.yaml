- id: 2026-anthropic-pentagon
  era: generative
  year: 2026
  month: 2
  day: 27
  title: Anthropic's clash with the Pentagon
  line: A lab refuses two military uses, and the Pentagon labels it a supply-chain risk.
  who: Anthropic; Pete Hegseth, US defence secretary; OpenAI
  text: |
    In early 2026 the Pentagon sought any lawful use of AI models, but Anthropic ruled out mass surveillance of Americans and fully autonomous weapons. Claude was then the only AI model working inside the military's classified systems, under a $200 million contract. On 27 February the defence secretary, Pete Hegseth, moved to label Anthropic a supply-chain risk, a penalty usually kept for firms from adversary countries.

    President Trump ordered federal agencies to stop using Claude, and the Pentagon's partners would have to certify they did not use it. Within hours OpenAI announced its own deal with the Pentagon, and the designation was made official on 5 March. Anthropic sued: in August a federal judge ruled the designation unlawful, but in September an appeals court upheld a parallel one.
