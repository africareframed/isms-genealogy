  title: AI claims a Millennium Prize problem
  line: OpenAI says its AI agents have settled one of mathematics' seven $1 million problems, on how fluids flow.
  who: OpenAI; Tristan Buckmaster; Levent Alpöge; the Clay Mathematics Institute
  text: "In 2000 the Clay Mathematics Institute offered $1 million each for seven of mathematics' hardest problems; only one had since been solved. On 8 September OpenAI said about 10,000 of its AI agents had shown that the Navier–Stokes equations, which describe flowing fluids, can break down. A credit dispute followed: Tristan Buckmaster, who had related results with Levent Alpöge, asked whether OpenAI had drawn on their work; OpenAI denied it. OpenAI said it would not claim the prize; the Clay Institute said the problem had “apparently been settled”, promising an unhurried review."
