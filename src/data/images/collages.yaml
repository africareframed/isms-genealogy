  alt: "A cut-up collage: a Futurist painting of rushing horses in rough black ink over orange fields, with the word e/acc"

- id: collage-techno-optimism
  title: "Collage from a photograph of Hoover Dam under construction (1934)"
  rights: open-licence
  licence: "from a public-domain photograph"
