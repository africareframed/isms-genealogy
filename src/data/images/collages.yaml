# The collage set (20 Nov 2026): one per ism and theme, made in code by scripts/collages.py
# from the archive images listed in each title. No generative model is used.

- id: collage-transhumanism
  title: "Collage from the Flood Tablet, Epic of Gilgamesh (7th century BCE)"
  rights: open-licence
  licence: "CC0, after the British Museum's photograph"
  file: "collage-transhumanism.jpg"
  alt: "The cuneiform Flood Tablet of the Epic of Gilgamesh, the oldest story of a quest for eternal life, over acid-green fields"
  sourceUrl: "https://commons.wikimedia.org/wiki/File:British_Museum_Flood_Tablet.jpg"

- id: collage-singularitarianism
  title: "Collage from a photograph of the IAS machine, von Neumann's computer"
  rights: public-domain
  file: "collage-singularitarianism.jpg"
  alt: "The IAS machine, an early valve computer, over green fields, beside 2045, Kurzweil's date for the Singularity; in 1958 Ulam recalled von Neumann speaking of an essential singularity"
  sourceUrl: "https://commons.wikimedia.org/wiki/File:IAS_machine_at_Smithsonian.jpg"

- id: collage-rationalism
  title: "Collage from an 1893 advertisement for the Gem paper clip"
  rights: public-domain
  file: "collage-rationalism.jpg"
  alt: "A single Gem paper clip, drawn in 1893, over pink fields; the paperclip maximiser thought experiment dates from 2003"
  sourceUrl: "https://commons.wikimedia.org/wiki/File:GemPaperClipAdvertisementJan1893.png"

- id: collage-effective-altruism
  title: "Collage from a photograph of a Thomas de Colmar arithmometer (1860)"
  rights: public-domain
  file: "collage-effective-altruism.jpg"
  alt: "A brass arithmometer of 1860, the first commercially successful calculating machine, in its open wooden case over pink fields, beside 10 to the power 58, Bostrom's 2014 count of possible future lives"
  sourceUrl: "https://commons.wikimedia.org/wiki/File:Arithmometer_1860.JPG"
  note: "Owner, 22 Nov 2026: the bed nets showed EA's charity, not its view of AI, and its labels captioned the object. Photo by MKFI, released into the public domain; the machine is at the Helsinki observatory. 10^58: Bostrom, Superintelligence (2014), the lower bound for human lives if digital minds are counted."

