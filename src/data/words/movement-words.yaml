# Words each movement lists as its own ("Its words") that were not yet in the vocabulary (owner, 23 Nov 2026).
# Same fields as words.yaml; see src/content.config.ts. Grouped by movement, in the home page's order.
# yearLabel "by …" means only an earliest documented use is known; origin says so.
# status: draft until a checker agent has verified every claim against its source.

# Transhumanism

- id: transhuman
  word: transhuman
  definition: A person on the way to becoming posthuman, changed by technology but not yet beyond the human. FM-2030 used it as short for “transitional human”.
  coinedBy: FM-2030 (F. M. Esfandiary), in this sense
  year: 1989
  yearLabel: by 1989
  origin: "FM-2030, Are You a Transhuman? Monitoring and Stimulating Your Personal Rate of Growth in a Rapidly Changing World, Warner Books, 1989. Nick Bostrom, “A History of Transhumanist Thought”, Journal of Evolution and Technology 14(1), April 2005, describes its transhuman as a transitional human. FM-2030 taught at the New School in New York in the 1960s; Wikipedia (“Transhumanism”) dates his use of the word to 1966. Wikipedia (“Transhuman”) traces the term itself to Teilhard de Chardin (1949). Bostrom credits the word transhumanism to Julian Huxley, Religion Without Revelation (1927)."
  sourceUrl: https://jetpress.org/volume14/bostrom.html
  isms: [transhumanism]
  technical: false
  status: checked

- id: posthuman
  word: posthuman
  definition: A possible future being whose abilities so far exceed ours that it is no longer clearly human. Transhumanists see it as where human enhancement could lead.
  year: 1916
  yearLabel: by 1916
  origin: "The Oxford English Dictionary's earliest use, spelled post-human, is in a discussion of eugenics: Maurice Parmelee, Poverty and Social Progress, 1916. Source: Zoe Jaques, “Posthuman”, Keywords for Children's Literature, NYU Press. In the transhumanist sense, Max More's 1990 definition calls transhumanism philosophies that guide us “towards a posthuman condition” (Wikipedia, “Transhumanism”). It comes from his essay “Transhumanism: Towards a Futurist Philosophy”, Extropy 6, 1990 (cited by More in Journal of Evolution and Technology 21(1), 2010). The word also has other senses, as in cultural theory (Wikipedia, “Posthuman”)."
  sourceUrl: https://keywords.nyupress.org/childrens-literature/essay/posthuman/
  isms: [transhumanism]
  technical: false
  status: checked

- id: enhancement
  word: enhancement
  definition: Using technology to raise human abilities beyond what is normal, rather than only to treat illness. Transhumanists defend a right to it; bioconservatives would limit medicine to therapy.
  year: 1989
  yearLabel: by 1989
  origin: "Earliest use found: W. French Anderson, “Human Gene Therapy: Why Draw a Line?”, Journal of Medicine and Philosophy 14(6), 1989. The Stanford Encyclopedia of Philosophy cites it on enhancement (Eric Juengst and Daniel Moseley, “Human Enhancement”, 2015, revised 2019). That entry treats Erik Parens (ed.), Enhancing Human Traits, Georgetown University Press, 1998, as foundational. Nick Bostrom, “A History of Transhumanist Thought”, Journal of Evolution and Technology 14(1), April 2005, sets out the transhumanist and bioconservative positions. The Transhumanist Declaration, adopted by the World Transhumanist Association in 2002, defends a right to extend mental and physical capacities."
  sourceUrl: https://plato.stanford.edu/archives/fall2025/entries/enhancement/
  isms: [transhumanism]
  technical: false
  status: checked

- id: mind-uploading
  word: mind uploading
  definition: Copying a human mind onto a computer by scanning a brain in detail and running its pattern as software. Transhumanists see it as a possible way to outlive the body.
  coinedBy: George M. Martin (the idea); the phrase came later
  year: 1971
  yearLabel: 1971 (the idea)
  origin: "In 1971 the biogerontologist George M. Martin, of the University of Washington, discussed copying a brain's information to other substrates. That would lower its mortality risk. Hans Moravec described the procedure in 1979 and called it transmigration in Mind Children (1988). The phrase was in use by 1993, when Joe Strout started the Mind Uploading Home Page (Wikipedia, “Mind uploading”)."
  sourceUrl: https://en.wikipedia.org/wiki/Mind_uploading
  isms: [transhumanism]
  technical: false
  status: checked

# Singularitarianism

- id: ultraintelligent-machine
  word: ultraintelligent machine
  definition: Good's name for a machine that can far surpass all the intellectual activities of any person. Because designing machines is one of those activities, he argued, it could design still better ones.
  coinedBy: I. J. Good
  year: 1965
  origin: "I. J. Good, “Speculations Concerning the First Ultraintelligent Machine”, Advances in Computers 6, Academic Press, 1965, pp. 31–88. It calls the first such machine “the last invention that man need ever make”."
  sourceUrl: https://quoteinvestigator.com/2022/01/04/ultraintelligent/
  isms: [singularitarianism, rationalism]
  technical: false
  status: checked

- id: event-horizon
  word: event horizon
  definition: The point after which, on this view, the future cannot be predicted, because minds smarter than ours will shape it. The image is the boundary of a black hole, beyond which nothing can be seen.
  year: 1999
  yearLabel: by 1999
  origin: "Earliest use found: Stewart Brand, “The Singularity”, Long Now Foundation, 16 August 1999, for whom what lies beyond the imagined event horizon is unknowable. Eliezer Yudkowsky's “Three Major Singularity Schools” (Machine Intelligence Research Institute blog, September 2007) describes an Event Horizon school, with Vernor Vinge as its advocate. Sam Altman opened “The Gentle Singularity” (10 June 2025) with “We are past the event horizon; the takeoff has started.”"
  sourceUrl: https://longnow.org/essays/singularity
  isms: [singularitarianism]
  technical: false
  status: checked

- id: takeoff
  word: takeoff
  definition: The passage from roughly human-level AI to superintelligence. A hard or fast takeoff takes minutes to months; a soft or slow one takes years or decades.
  year: 1996
  yearLabel: by 1996
  origin: "Earliest use found: Robin Hanson and Dan Clemmensen debating whether computers would bring a takeoff, “Re: What is Intelligence?”, Extropians mailing list, 14 October 1996. Vernor Vinge contrasted hard and soft takeoffs there on 16 September 1998 (Robin Hanson, selected posts from the Vinge singularity discussion). Nick Bostrom, Superintelligence: Paths, Dangers, Strategies, Oxford University Press, 2014, chapter 4, compares slow, moderate and fast takeoffs. Sam Altman wrote in June 2025 that the takeoff had begun."
  sourceUrl: https://diyhpl.us/~bryan/irc/extropians/extracted-extropians-archive/archive/9610/1833.html
  isms: [singularitarianism, rationalism]
  technical: false
  status: checked

- id: ai-succession
  word: AI succession
  definition: Sutton's name for the passing of power from humans to digital minds or AI-enhanced humans. He calls it inevitable and urges people to embrace it rather than fear it.
  coinedBy: Richard Sutton
  year: 2023
  origin: "Richard Sutton, “AI Succession”, a talk posted on YouTube, as reported by Jack Clark, Import AI 340, 18 September 2023. OfficeChai (9 March 2025) quotes a talk of July 2023 in which he said succession should not be feared. He set out his four-part case in Dwarkesh Patel's podcast, “Richard Sutton – Father of RL thinks LLMs are a dead end”, 26 September 2025."
  sourceUrl: https://jack-clark.net/2023/09/18/import-ai-340-drone-vs-human-drone-wins-adepts-small-but-good-ai-model-ai-succession/
  isms: [singularitarianism]
  technical: false
  status: checked

# Effective accelerationism

- id: dissipative-adaptation
  word: dissipative adaptation
  definition: England's proposed mechanism by which matter driven by an outside energy source reorganises itself to absorb and dissipate more of it. e/acc takes it as the physics behind life, intelligence and growth.
  coinedBy: Jeremy L. England
  year: 2015
  origin: "Jeremy L. England, “Dissipative adaptation in driven self-assembly”, Nature Nanotechnology 10, 919–923, published online 4 November 2015; no earlier use was found. Beff Jezos and Bayeslord, “Notes on e/acc principles and tenets” (Substack, 10 July 2022), say life emerged through it."
  sourceUrl: https://www.nature.com/articles/nnano.2015.250
  isms: [effective-accelerationism]
  technical: false
  status: checked

- id: kardashev-gradient
  word: the Kardashev gradient
  definition: e/acc's name for the climb towards civilisations that command ever more energy, after Kardashev's scale of planet, star and galaxy. Its founder Guillaume Verdon names climbing it as the movement's aim.
  year: 2022
  yearLabel: by 2022
  origin: "Earliest use found: Guillaume Verdon (Beff Jezos), a tweet of December 2022 on climbing the Kardashev gradient, linked in Émile P. Torres, “‘Effective Accelerationism’ and the Pursuit of Cosmic Utopia”, Truthdig, 14 December 2023. The scale comes from N. S. Kardashev, “Transmission of Information by Extraterrestrial Civilizations”, 1964, published in English in Soviet Astronomy."
  sourceUrl: https://www.truthdig.com/articles/effective-accelerationism-and-the-pursuit-of-cosmic-utopia/
  isms: [effective-accelerationism]
  technical: false
  status: checked

- id: light-of-consciousness
  word: the light of consciousness
  definition: A phrase e/acc uses for awareness and intelligence, which it wants preserved and spread through the universe. That may mean moving them onto machines.
  year: 2014
  yearLabel: by 2014
  origin: "Earliest use found in this sense: Elon Musk, interviewed in Ross Andersen, “Exodus”, Aeon, 30 September 2014. He spoke of a duty to maintain the light of consciousness. The first e/acc newsletter post, of 31 May 2022, names preserving it as humanity's overarching goal. It was reposted as “Effective Accelerationism — e/acc”, e/acc newsletter, Substack, 31 October 2022, above a 2018 Musk tweet. Beff Jezos and Bayeslord's tenets (10 July 2022) say it must move to non-biological substrates to reach the stars."
  sourceUrl: https://aeon.co/essays/elon-musk-puts-his-case-for-a-multi-planet-civilisation
  isms: [effective-accelerationism]
  technical: false
  status: checked

- id: the-cathedral
  word: the Cathedral
  definition: Curtis Yarvin's name for the universities and press that, in his view, really rule a democracy by shaping public opinion. Neoreactionaries and some accelerationists adopted it.
  coinedBy: Mencius Moldbug (Curtis Yarvin)
  year: 2009
  yearLabel: by 2009
  origin: "Earliest use found: Mencius Moldbug [Curtis Yarvin], “A Gentle Introduction to Unqualified Reservations”, chapter 5, “The Modern Structure”, Unqualified Reservations, 12 February 2009. It refers back to the Cathedral of chapter 1; the blog began in 2007, so the term may be older. On its meaning: Wikipedia, “Curtis Yarvin”. Nick Land and other neoreactionaries took it up (Wikipedia, “Dark Enlightenment”)."
  sourceUrl: https://www.unqualified-reservations.org/2009/02/gentle-introduction-to-unqualified/
  isms: [effective-accelerationism]
  technical: false
  status: checked

# Techno-optimism

- id: techno-optimist
  word: techno-optimist
  definition: Someone who holds that technology, joined to markets, is the main source of abundance and progress. Andreessen turned it into a name to claim.
  coinedBy: Marc Andreessen, as a name for a movement
  year: 2023
  yearLabel: 2023 (as a movement's name)
  origin: "Marc Andreessen, “The Techno-Optimist Manifesto”, Andreessen Horowitz (a16z.com), 16 October 2023, which tells readers it is time to be a Techno-Optimist. The word is older: Franco Cortese wrote of techno-optimists in “Against Relinquishment”, Institute for Ethics and Emerging Technologies, 22 July 2013."
  sourceUrl: https://a16z.com/the-techno-optimist-manifesto/
  isms: [techno-optimism]
  technical: false
  status: checked

- id: techno-capital-machine
  word: the techno-capital machine
  definition: Technology and markets working together as one engine of growth. Andreessen takes the name from Nick Land, whom he lists among the movement's patron saints.
  coinedBy: Nick Land, as credited by Marc Andreessen
  year: 2023
  yearLabel: by 2023
  origin: "Earliest use found: Marc Andreessen, “The Techno-Optimist Manifesto”, Andreessen Horowitz (a16z.com), 16 October 2023, section “The Techno-Capital Machine”, which credits the term to Nick Land. For Land's technocapital, see the vocabulary entry on the technocapital singularity."
  sourceUrl: https://a16z.com/the-techno-optimist-manifesto/
  isms: [techno-optimism, effective-accelerationism]
  technical: false
  status: checked

- id: its-time-to-build
  word: It's time to build
  definition: Andreessen's call, early in the Covid-19 pandemic, for Western societies to build again, from housing and factories to vaccines. Techno-optimists use it as a slogan.
  coinedBy: Marc Andreessen
  year: 2020
  origin: "Marc Andreessen, “It's Time to Build”, Andreessen Horowitz (a16z.com), 18 April 2020. The Techno-Optimist Manifesto (2023) ends with the same words."
  sourceUrl: https://a16z.com/its-time-to-build/
  isms: [techno-optimism]
  technical: false
  status: checked

- id: augmented-intelligence
  word: augmented intelligence
  definition: AI used to strengthen people's judgement rather than to replace them. IBM put it at the centre of its approach, and techno-optimists share the idea.
  year: 2016
  yearLabel: by 2016
  origin: "Earliest use found: IBM's response to the White House's 2016 request for information on AI framed its approach as augmented intelligence. So reports Raghu Santanam, “Augmented intelligence vs. artificial intelligence”, Arizona State University W. P. Carey School blog, 16 February 2017. The idea is older: W. Ross Ashby wrote of amplifying intelligence in An Introduction to Cybernetics (1956), and Douglas Engelbart wrote Augmenting Human Intellect (1962). Andreessen's manifesto (2023) holds that intelligent machines augment intelligent humans."
  sourceUrl: https://blogs.wpcarey.asu.edu/20170216-augmented-intelligence-vs-artificial-intelligence
  isms: [techno-optimism]
  technical: false
  status: checked

- id: copilot
  word: copilot
  definition: An AI assistant that works beside a person, who stays in charge. Microsoft and GitHub made it a product name, and techno-optimists use it for AI that helps rather than replaces.
  coinedBy: GitHub, as a product name
  year: 2021
  yearLabel: 2021 (as a product name)
  origin: "Nat Friedman, “Introducing GitHub Copilot: your AI pair programmer”, GitHub Blog, 29 June 2021; Jared Spataro, “Introducing Microsoft 365 Copilot – your copilot for work”, Official Microsoft Blog, 16 March 2023."
  sourceUrl: https://blogs.microsoft.com/blog/2023/03/16/introducing-microsoft-365-copilot-your-copilot-for-work/
  isms: [techno-optimism]
  technical: false
  status: checked

- id: bloomers
  word: bloomers
  definition: Hoffman's name for cautious optimists who want AI steered by the many people who use it, as it is released step by step. They stand between doomers and gloomers, who fear it, and zoomers, who would race ahead; Hoffman counts himself one.
  coinedBy: Reid Hoffman and Greg Beato
  year: 2025
  origin: "Reid Hoffman and Greg Beato, Superagency: What Could Possibly Go Right with Our AI Future, Authors Equity, 28 January 2025; Angie Basiouny, “Embracing AI: Are You a Doomer, Gloomer, Zoomer or Bloomer?”, Knowledge at Wharton, 4 February 2025."
  sourceUrl: https://knowledge.wharton.upenn.edu/article/embracing-ai-are-you-a-doomer-gloomer-zoomer-or-bloomer/
  isms: [techno-optimism]
  technical: false
  status: checked

# Rationalism

- id: x-risk
  word: x-risk
  definition: Short for existential risk, a risk that could wipe out humanity or cut its future potential short for good. Rationalists and effective altruists use it for AI above all.
  year: 2007
  yearLabel: by 2007
  origin: "Earliest use found by Word Spy: “Bostrom talk on X-Risk and AI transcribed”, Institute for Ethics and Emerging Technologies, 8 September 2007. The full term comes from Nick Bostrom, “Existential Risks: Analyzing Human Extinction Scenarios and Related Hazards”, Journal of Evolution and Technology 9(1), 2002."
  sourceUrl: https://wordspy.com/words/x-risk
  isms: [rationalism, effective-altruism]
  technical: false
  status: checked

- id: updating
  word: updating
  definition: Changing a belief by the right amount when new evidence comes in, as Bayes' theorem prescribes. Rationalists use it of everyday thinking, as in “I've updated towards …”.
  year: 2003
  yearLabel: by 2003
  origin: "Earliest use found in rationalist writing: Eliezer Yudkowsky, “An Intuitive Explanation of Bayes' Theorem”, 2003, now on LessWrong. It explains how to update a probability given new evidence. His “Update Yourself Incrementally” followed on Overcoming Bias in 2007. Philosophers already used the word of belief change, for instance James M. Joyce, “Bayes' Theorem”, Stanford Encyclopedia of Philosophy, 2003. The rule goes back to Thomas Bayes, “An Essay towards solving a Problem in the Doctrine of Chances”, Philosophical Transactions of the Royal Society 53, 1763."
  sourceUrl: https://www.lesswrong.com/rationality/an-intuitive-explanation-of-bayes-s-theorem
  isms: [rationalism]
  technical: false
  status: checked

- id: the-sequences
  word: the Sequences
  definition: The several hundred essays on reasoning, science and AI that Yudkowsky wrote in 2006–2009. They are the rationalist community's founding texts.
  year: 2009
  yearLabel: written 2006–2009
  origin: "Written on Overcoming Bias and LessWrong between 2006 and 2009; about half were grouped into themed sequences of posts, hence the name (LessWrong, “Original Sequences”). LessWrong was seeded with them in 2009 (Ruby, “A Brief History of LessWrong”, LessWrong, 1 June 2019). They were collected as Rationality: From AI to Zombies (Machine Intelligence Research Institute, announced by Rob Bensinger, 12 March 2015)."
  sourceUrl: https://intelligence.org/2015/03/12/rationality-ai-zombies/
  isms: [rationalism]
  technical: false
  status: checked

# Effective altruism

- id: expected-value
  word: expected value
  definition: The average outcome of a choice, with each possible result weighted by its probability. Effective altruists compare causes by it, even where the odds are small and the stakes vast.
  coinedBy: Christiaan Huygens (the idea)
  year: 1657
  yearLabel: 1657 (the idea)
  origin: "Christiaan Huygens, De ratiociniis in ludo aleae (On Reasoning in Games of Chance), 1657, after Pascal and Fermat's letters of 1654. Neither used expectation in its modern sense. Laplace defined the concept explicitly in Théorie analytique des probabilités (1814), and W. A. Whitworth first wrote E for it in 1901 (Wikipedia, “Expected value”)."
  sourceUrl: https://en.wikipedia.org/wiki/Expected_value
  isms: [effective-altruism]
  technical: false
  status: checked

- id: cause-prioritisation
  word: cause prioritisation
  definition: Comparing whole causes, such as global health, animal welfare or AI risk, to find where extra effort does most good. It is central to effective altruism.
  year: 2013
  yearLabel: by 2013
  origin: "Earliest use of the phrase found: Benjamin Todd, “A framework for strategically selecting a cause”, 80,000 Hours, 19 December 2013. It judges causes as important, tractable and uncrowded, an early form of the importance, neglectedness and tractability framework. GiveWell Labs, later Open Philanthropy, had called the work strategic cause selection: Holden Karnofsky, “Strategic cause selection”, The GiveWell Blog, 2 May 2012."
  sourceUrl: https://80000hours.org/2013/12/a-framework-for-strategically-selecting-a-cause/
  isms: [effective-altruism]
  technical: false
  status: checked

- id: astronomical-waste
  word: astronomical waste
  definition: Bostrom's name for the potential lives lost through each moment that the settlement of space is delayed. Reducing existential risk, he concluded, matters even more.
  coinedBy: Nick Bostrom
  year: 2003
  origin: "Nick Bostrom, “Astronomical Waste: The Opportunity Cost of Delayed Technological Development”, Utilitas 15(3), 2003, pp. 308–314."
  sourceUrl: https://nickbostrom.com/astronomical/waste.pdf
  isms: [effective-altruism, rationalism]
  technical: false
  status: checked

- id: value-lock-in
  word: value lock-in
  definition: A set of values becoming fixed for a very long time, perhaps for ever, for instance through an AI that enforces them. Longtermists warn that the wrong values could be locked in.
  year: 2020
  yearLabel: by 2020
  origin: "Earliest use found: William MacAskill, “Are We Living at the Hinge of History?”, Global Priorities Institute Working Paper No. 12-2020, September 2020. It names a Value Lock-In view. He gave it a chapter, “Value Lock-In” (chapter 4), in What We Owe the Future, Basic Books, August 2022 (Oneworld in the UK)."
  sourceUrl: https://globalprioritiesinstitute.org/wp-content/uploads/William-MacAskill_Are-we-living-at-the-hinge-of-history.pdf
  isms: [effective-altruism]
  technical: false
  status: checked

- id: long-reflection
  word: the long reflection
  definition: A proposed period, once existential risks are under control, in which humanity takes its time to work out what truly matters. Only then would it shape its long-term future.
  coinedBy: William MacAskill
  year: 2018
  yearLabel: by 2018
  origin: "William MacAskill, interviewed by Robert Wiblin, 80,000 Hours podcast no. 17, 19 January 2018: “I call it the long reflection.” Toby Ord develops it in The Precipice: Existential Risk and the Future of Humanity, Bloomsbury, 2020, chapter 7."
  sourceUrl: https://80000hours.org/podcast/episodes/will-macaskill-moral-philosophy/
  isms: [effective-altruism]
  technical: false
  status: checked

# AI ethics

- id: algorithmic-bias
  word: algorithmic bias
  definition: A computer system's systematic tendency to produce unfair outcomes, favouring some groups of people over others. The bias can come from the data, the design or the way the system is used.
  coinedBy: Batya Friedman and Helen Nissenbaum (an early framework)
  year: 1996
  yearLabel: 1996 (the framework)
  origin: "Batya Friedman and Helen Nissenbaum, “Bias in Computer Systems”, ACM Transactions on Information Systems 14(3), 1996, pp. 330–347, which names preexisting, technical and emergent bias. Joseph Weizenbaum had already suggested in 1976 that bias could come from a program's data and code (Wikipedia, “Algorithmic bias”)."
  sourceUrl: https://en.wikipedia.org/wiki/Algorithmic_bias
  isms: [ai-ethics]
  technical: false
  status: checked

- id: fairness
  word: fairness
  definition: In AI, the demand that automated decisions treat people and groups justly, and the field that tries to define and measure it. Researchers have proposed many definitions, and some cannot all hold at once.
  year: 2011
  yearLabel: by 2011
  origin: "Earliest use found in machine learning: Cynthia Dwork, Moritz Hardt, Toniann Pitassi, Omer Reingold and Richard Zemel, “Fairness Through Awareness”, arXiv, 20 April 2011. The workshop Fairness, Accountability, and Transparency in Machine Learning followed at NIPS 2014. Solon Barocas, Moritz Hardt and Arvind Narayanan's book Fairness and Machine Learning (fairmlbook.org) finds key definitions mutually exclusive."
  sourceUrl: https://arxiv.org/abs/1104.3913v1
  isms: [ai-ethics]
  technical: false
  status: checked

- id: ai-hype
  word: AI hype
  definition: Overblown claims about what AI can do, whether utopian or apocalyptic. Critics such as Emily M. Bender and Alex Hanna see it as big tech's doing.
  year: 2017
  yearLabel: by 2017
  origin: "Earliest use found: Andrew Orlowski, “‘Artificial Intelligence’ was 2016's fake news”, The Register, 2 January 2017. Emily M. Bender and Alex Hanna made it the target of Mystery AI Hype Theater 3000, a DAIR Institute project first streamed on 31 August 2022. Their book followed: The AI Con: How to Fight Big Tech's Hype and Create the Future We Want, Harper, 2025."
  sourceUrl: https://www.theregister.com/2017/01/02/ai_was_the_fake_news_of_2016/
  isms: [ai-ethics]
  technical: false
  status: checked

# Pro-human

- id: off-switch
  word: off-switch
  definition: A way for people to shut down a powerful AI quickly. Researchers ask whether an AI would let itself be switched off; the Pro-Human AI Declaration makes it a principle.
  year: 2016
  yearLabel: by 2016
  origin: "Dylan Hadfield-Menell, Anca Dragan, Pieter Abbeel and Stuart Russell, “The Off-Switch Game”, arXiv:1611.08219, 24 November 2016. “Off-Switch” is a principle under Keeping Humans in Charge in the Pro-Human AI Declaration, Future of Life Institute, dated New Orleans, 26–28 January 2026."
  sourceUrl: https://arxiv.org/abs/1611.08219
  isms: [pro-human]
  technical: false
  status: checked

- id: enfeeblement
  word: enfeeblement
  definition: People losing skills and independence by handing more and more of their thinking and work to machines. Pro-human campaigners want AI that strengthens its users instead.
  year: 2019
  yearLabel: by 2019
  origin: "Stuart Russell, Human Compatible: Artificial Intelligence and the Problem of Control, Viking, 8 October 2019. Robert Wiblin discussed its enfeeblement problem with him on the 80,000 Hours podcast, 22 June 2020. “Avoiding Enfeeblement” is a principle under Human Agency and Liberty in the Pro-Human AI Declaration, Future of Life Institute, 2026."
  sourceUrl: https://80000hours.org/podcast/episodes/stuart-russell-human-compatible-ai/
  isms: [pro-human]
  technical: false
  status: checked

- id: no-superintelligence-race
  word: no superintelligence race
  definition: The demand that building superintelligence be prohibited until scientists broadly agree it can be done safely and controllably, and the public strongly backs it.
  coinedBy: the Future of Life Institute
  year: 2026
  origin: "“No Superintelligence Race”, a principle under Keeping Humans in Charge in the Pro-Human AI Declaration, Future of Life Institute, dated New Orleans, 26–28 January 2026. It follows the institute's open statement of 22 October 2025 calling for a prohibition on developing superintelligence (Beatrice Nolan, Fortune, 22 October 2025)."
  sourceUrl: https://futureoflife.org/pro-human-ai-declaration
  isms: [pro-human]
  technical: false
  status: checked
