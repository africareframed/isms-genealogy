# Words of the history of AI, recent part (deep learning, scale, the generative race).
# Same fields as words.yaml; see src/content.config.ts. Ordered by year, oldest first.
# yearLabel "by …" means only an earliest documented use is known; origin says so.
# status: draft until a checker agent has verified every claim against its source.

- id: hallucination
  word: hallucination
  definition: False or made-up output that an AI system presents as if it were true, such as an invented fact, quotation or link. Cambridge Dictionary added this sense in 2023.
  year: 2015
  yearLabel: 2010s
  origin: "No single coiner; the sense shifted over decades. Computer-vision researchers used the word from 1986 in a positive sense, for adding plausible detail to an image, and machine-translation researchers used it for a failure mode in the 2000s. Since the 2010s it has meant false output: on 21 May 2015 Andrej Karpathy wrote that his model had hallucinated a web link, and in 2017 Google researchers used it of neural machine translation. Cambridge Dictionary made “hallucinate” its word of the year on 15 November 2023. Sources: Wikipedia, “Hallucination (artificial intelligence)”; Andrej Karpathy, “The Unreasonable Effectiveness of Recurrent Neural Networks”, blog post, 21 May 2015; University of Cambridge, 15 November 2023."
  sourceUrl: https://en.wikipedia.org/wiki/Hallucination_(artificial_intelligence)
  isms: []
  technical: true
  status: checked

- id: transformer
  word: transformer
  definition: A design for neural networks built on attention mechanisms rather than recurrence or convolutions. BERT and GPT-4 are both built on it.
  coinedBy: Ashish Vaswani, Noam Shazeer, Niki Parmar, Jakob Uszkoreit, Llion Jones, Aidan Gomez, Łukasz Kaiser and Illia Polosukhin
  year: 2017
  origin: "Ashish Vaswani and seven co-authors, most of them at Google Brain and Google Research, “Attention Is All You Need”, arXiv:1706.03762, 12 June 2017, which names the architecture the Transformer. BERT (2018) is short for Bidirectional Encoder Representations from Transformers. The GPT-4 technical report (2023) calls GPT-4 a Transformer-based model."
  sourceUrl: https://arxiv.org/abs/1706.03762v1
  isms: []
  technical: true
  status: checked

- id: large-language-model
  word: large language model
  definition: A language model trained on vast amounts of text. Today the phrase usually means a neural network with billions of parameters that learns to predict the next piece of text, such as the GPT models behind ChatGPT.
  year: 2018
  yearLabel: by 2018
  origin: "No single coiner. Merriam-Webster dates the first known use in today's sense, a language model built with deep learning on an extremely large data set, to 2018. The phrase is older: in the 2000s it described very large statistical models of word sequences, as in Thorsten Brants, Ashok C. Popat, Peng Xu, Franz J. Och and Jeffrey Dean, “Large Language Models in Machine Translation”, EMNLP-CoNLL 2007, Prague, pp. 858–867. The GPT-4 technical report (2023) describes a model pre-trained to predict the next token."
  sourceUrl: https://www.merriam-webster.com/dictionary/large%20language%20model
  isms: []
  technical: true
  status: checked

- id: foundation-model
  word: foundation model
  definition: A model trained on broad data at scale that can be adapted to a wide range of tasks, such as BERT, GPT-3 or DALL-E. The name stresses both that much is built on such models and that they are unfinished.
  coinedBy: Rishi Bommasani, Percy Liang and colleagues at Stanford's Center for Research on Foundation Models
  year: 2021
  origin: "Rishi Bommasani and others, with Percy Liang as corresponding author, “On the Opportunities and Risks of Foundation Models”, arXiv:2108.07258, 16 August 2021. More than 100 people at Stanford's Center for Research on Foundation Models contributed. The authors weighed other names, such as pretrained model, and chose one that conveys both incompleteness and high stakes. The Bletchley Declaration (2023) counts foundation models among frontier AI."
  sourceUrl: https://arxiv.org/abs/2108.07258v1
  isms: []
  technical: true
  status: checked

- id: stochastic-parrot
  word: stochastic parrot
  definition: A critics' image of a large language model as a system that stitches together sequences of words it has seen, guided by probability, with no regard for what they mean.
  coinedBy: Emily M. Bender, Timnit Gebru, Angelina McMillan-Major and Margaret Mitchell (as Shmargaret Shmitchell)
  year: 2021
  origin: "“On the Dangers of Stochastic Parrots: Can Language Models Be Too Big?”, FAccT '21, ACM, March 2021, section 6.1. Before it appeared, Google asked its employees to retract it or remove their names, and Gebru's employment there ended in December 2020. Shortly after ChatGPT's release, Sam Altman posted “i am a stochastic parrot, and so r u”. Source: Wikipedia, “Stochastic parrot”."
  sourceUrl: https://en.wikipedia.org/wiki/Stochastic_parrot
  isms: [ai-ethics]
  status: checked

- id: frontier-model
  word: frontier model
  definition: One of the most capable AI models of its time. In policy use, frontier AI means highly capable foundation models whose dangerous capabilities could pose severe risks to public safety.
  coinedBy: Markus Anderljung and colleagues (first definition)
  year: 2023
  origin: "Markus Anderljung, Joslyn Barnhart, Jade Leung, Anton Korinek and others, “Frontier AI Regulation: Managing Emerging Risks to Public Safety”, arXiv:2307.03718, 6 July 2023, which Seán Ó hÉigeartaigh called the first proper definition. On 26 July 2023 OpenAI, Anthropic, Google and Microsoft launched the Frontier Model Forum. On 7 September 2023 the UK renamed its Foundation Model Taskforce the Frontier AI Taskforce. Nerlich found earlier uses of “frontier AI”, from 2018, in a neutral sense of advanced research. Source: Brigitte Nerlich, “Frontier AI: tracing the origin of a concept”, Making Science Public, 20 October 2023."
  sourceUrl: https://makingsciencepublic.com/2023/10/20/frontier-ai-tracing-the-origin-of-a-concept/
  isms: []
  technical: true
  status: checked
