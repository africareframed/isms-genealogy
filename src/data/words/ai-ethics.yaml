# Words of AI ethics (incl. AI as normal technology). Same fields as words.yaml; see src/content.config.ts.
# Ordered by year of coinage or earliest documented use, oldest first.
# yearLabel "by …" means only an earliest documented use is known; origin says so.
# status: draft until a checker agent has verified every claim against its source.

- id: weapons-of-math-destruction
  word: weapons of math destruction
  definition: O'Neil's name for mathematical models that make decisions about people's lives at scale while staying opaque, unregulated and hard to contest. She argues that they reinforce discrimination against the poor.
  coinedBy: Cathy O'Neil
  year: 2012
  yearLabel: by 2012
  origin: "Cathy O'Neil, “It's May Day!”, mathbabe.org, 1 May 2012, announcing her talk “Weapons of Math Destruction” at the Free University in Madison Square Park, New York: the earliest use found. Her book Weapons of Math Destruction: How Big Data Increases Inequality and Threatens Democracy (Crown, September 2016) made the phrase known; it was longlisted for the National Book Award for Nonfiction in 2016 (Wikipedia, “Weapons of Math Destruction”)."
  sourceUrl: https://mathbabe.org/2012/05/01/its-may-day/
  isms: [ai-ethics]
  technical: false
  status: checked

- id: coded-gaze
  word: the coded gaze
  definition: Buolamwini's name for the way algorithmic systems reflect the biases of the people who build them. She came to it after face-analysis software she worked with at MIT failed to detect her own face.
  coinedBy: Joy Buolamwini
  year: 2016
  origin: "Joy Buolamwini, “How I'm fighting bias in algorithms”, TEDxBeaconStreet, November 2016, where she describes a phenomenon she calls the coded gaze. A short film of the same year is called The Coded Gaze, and she founded the Algorithmic Justice League in 2016 (Wikipedia, “Joy Buolamwini”; ajl.org/about)."
  sourceUrl: https://www.ted.com/talks/joy_buolamwini_how_i_m_fighting_bias_in_algorithms
  isms: [ai-ethics]
  technical: false
  status: checked

- id: fauxtomation
  word: fauxtomation
  definition: Work presented as done by machines but in fact done by people, often unpaid or poorly paid, whose labour the technology hides. Taylor's examples include self-service kiosks and the content moderators who screen social media feeds.
  coinedBy: Astra Taylor
  year: 2018
  origin: "Astra Taylor, “The Automation Charade”, Logic, issue 5 (“Failure”), 1 August 2018, which proposes the word in place of automation."
  sourceUrl: https://logicmag.io/failure/the-automation-charade/
  isms: [ai-ethics]
  technical: false
  status: checked

- id: ghost-work
  word: ghost work
  definition: Work done by people that customers believe is done by an automated process, such as flagging content or proofreading for online services. The book that named it warns against Silicon Valley building a new global underclass.
  coinedBy: Mary L. Gray and Siddharth Suri
  year: 2019
  origin: "Mary L. Gray and Siddharth Suri, Ghost Work: How to Stop Silicon Valley from Building a New Global Underclass, Houghton Mifflin Harcourt, Boston, 2019 (Wikipedia, “Mary L. Gray”; library catalogue). Gray is an anthropologist and Suri a computer scientist (Wikipedia, “Ghost work”). The examples are from the book's description (Bookshop.org)."
  sourceUrl: https://en.wikipedia.org/wiki/Ghost_work
  isms: [ai-ethics]
  technical: false
  status: checked

- id: ai-snake-oil
  word: AI snake oil
  definition: AI sold for what it does not and cannot do. Narayanan's main target was software that claims to predict social outcomes, such as reoffending or job performance, yet does little better than simple scoring.
  coinedBy: Arvind Narayanan
  year: 2019
  yearLabel: by 2019
  origin: "Arvind Narayanan, “How to recognize AI snake oil”, slides of a talk at MIT in November 2019, the earliest use of the phrase found; Princeton's computer science department reported on it on 22 January 2021. He developed it with Sayash Kapoor into the book AI Snake Oil, Princeton University Press, September 2024."
  sourceUrl: https://www.cs.princeton.edu/~arvindn/talks/MIT-STS-AI-snakeoil.pdf
  isms: [ai-ethics]
  technical: false
  status: checked

- id: normal-technology
  word: normal technology
  definition: The view that AI is a technology like electricity or the internet. It is transformative, but spreads over decades and remains a tool people can control, not a superintelligent agent.
  coinedBy: Arvind Narayanan and Sayash Kapoor (in this sense)
  year: 2025
  origin: "Arvind Narayanan and Sayash Kapoor, “AI as Normal Technology”, Knight First Amendment Institute at Columbia University, 15 April 2025. Their newsletter now carries the same name (normaltech.ai)."
  sourceUrl: https://knightcolumbia.org/content/ai-as-normal-technology
  isms: [ai-ethics]
  technical: false
  status: checked

- id: borg-complex
  word: Borg Complex
  definition: The belief, stated or assumed, that resisting a new technology is futile, as the Borg of Star Trek tell their victims. Sacasas uses it to expose the rhetoric of inevitability around new tools, AI among them.
  coinedBy: L. M. Sacasas
  year: 2012
  origin: 'L. M. Sacasas, “The Borg Complex”, The Frailest Thing, 18 June 2012, replying to a Washington Post column saying religion must adapt to new technology. He summed it up in “Borg Complex: A Primer”, 1 March 2013, and applied it to talk about AI in “Manufactured Inevitability and the Need for Courage”, The Convivial Society, 15 December 2025.'
  sourceUrl: https://thefrailestthing.com/2012/06/18/the-borg-complex/
  isms:
  - ai-ethics
  technical: false
  status: checked
- id: solutionism
  word: solutionism
  definition: The belief that every social or political problem has a neat technical fix. Morozov uses it against Silicon Valley's habit of recasting complex human situations as puzzles with computable solutions.
  coinedBy: Evgeny Morozov (in this sense)
  year: 2013
  origin: 'Evgeny Morozov, To Save Everything, Click Here: The Folly of Technological Solutionism, PublicAffairs and Allen Lane, March 2013. The word is older: Michael Quinion''s World Wide Words records its use in Northern Ireland during the Troubles, for people offering easy answers to hard problems. Christine Rosen (“The Imperfectionist”, The New Atlantis, 2013) notes that Morozov borrowed it from architecture and urban planning.'
  sourceUrl: https://worldwidewords.org/tw-sol1.html
  isms:
  - ai-ethics
  technical: false
  status: checked
- id: enshittification
  word: enshittification
  definition: Doctorow's word for how online platforms decay. First they are good to their users, then they squeeze users to please business customers, and finally they squeeze those customers to keep the value for themselves.
  coinedBy: Cory Doctorow
  year: 2022
  origin: Cory Doctorow, “Social Quitting”, Medium, 15 November 2022, the earliest use Language Log cites, then “How monopoly enshittified Amazon”, Pluralistic, 28 November 2022; “Tiktok's enshittification”, Pluralistic, 21 January 2023, set out the stages. The American Dialect Society named it its Word of the Year for 2023 and the Macquarie Dictionary for 2024. His book Enshittification appeared in October 2025.
  sourceUrl: https://languagelog.ldc.upenn.edu/nll/?p=67086
  isms:
  - ai-ethics
  technical: false
  status: checked
- id: rot-economy
  word: rot economy
  definition: Zitron's name for a tech industry that pursues growth above all, even as its products get worse. He applies it to the generative AI boom, which he calls a bubble.
  coinedBy: Ed Zitron
  year: 2023
  origin: Ed Zitron, “The Rot Economy”, Where's Your Ed At, 9 February 2023, a post that went viral (Wikipedia, “Ed Zitron”, which also notes it has been likened to Doctorow's enshittification). In “The Rot-Com Bubble” (Where's Your Ed At, 3 June 2024) he cast generative AI as the industry's latest bid for growth.
  sourceUrl: https://wheresyoured.at/the-rot-economy
  isms:
  - ai-ethics
  technical: false
  status: checked
- id: ai-mirror
  word: the AI mirror
  definition: Vallor's image for AI systems trained on human data. They reflect our past thinking, biases and failures back at us without understanding them, and can tempt us to stop thinking for ourselves.
  coinedBy: Shannon Vallor
  year: 2024
  origin: 'Shannon Vallor, The AI Mirror: How to Reclaim Our Humanity in an Age of Machine Thinking, Oxford University Press, June 2024. The publisher''s description says today''s AI shows only where the data say we have been.'
  sourceUrl: https://newbooksnetwork.com/the-ai-mirror
  isms:
  - ai-ethics
  technical: false
  status: checked

- id: artificial-state
  word: the Artificial State
  definition: Lepore's name for rule by machines that corporations make, which she sees replacing the liberal democratic state. It is government without the consent of the governed, and she argues it can be dismantled.
  coinedBy: Jill Lepore
  year: 2026
  origin: Jill Lepore, Tanner Lectures, Yale, February 2026; then The Rise and Fall of the Artificial State, Liveright (W. W. Norton) and Allen Lane in Britain, both 25 August 2026. She defines it as “government without consent, even government without humans” (part 1, chapter 1).
  sourceUrl: https://www.penguin.co.uk/books/483176/the-rise-and-fall-of-the-artificial-state-by-lepore-jill/9780241836552
  isms:
  - ai-ethics
  technical: false
  status: checked
