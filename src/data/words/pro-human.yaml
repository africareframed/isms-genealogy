# The pro-human movement's own words (one file per ism keeps parallel work free of merge conflicts).
# Fields: see src/content.config.ts (words). Oldest first. status: draft until checked.

- id: keep-the-future-human
  word: keep the future human
  definition: Anthony Aguirre's call to stop building smarter-than-human general AI and to build trustworthy AI tools instead. The Future of Life Institute used it as the rallying call of its 2026 Pro-Human Assembly.
  coinedBy: Anthony Aguirre
  year: 2025
  origin: "Anthony Aguirre, Keep the Future Human: Why and How We Should Close the Gates to AGI and Superintelligence, and What We Should Build Instead, arXiv:2311.09452v4, 7 March 2025. Its first version (November 2023) was titled Close the Gates to an Inhuman Future. On the Assembly: the Future of Life Institute's posts on X, September 2026, collected by Digg."
  sourceUrl: https://keepthefuturehuman.ai/
  isms: [pro-human]
  technical: false
  status: draft

- id: humans-first
  word: Humans First
  definition: A motto for putting people ahead of machines and the companies that build them. It is also the name of a conservative group that campaigns against AI's harms to jobs, children and communities.
  coinedBy: Joe Allen (as a motto)
  year: 2025
  origin: "Veronica Irwin, “The Jan 6 organizer getting conservatives riled up about AI”, Transformer, 13 August 2026: Allen summed up his views as “Humans First” in May 2025 and helped start the group, incorporated in January 2026."
  sourceUrl: https://transformernews.ai/p/the-jan-6-organizer-getting-conservatives-angry-about-ai
  isms: [pro-human]
  technical: false
  status: draft

- id: pro-human
  word: pro-human
  definition: The stance that AI should serve people rather than replace them, with humans kept in charge. Its holders use it to say they are not against technology.
  coinedBy: Future of Life Institute (in this sense)
  year: 2026
  yearLabel: by 2026
  origin: "Earliest use found here: Anthony Aguirre, launching the Protect What's Human campaign, said it “isn't anti-tech, it's pro-human” (Future of Life Institute, press release, 9 February 2026). The Pro-Human AI Declaration of 4 March 2026 used it to name an emerging movement."
  sourceUrl: https://futureoflife.org/press-release/fli-launches-multimillion-dollar-nationwide-ai-regulation-campaign/
  isms: [pro-human]
  technical: false
  status: draft

- id: race-to-replace
  word: race to replace
  definition: The movement's name for the AI industry's drive to build machines that take over human roles. In the declaration's account, people are replaced first as creators, counsellors, carers and companions, then in most jobs and decisions.
  coinedBy: The Pro-Human AI Declaration
  year: 2026
  origin: "Preamble of the Pro-Human AI Declaration, Future of Life Institute, March 2026. In October 2025 Anthony Aguirre had already accused AI companies of building AI designed to replace people (AFP, 22 October 2025)."
  sourceUrl: https://futureoflife.org/pro-human-ai-declaration
  isms: [pro-human]
  technical: false
  status: draft

- id: bot-or-not
  word: bot-or-not
  definition: The rule that AI-generated content that could pass for a person's work must be clearly labelled as made by AI.
  coinedBy: The Pro-Human AI Declaration (as a named principle)
  year: 2026
  origin: "“Bot-or-Not Labeling”, a principle of the Pro-Human AI Declaration, Future of Life Institute, March 2026. The idea is older: in 2018 the Center for Humane Technology backed a California bill to ban bots that do not identify themselves (The New York Times, via CNBC, 4 February 2018)."
  sourceUrl: https://futureoflife.org/pro-human-ai-declaration
  isms: [pro-human]
  technical: false
  status: draft

- id: no-ai-personhood
  word: no AI personhood
  definition: The principle that AI systems must never be given legal personhood, nor be designed so that they would deserve it. Pope Leo XIV argued the same in 2026, calling machines tools, not persons.
  coinedBy: The Pro-Human AI Declaration (as a named principle)
  year: 2026
  origin: "“No AI Personhood”, a principle of the Pro-Human AI Declaration, Future of Life Institute, March 2026; Pope Leo XIV, address to “The Future of AI” dialogue, 30 October 2026."
  sourceUrl: https://futureoflife.org/pro-human-ai-declaration
  isms: [pro-human]
  technical: false
  status: draft
