# Notable figures for AI ethics (one file per ism). Names only: no portraits (owner, 20 Nov 2026).
# Ids carry an -ai-ethics suffix so they stay unique when other isms add the same people.
- id: emily-m-bender-ai-ethics
  name: Emily M. Bender
  lifespan: born 1973
  isms: [ai-ethics]
  note: Linguist at the University of Washington. Co-wrote Stochastic Parrots and, with Alex Hanna, The AI Con.
  entry: ai-ethics/2025-the-ai-con
- id: alex-hanna-ai-ethics
  name: Alex Hanna
  isms: [ai-ethics]
  note: Sociologist and director of research at DAIR. Co-hosts Mystery AI Hype Theater 3000 with Emily M. Bender.
  entry: ai-ethics/2025-the-ai-con
- id: arvind-narayanan-ai-ethics
  name: Arvind Narayanan
  isms: [ai-ethics]
  note: Princeton computer scientist who directs its Center for Information Technology Policy. Co-wrote AI Snake Oil and “AI as Normal Technology”.
  entry: ai-ethics/2025-normal-technology
- id: sayash-kapoor-ai-ethics
  name: Sayash Kapoor
  isms: [ai-ethics]
  note: Computer scientist with a Princeton doctorate, who joins UC Berkeley's School of Information in 2027. Co-wrote AI Snake Oil and “AI as Normal Technology” with Narayanan.
  entry: ai-ethics/2024-ai-snake-oil
- id: timnit-gebru-ai-ethics
  name: Timnit Gebru
  lifespan: born 1983
  isms: [ai-ethics]
  note: Computer scientist. Co-led Google's ethical AI team until December 2020, then founded DAIR. Co-wrote Gender Shades and Stochastic Parrots.
  entry: ai-ethics/2021-stochastic-parrots
- id: margaret-mitchell-ai-ethics
  name: Margaret Mitchell
  lifespan: born 1983
  isms: [ai-ethics]
  note: Computer scientist who co-led Google's ethical AI team with Gebru and was fired in February 2021. Proposed model cards, for more transparent reporting on trained models.
  entry: ai-ethics/2021-stochastic-parrots
- id: joy-buolamwini-ai-ethics
  name: Joy Buolamwini
  lifespan: born 1990
  isms: [ai-ethics]
  note: Computer scientist who named the coded gaze and founded the Algorithmic Justice League in 2016.
  entry: ai-ethics/2018-gender-shades
- id: kate-crawford-ai-ethics
  name: Kate Crawford
  lifespan: born 1974
  isms: [ai-ethics]
  note: Researcher at Microsoft Research and co-founder of AI Now. Her Atlas of AI (2021) is about the power, politics and planetary costs of AI.
  entry: ai-ethics/2017-ai-now
- id: cathy-oneil-ai-ethics
  name: Cathy O'Neil
  lifespan: born 1972
  isms: [ai-ethics]
  note: Mathematician who left finance and wrote Weapons of Math Destruction. Founded an algorithmic auditing firm, ORCAA.
  entry: ai-ethics/2016-weapons-of-math-destruction
- id: julia-angwin-ai-ethics
  name: Julia Angwin
  isms: [ai-ethics]
  note: Journalist. Lead author of ProPublica's Machine Bias investigation, she co-founded The Markup in 2018.
  entry: ai-ethics/2016-machine-bias
- id: batya-friedman-ai-ethics
  name: Batya Friedman
  isms: [ai-ethics]
  note: Professor at the University of Washington Information School, known for value sensitive design. Co-wrote Bias in Computer Systems with Helen Nissenbaum.
  entry: ai-ethics/1996-bias-in-computer-systems
- id: joseph-weizenbaum-ai-ethics
  name: Joseph Weizenbaum
  lifespan: 1923–2008
  isms: [ai-ethics]
  note: MIT computer scientist who fled Nazi Germany as a boy, wrote ELIZA, and then became one of the leading critics of AI.
  entry: ai-ethics/1976-computer-power-and-human-reason

- id: meredith-whittaker-ai-ethics
  name: Meredith Whittaker
  isms:
  - ai-ethics
  note: President of Signal since 2022 and co-founder of the AI Now Institute. She calls AI a surveillance technology, tied to the business model of big tech firms.
  entry: ai-ethics/2017-ai-now
- id: shannon-vallor-ai-ethics
  name: Shannon Vallor
  isms:
  - ai-ethics
  note: Philosopher who holds the Baillie Gifford Chair in the Ethics of Data and AI at Edinburgh. In The AI Mirror (2024) she argues that AI reflects our past back at us and tempts us to stop thinking for ourselves.
- id: evgeny-morozov-ai-ethics
  name: Evgeny Morozov
  lifespan: born 1984
  isms:
  - ai-ethics
  note: Belarusian-born writer who attacked Silicon Valley's urge to fix every problem with technology, which he called solutionism (2013). In 2023 he named the faith in AGI “A.G.I.-ism”.
- id: l-m-sacasas-ai-ethics
  name: L. M. Sacasas
  isms:
  - ai-ethics
  note: Writer of The Convivial Society, a newsletter on technology and the moral life, and executive director of the Christian Study Center of Gainesville. He coined the Borg Complex for the claim that resisting technology is futile.
- id: ed-zitron-ai-ethics
  name: Ed Zitron
  lifespan: born 1986 or 1987
  isms:
  - ai-ethics
  note: English writer and PR executive who hosts the podcast Better Offline. He argues that the generative AI boom is a bubble, with too little demand to pay for what is spent on it.
- id: cory-doctorow-ai-ethics
  name: Cory Doctorow
  lifespan: born 1971
  isms:
  - ai-ethics
  note: Canadian-British writer and special adviser to the Electronic Frontier Foundation. He coined enshittification for the way online platforms decay as they turn on their users. He wrote The Reverse Centaur's Guide to Life After AI (2026).
- id: brian-merchant-ai-ethics
  name: Brian Merchant
  isms:
  - ai-ethics
  note: Tech journalist and reporter in residence at the AI Now Institute. His Blood in the Machine (2023) recasts the Luddites as workers resisting technology used against them.

- id: jill-lepore-ai-ethics
  name: Jill Lepore
  lifespan: born 1966
  isms:
  - ai-ethics
  note: Harvard historian and New Yorker staff writer, whose If Then (2020) told the story of Simulmatics. In The Rise and Fall of the Artificial State (2026) she argues that tech companies are replacing democratic government with rule by machines.
