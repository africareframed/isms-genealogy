# Notable figures for ai-safety (one file per ism).
- id: nick-bostrom-rationalism
  name: Nick Bostrom
  lifespan: born 1973
  isms: [ai-safety]
  note: Philosopher. His Superintelligence set out the control problem for a wide public.
  entry: ai-safety/2014-superintelligence
- id: norbert-wiener-rationalism
  name: Norbert Wiener
  lifespan: 1894–1964
  isms: [ai-safety]
  note: Mathematician and founder of cybernetics, who warned that machines may pursue the wrong purpose.
  entry: ai-safety/1960-wiener
- id: ea-william-macaskill
  name: William MacAskill
  lifespan: born 1987
  isms: [ai-safety]
  note: Philosopher who co-founded Giving What We Can, 80,000 Hours and the Centre for Effective Altruism, and named longtermism.
  entry: ai-safety/2022-what-we-owe-the-future
- id: ea-toby-ord
  name: Toby Ord
  lifespan: born 1979
  isms: [ai-safety]
  note: Philosopher and co-founder of Giving What We Can, who puts the risk of existential catastrophe this century at one in six.
  entry: ai-safety/2020-the-precipice
- id: ea-hilary-greaves
  name: Hilary Greaves
  isms: [ai-safety]
  note: Philosopher who, with MacAskill, set out the case for strong longtermism at Oxford's Global Priorities Institute.
  entry: ai-safety/2017-longtermism
- id: ea-holden-karnofsky
  name: Holden Karnofsky
  isms: [ai-safety]
  note: Co-founder of GiveWell and Open Philanthropy, who made risks from advanced AI a major priority there. Since 2025 he has worked at Anthropic.
  entry: ai-safety/2016-open-philanthropy-ai
- id: ea-dustin-moskovitz
  name: Dustin Moskovitz
  lifespan: born 1984
  isms: [ai-safety]
  note: Co-founder of Facebook and Asana. With his wife, Cari Tuna, he founded Good Ventures, the main funder behind Open Philanthropy.
  entry: ai-safety/2016-open-philanthropy-ai
- id: ea-elie-hassenfeld
  name: Elie Hassenfeld
  isms: [ai-safety]
  note: Co-founder of GiveWell with Karnofsky, and its sole head from 2017.
  entry: ai-safety/2007-givewell
- id: ea-derek-parfit
  name: Derek Parfit
  lifespan: 1942–2017
  isms: [ai-safety]
  note: Philosopher whose comparison of nuclear wars shaped the case against extinction. Late in life he supported effective altruism.
  entry: ai-safety/1984-reasons-and-persons
- id: ea-peter-singer
  name: Peter Singer
  lifespan: born 1946
  isms: [ai-safety]
  note: Philosopher whose drowning child is often cited within effective altruism. A founding member of Giving What We Can.
  entry: ai-safety/1972-famine-affluence-morality
- id: ea-henry-sidgwick
  name: Henry Sidgwick
  lifespan: 1838–1900
  isms: [ai-safety]
  note: Cambridge philosopher who held that the time at which a person lives does not change the value of their happiness.
  entry: ai-safety/1874-methods-of-ethics
