- id: techopt-reid-hoffman
  name: Reid Hoffman
  lifespan: born 1967
  isms: [techno-optimism]
  note: Co-founder of LinkedIn and investor. Argues in Superagency that AI gives people new powers.
  entry: techno-optimism/2025-superagency
- id: techopt-marc-andreessen
  name: Marc Andreessen
  lifespan: born 1971
  isms: [techno-optimism]
  note: Co-founder of Andreessen Horowitz and author of “The Techno-Optimist Manifesto”.
