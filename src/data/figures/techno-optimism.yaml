# Notable figures for Techno-optimism (one file per ism). Portraits are added by the project team only:
# put the file in public/portraits/ and fill portrait, portraitCredit and portraitLicence.
# Ids carry the prefix techopt- so they stay unique across the site.
- id: techopt-satya-nadella
  name: Satya Nadella
  lifespan: born 1967
  isms: [techno-optimism]
  note: Chief executive of Microsoft, who calls AI a cognitive amplifier and sells it as Copilot.
  entry: techno-optimism/2025-nadella-bicycles
- id: techopt-reid-hoffman
  name: Reid Hoffman
  lifespan: born 1967
  isms: [techno-optimism]
  note: Co-founder of LinkedIn and investor. Argues in Superagency that AI gives people new powers.
  entry: techno-optimism/2025-superagency
- id: techopt-marc-andreessen
  name: Marc Andreessen
  lifespan: born 1971
  isms: [techno-optimism]
  note: Co-founder of Andreessen Horowitz and author of “The Techno-Optimist Manifesto”.
  entry: techno-optimism/2023-techno-optimist-manifesto
- id: techopt-peter-diamandis
  name: Peter Diamandis
  lifespan: born 1961
  isms: [techno-optimism]
  note: Entrepreneur and co-founder of Singularity University, who argues that exponential technologies will end scarcity.
  entry: techno-optimism/2012-abundance
- id: techopt-kevin-kelly
  name: Kevin Kelly
  lifespan: born 1952
  isms: [techno-optimism]
  note: Founding executive editor of Wired. Named the system of all human technology the technium.
  entry: techno-optimism/2010-what-technology-wants
- id: techopt-steve-jobs
  name: Steve Jobs
  lifespan: 1955–2011
  isms: [techno-optimism]
  note: Co-founder of Apple, who called the personal computer a bicycle for the mind.
  entry: techno-optimism/1980-bicycle-for-the-mind
- id: techopt-douglas-engelbart
  name: Douglas Engelbart
  lifespan: 1925–2013
  isms: [techno-optimism]
  note: Computing pioneer at the Stanford Research Institute who set out a programme for augmenting human intellect.
  entry: techno-optimism/1962-augmenting-human-intellect
- id: techopt-jcr-licklider
  name: J. C. R. Licklider
  lifespan: 1915–1990
  isms: [techno-optimism]
  note: Psychologist and computing pioneer who imagined a close partnership of people and computers.
  entry: techno-optimism/1960-man-computer-symbiosis
- id: techopt-friedrich-hayek
  name: Friedrich Hayek
  lifespan: 1899–1992
  isms: [techno-optimism]
  note: Economist who argued that prices carry knowledge no planner can gather.
  entry: techno-optimism/1945-hayek-knowledge
- id: techopt-vannevar-bush
  name: Vannevar Bush
  lifespan: 1890–1974
  isms: [techno-optimism]
  note: Director of the US wartime Office of Scientific Research and Development, who imagined the memex.
  entry: techno-optimism/1945-as-we-may-think
- id: techopt-filippo-tommaso-marinetti
  name: Filippo Tommaso Marinetti
  lifespan: 1876–1944
  isms: [techno-optimism]
  note: Poet and founder of Futurism, named a patron saint in Andreessen's manifesto.
  entry: techno-optimism/1909-futurist-manifesto
- id: techopt-francis-bacon
  name: Francis Bacon
  lifespan: 1561–1626
  isms: [techno-optimism]
  note: Philosopher and statesman who tied human knowledge to power over nature.
  entry: techno-optimism/1620-novum-organum

- id: katherine-boyle-techno-optimism
  name: Katherine Boyle
  isms:
  - techno-optimism
  note: General partner at Andreessen Horowitz who coined the term American Dynamism and co-founded the firm's practice of that name. An early investor in the defence company Anduril.
  entry: techno-optimism/2022-american-dynamism
- id: alex-karp-techno-optimism
  name: Alex Karp
  isms:
  - techno-optimism
  note: Co-founder and chief executive of Palantir. His book The Technological Republic (2025), with Nicholas Zamiska, calls on Silicon Valley to rebuild its partnership with government and the military.
- id: eacc-guillaume-verdon
  name: Guillaume Verdon
  isms: [techno-optimism]
  note: Physicist behind the Beff Jezos account and co-author of e/acc's first posts. Founded the chip start-up Extropic.
  entry: techno-optimism/2022-eacc-tenets
- id: eacc-balaji-srinivasan
  name: Balaji Srinivasan
  isms: [techno-optimism]
  note: Investor and former Coinbase executive who turned exit into the plan of the network state.
  entry: techno-optimism/2022-network-state
- id: eacc-jeremy-england
  name: Jeremy England
  isms: [techno-optimism]
  note: Physicist whose theory of dissipation-driven adaptation e/acc takes as its account of life.
  entry: techno-optimism/2013-england-dissipation
- id: eacc-peter-thiel
  name: Peter Thiel
  lifespan: born 1967
  isms: [techno-optimism]
  note: Investor and PayPal co-founder. Wrote in 2009 that he no longer believed freedom and democracy were compatible.
  entry: techno-optimism/2009-thiel-libertarian
- id: eacc-curtis-yarvin
  name: Curtis Yarvin
  lifespan: born 1973
  isms: [techno-optimism]
  note: Software developer who, as Mencius Moldbug, wrote the blog from which neoreaction grew.
  entry: techno-optimism/2007-unqualified-reservations
- id: eacc-nick-land
  name: Nick Land
  lifespan: born 1962
  isms: [techno-optimism]
  note: Philosopher of accelerationism, co-founder of Warwick's Cybernetic Culture Research Unit, and author of The Dark Enlightenment.
  entry: techno-optimism/1994-meltdown
- id: eacc-gilles-deleuze
  name: Gilles Deleuze
  lifespan: 1925–1995
  isms: [techno-optimism]
  note: Philosopher. With Guattari, wrote the passage on accelerating the process that accelerationists cite.
  entry: techno-optimism/1972-anti-oedipus
- id: eacc-felix-guattari
  name: Félix Guattari
  lifespan: 1930–1992
  isms: [techno-optimism]
  note: Psychoanalyst and political activist, Deleuze's co-author on Anti-Oedipus.
  entry: techno-optimism/1972-anti-oedipus
- id: eacc-nikolai-kardashev
  name: Nikolai Kardashev
  lifespan: 1932–2019
  isms: [techno-optimism]
  note: Soviet astrophysicist who ranked civilisations by the energy they command.
  entry: techno-optimism/1964-kardashev
