- id: hubert-dreyfus
  lifespan: 1929–2017
  note: Philosopher who challenged the claims of AI research, first in a 1965 RAND paper, then in What Computers Can't Do (1972). He argued that human intelligence rests on bodies, context and culture,
    which formal rules cannot capture.
  roles:
  - writer
  - critic
