- id: arthur-samuel
  lifespan: 1901–1990
  note: IBM engineer whose checkers program was among the first programs that learned, partly by playing thousands of games against itself. He is credited with coining the term machine learning, used in
    the title of his 1959 paper.
  roles:
  - researcher
  sources:
  - for: lifespan
    source: Wikipedia, "Arthur Samuel (computer scientist)", English Wikipedia, accessed 23 November 2026
    url: https://en.wikipedia.org/wiki/Arthur_Samuel_(computer_scientist)
